name: 실제 화면 검사 (PR, 병합 전 필수)

# 배포 강제 규칙 DR3 (2026-10-15 사용자 지시): 화면 자동 검사를 통과하기 전에는 완료로 보지 않는다.
# PR 코드를 빌드해 이 실행 안에서 띄우고(vite preview), 실제 브라우저(PC·모바일)로 메인·공고 상세를 연다.
# 일반 PR은 HEAD + 운영 공개 조회를 검사한다. 미적용 canonical migration PR은
# BASE + 운영 스키마의 기존 실제 화면 검사와 HEAD + 격리 canonical 화면 검사를 구분한다.
# 운영 HEAD 전수 검증은 migration 적용·배포 후 deploy-verify에서 수행한다.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 이관 전 화면 검사 소스 구분
        id: schema-mode
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          migration=supabase/migrations/20261026231445_location_single_source.sql
          if git cat-file -e "$HEAD_SHA:$migration" 2>/dev/null && ! git cat-file -e "$BASE_SHA:$migration" 2>/dev/null; then
            echo "canonical=true" >> "$GITHUB_OUTPUT"
            echo "screen_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            printf '### 이관 전 검사 범위\n- 운영 스키마 실제 화면: BASE `%s` (읽기 전용 공개 데이터)\n- 신규 canonical 화면: HEAD `%s` (격리 fixture, PC·모바일)\n- HEAD 운영 전수 검증: 이관·배포 후 deploy-verify. 이 PR 결과를 운영 반영 검증으로 간주하지 않음.\n' "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "canonical=false" >> "$GITHUB_OUTPUT"
            echo "screen_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            printf '### 실제 화면 검사 소스\n- HEAD `%s` + 운영 공개 데이터 (읽기 전용)\n' "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 운영 스키마 호환 화면 소스 선택 (이관 PR만 BASE)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.schema-mode.outputs.screen_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 공고 이미지 유무별 틀 동일성 검사
        run: node scripts/test-job-card-layout.mjs
      - name: 앱 띄우기
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - name: PC 헤더·기업 메뉴·로그인 복귀·모바일 유지 회귀
        run: BASE_URL=http://localhost:4173 node scripts/ops/desktop-header-check.mjs
      - name: 관리자 URL 탭·뒤로가기·목록 스크롤·새 탭 링크 회귀 (PC·모바일, 격리 데이터)
        run: BASE_URL=http://localhost:4173 node scripts/ops/admin-navigation-check.mjs
      - name: 공고 목록 검사 회귀 (추천만·일반만·혼합·중복·빈 목록)
        run: node scripts/test-jobcard-integrity.mjs --self-test
      - name: 실제 공고 목록 중복·링크 검사
        run: node scripts/test-jobcard-integrity.mjs http://localhost:4173
      - name: 현재 위치 표시 정책 회귀 검사
        run: node scripts/test-job-location-detail.mjs --self-test
      - name: 실제 공고 상세 위치 검사
        run: node scripts/test-job-location-detail.mjs http://localhost:4173
      - name: CTY KDA 기준 PC·모바일 신규 공고 비교
        run: BASE_URL=http://localhost:4173 node scripts/ops/cty-kda-comparison.mjs
      - name: TEFAL 실제 공고 내용·간격·지도 검증
        run: BASE_URL=http://localhost:4173 node scripts/ops/tefal-content-acceptance.mjs
      - name: 좌표 검사 실행 명령 검증
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/jobCoords.test.ts
      - name: PC·모바일 화면 검사
        run: BASE_URL=http://localhost:4173 node scripts/ops/app-smoke.mjs
      - name: 공고 화면 도면 대조 (결정 0005, 치수 측정)
        run: |
          if [ -f docs/decisions/drawings/job-detail-layout.json ]; then
            BASE_URL=http://localhost:4173 node scripts/layout/measure.mjs check 4824 4828
          else
            echo "도면 등록 전(결정 0005 승인 대기) — 대조 생략"
          fi

      - name: 지도 요약 데모 실제 공고 검사
        if: startsWith(github.head_ref, 'demo/map-summary')
        run: BASE_URL=http://localhost:4173 node scripts/ops/map-summary-check.mjs
      - name: 지도 요약 데모 화면 보존
        if: always() && startsWith(github.head_ref, 'demo/map-summary')
        uses: actions/upload-artifact@v4
        with:
          name: map-summary-demo-proof
          path: map-summary-proof/
          retention-days: 14

      - name: 기간·계약 메뉴 메인 목록 상단 구성 검사
        if: (startsWith(github.head_ref, 'fix/menu-full-search') || github.head_ref == 'demo/home-job-filters')
        run: BASE_URL=http://localhost:4173 node scripts/ops/menu-search-check.mjs
      - name: 기간·계약 검색 확인 화면 보존
        if: always() && (startsWith(github.head_ref, 'fix/menu-full-search') || github.head_ref == 'demo/home-job-filters')
        uses: actions/upload-artifact@v4
        with:
          name: menu-search-proof
          path: menu-search-proof/
          retention-days: 14

      - name: BASE 운영 스키마 실제 화면 근거 보존 (신규 HEAD 검증 아님)
        if: always() && steps.schema-mode.outputs.canonical == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-base-live-layout-${{ github.event.pull_request.base.sha }}
          path: |
            app-smoke-result.json
            app-smoke-screens/
            layout-out/
            preview.log
          retention-days: 14

      # The preceding live-data checks execute BASE code and BASE check scripts
      # only for this schema-transition PR. Always restore HEAD before its checks.
      - name: 이관 PR 신규 HEAD 소스 복원
        if: steps.schema-mode.outputs.canonical == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: HEAD 격리 화면 의존성·빌드
        if: steps.schema-mode.outputs.canonical == 'true'
        env:
          VITE_VIETMAP_TILEMAP_KEY: fixture-browser
        run: |
          npm ci
          npm run build
      - name: HEAD 격리 서버 시작 (BASE 서버와 별도 포트)
        if: steps.schema-mode.outputs.canonical == 'true'
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort > canonical-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4174/ >/dev/null && exit 0; sleep 1; done
          cat canonical-preview.log; exit 1
      - name: HEAD canonical 원본 0·1·여러 곳 실제 핀 (격리 PC·모바일)
        if: steps.schema-mode.outputs.canonical == 'true'
        run: BASE_URL=http://localhost:4174 SCREENSHOT_DIR=canonical-pr-proof node scripts/ops/location-canonical-browser-fixtures.mjs
      - name: HEAD 헤더·관리자 이동 (격리 데이터)
        if: steps.schema-mode.outputs.canonical == 'true'
        run: |
          BASE_URL=http://localhost:4174 node scripts/ops/desktop-header-check.mjs
          BASE_URL=http://localhost:4174 node scripts/ops/admin-navigation-check.mjs
      - name: HEAD 격리 canonical 검사 근거 보존 (운영 검증 아님)
        if: always() && steps.schema-mode.outputs.canonical == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-head-canonical-proof-${{ github.sha }}
          path: |
            canonical-pr-proof/
            canonical-preview.log
          retention-days: 14
