name: 운영 배포 확인·실제 화면 검사

# 배포 강제 규칙 DR1·DR2·DR3·DR6 (2026-10-15 사용자 지시). master에 들어간 커밋마다:
#  1) Vercel이 이 커밋(github.sha)을 Production으로 배포해 READY(GitHub deployment 'success')가 됐는지 확인(최대 20분 대기)
#  2) 운영 주소(viecganban.vn)를 실제 브라우저(PC·모바일)로 열어 메인·공고 상세 검사
#  3) 실패하면 이 실행이 빨간색이 되고 '운영 배포 검증 실패' 이슈를 만든다(완료 보고 금지 근거). 같은 커밋의 열린 이슈가 있으면 다시 만들지 않는다.
#  4) 성공하면 병합 PR에 완료 댓글 1번(#1004, scripts/ci/deploy-notify.sh) — Lee 승인을 요청했던 PR에는 Lee를 멘션한다.
# Vercel은 빌드가 실패한 배포를 운영 주소에 연결하지 않으므로 빌드 실패 시 기존 정상 버전이 그대로 유지된다.
# 화면 검사만 실패한 경우의 되돌리기(rollback)는 운영 변경이라 자동으로 하지 않고 사용자 승인 후 진행한다.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: read
  issues: write
  pull-requests: write  # #1004: 병합 PR에 완료 댓글(issues: write만으로는 PR 댓글이 403 — 실행 45377084519 확인). 쓰기는 이 댓글 한 가지, 이 워크플로는 master 푸시에서만 돈다
  actions: write  # 운영 검사 성공 뒤 다음 작업 1건 착수(claude-auto.yml task-pickup 호출·같은 커밋 이전 성공 조회, Lee 2026-11-24 1순위)

concurrency:
  group: deploy-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROD_URL: https://viecganban.vn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 변경 영향 판정(HEAD~1..HEAD)용
      - name: Vercel Production 배포 READY 확인 (이 커밋)
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production&per_page=1" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" --jq '.[0].state // "pending"')
              echo "시도 $i: deployment=$id state=$state"
              if [ "$state" = "success" ]; then
                echo "- Production 배포 READY: \`${{ github.sha }}\` (deployment $id)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Vercel Production 배포 실패(state=$state). 운영 주소는 이전 정상 버전 유지."
                exit 1
              fi
            else
              echo "시도 $i: 이 커밋의 Production 배포 아직 없음"
            fi
            sleep 30
          done
          echo "::error::20분 안에 이 커밋의 Production 배포가 READY가 되지 않음"
          exit 1
      - name: 운영 검사 범위 판정 (같은 커밋 중복 제거 + 기존 변경 영향 범위 재사용)
        # 사용량 정리(Lee 2026-11-27): ① 같은 커밋이 이미 운영 검사에 성공했으면(수동 재실행·중복 호출) 브라우저 검사를 되풀이하지 않는다
        # ② 바뀐 파일이 화면과 무관한 병합(문서·크롤러·CI·시험)은 PC·모바일 기본 화면 검사(app-smoke)만 — 그 밖의 지도·메뉴·업종 검사는
        #    PR 단계와 같은 판정기(scripts/ci/change-impact.mjs)가 map·menu 영향이 있다고 한 병합에서만 돌린다(닫힌 방향: 모르면 전부).
        id: scope
        run: |
          set -uo pipefail
          dup=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-verify.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=5" --jq "[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length" 2>/dev/null || echo 0)
          [ "$dup" -gt 0 ] 2>/dev/null && dup=true || dup=false
          printf 'dup=%s\n' "$dup" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            node scripts/ci/change-impact.mjs HEAD~1 HEAD
          else
            printf 'screen=true\nmap=true\nmenu=true\n' >> "$GITHUB_OUTPUT"
          fi
          echo "- 운영 검사 범위: 같은 커밋 이전 성공 있음=$dup" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.dup != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.dup != 'true'
      - name: 브라우저 설치
        if: steps.scope.outputs.dup != 'true'
        run: npx playwright install --with-deps chromium
      - name: 운영 주소 실제 화면 검사 (PC·모바일)
        if: steps.scope.outputs.dup != 'true'
        run: BASE_URL="$PROD_URL" node scripts/ops/app-smoke.mjs
      - name: 직업코드 업종 메뉴 운영 직접 확인
        if: steps.scope.outputs.dup != 'true' && steps.scope.outputs.menu == 'true'
        env:
          SKIP_IMAGES: '1'  # 글자·메뉴만 확인 — 그림 요청 생략(scripts/ops/skip-images.mjs)
        run: BASE_URL="$PROD_URL" node scripts/ops/occupation-category-proof.mjs
      - name: 지도 요약·m 입력·위쪽 검색 결과 운영 확인
        if: steps.scope.outputs.dup != 'true' && steps.scope.outputs.map == 'true'
        env:
          SKIP_IMAGES: '1'
        run: BASE_URL="$PROD_URL" SCREENSHOT_DIR=app-smoke-screens/map-summary node scripts/ops/map-summary-check.mjs
      - name: 기간·계약 메뉴 전체 검색 운영 확인
        if: steps.scope.outputs.dup != 'true' && steps.scope.outputs.menu == 'true'
        env:
          SKIP_IMAGES: '1'
        run: BASE_URL="$PROD_URL" SCREENSHOT_DIR=app-smoke-screens/menu-search node scripts/ops/menu-search-check.mjs
      - name: 운영 화면 확인 근거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screen-proof-${{ github.sha }}
          path: |
            app-smoke-result.json
            occupation-category-proof.json
            app-smoke-screens/
          retention-days: 14
      - name: 운영 검사 성공 알림 (병합 PR에 완료 댓글 1번, #1004)
        # 앞 단계가 모두 성공했을 때만 온다. 알림 실패는 경고만(운영 검사 결과는 그대로). 같은 커밋 표시가 있으면 다시 안 남긴다.
        if: success() && github.ref == 'refs/heads/master'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/deploy-notify.sh success
      - name: 운영 검사 성공 뒤 다음 작업 1건 착수 (성공 1건당 최대 1번)
        # 앞 단계(배포 READY·실제 화면 검사)가 모두 성공했을 때만 온다. 실패면 이 단계는 돌지 않고 아래 실패 기록이 잠금 이슈를 만든다(S6).
        # 봇 병합이 부른 실행(workflow_dispatch)은 workflow_run 계기를 만들지 않으므로(administrative-pin-check 11-23 기록) 여기서 직접 부른다.
        if: success() && github.ref == 'refs/heads/master'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/ci/deploy-success-pickup.sh
      - name: 정기 수집 보충 (오늘 예약 자리가 비어 있을 때만 crawl.yml 1회, 수집·보관만)
        # #1071 A안: GitHub 예약 실행이 빠져도 운영 검사 성공 때 보충한다. dry_run·보관 고정이라 DB 저장 잡은 돌지 않는다(정기 DB 저장 중단 유지).
        # 이 스크립트는 실패해도 항상 성공으로 끝난다 — 운영 검사 결과·S6 잠금에 영향 없음.
        if: success() && github.ref == 'refs/heads/master'
        env:
          REPO: ${{ github.repository }}
        run: bash scripts/ci/crawl-catchup.sh
      - name: 실패 기록 (이슈)
        if: failure()
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/ci/deploy-notify.sh failure
