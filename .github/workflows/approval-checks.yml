name: 병합 조건 검사(approval-gate, 검사 전용 앱)
# S4 8단계(Lee 2026-11-15): 독립 검토 결과와 위험도·Lee 승인 판정을 '검사 전용 앱' 이름으로 PR 커밋에 검사 결과로 남긴다.
# (S4 B단계 2026-11-16: Claude 앱 토큰 교환은 checks:write 발급 불가 — run 43797922253 — 이라 검사 전용 앱으로 바꿈.)
# 앱 열쇠는 기존 운영 열쇠 환경 'ops-keys'(배포 브랜치 master만)에만 있고, 이 작업은 늘 master 사본만 돈다 → PR 브랜치 쪽은 같은 이름의 통과 결과를 만들 수 없다.
# master 보호 규칙에서 두 검사를 '출처 앱 = 검사 전용 앱'으로 필수 지정하는 것은 대표님 GitHub 설정이다(이 파일은 설정을 바꾸지 않는다).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  # pull_request_review 트리거는 이 파일에 두지 않는다(그 이벤트는 PR 브랜치의 이 파일 사본이 돌 수 있다).
  # 대신 review-signal.yml(권한 없는 신호 워크플로)이 끝나면 workflow_run — 항상 기본 브랜치(master) 사본 — 으로 깨어나 승인·승인 취소를 즉시 반영한다.
  workflow_run:
    workflows: ['검토 신호(승인·승인 취소 즉시 재검사 호출)']
    types: [completed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR 번호(비우면 열린 PR 전체)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read   # S6: 운영 배포 잠금이 풀렸는지 — master의 최근 성공 deploy-verify 실행 커밋 조회(approval-checks.mjs activeLocks)

# 모든 실행을 한 줄로 세운다(Codex P1): 예약 실행과 PR 이벤트 실행이 같은 커밋의 검사 결과를 동시에 갱신하면 늦게 끝난 옛 판정이 새 판정을 success로 덮을 수 있다.
# 대기 중 실행이 뒤 실행으로 바뀌어도 안전하다 — 실행마다 열린 PR 전체를 그 시점 자료로 다시 판정한다(--all).
concurrency:
  group: approval-checks
  cancel-in-progress: false

jobs:
  publish-checks:
    # 댓글 이벤트는 PR 댓글 중 Claude 검토관·Codex 결과 댓글일 때만(다른 댓글로 불필요하게 돌지 않게)
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.user.login == 'claude[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'viecganban-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 검사 전용 앱 열쇠는 기존 운영 열쇠 환경 ops-keys(master만, secret-isolation R8)에만 둔다 — PR 브랜치·다른 작업은 꺼낼 수 없다(S4 B단계, Lee 2026-11-16).
    environment: ops-keys
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 전용 앱 토큰(이 저장소, Checks 쓰기만)
        id: checks-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APPROVAL_CHECKS_APP_ID }}
          private-key: ${{ secrets.APPROVAL_CHECKS_APP_KEY }}
          permission-checks: write
      - name: 판정하고 검사 전용 앱으로 검사 결과 올리기
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKS_APP_TOKEN: ${{ steps.checks-app.outputs.token }}
          CHECKS_APP_SLUG: ${{ steps.checks-app.outputs.app-slug }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          node scripts/ci/approval-checks.mjs --repo "$GITHUB_REPOSITORY" --all ${PR:+--pr "$PR"}
