name: 운영 - 지정 SQL 실행 (수동 실행)

# 사용자 승인 후에만 수동 실행한다. scripts/ops/jobs/<name>.sql 만 실행한다. 규칙 트리거 우회 없음.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'scripts/ops/jobs 안의 SQL 파일 이름(확장자 없이)'
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: 입력 확인
        run: |
          echo "$NAME" | grep -Eq '^[a-z0-9-]+$' || { echo "::error::name 형식 오류"; exit 1; }
          test -f "scripts/ops/jobs/$NAME.sql"
          # 새 공고는 입구(ops-insert-job → ingest_job)로만 들어온다. 이 작업으로 공고·근무지·원문 보존 표에 새로 넣지 않는다.
          if grep -Eiq 'insert[[:space:]]+into[[:space:]]+(public\.)?(local_jobs|job_work_locations|job_ingest_raw|job_ingest_log)\b' "scripts/ops/jobs/$NAME.sql"; then
            echo "::error::새 공고 등록은 ops-insert-job(입구)으로만 합니다"; exit 1
          fi
      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: SQL 실행 (한 트랜잭션)
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -1 -f "scripts/ops/jobs/$NAME.sql"
