name: Supabase keep-alive

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public API (local_jobs, 1 row)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub Secrets SUPABASE_URL / SUPABASE_ANON_KEY 가 설정되지 않았습니다."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 --retry 2 \
            --output /tmp/body.json --write-out '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/local_jobs?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase 공개 API 조회 실패(HTTP $status) — 프로젝트 일시정지·장애 여부를 확인하세요."
            exit 1
          fi
          echo "OK"
