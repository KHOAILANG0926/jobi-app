name: MAP-R1 new job locations
# 2026-10-18 Lee 지시: 위치 찾기는 공고 저장 즉시 Vercel(api/location-hook)에서 한다(키는 Vercel 한 곳).
# GitHub 쪽 VietMap 키는 거부(401)돼 성공 기록 0건 → 예약 실행을 끄고 수동 실행만 남긴다.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-r1-auto-location
  cancel-in-progress: false
jobs:
  locate:
    # Explicit opt-in only AFTER pending SQL is reviewed/applied. No execution on feature branches.
    if: github.ref == 'refs/heads/master' && vars.MAP_R1_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve at most 10 unprocessed jobs (two calls per job, shared daily cap)
        env:
          MAP_R1_ENABLED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIETMAP_SERVICE_KEY: ${{ secrets.VIETMAP_SERVICE_KEY }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/auto-location/run.mjs
