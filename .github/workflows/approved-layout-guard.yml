name: 작업 범위 보호 (기준 브랜치에서 실행)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Only trusted-base code executes. No candidate code, secrets or saved credentials.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: 사전 작업 범위 밖의 파일·영역 변경 차단
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$HEAD_SHA"
          node scripts/check-work-scope.mjs "$BASE_SHA" "$HEAD_SHA"
