name: Verify TEFAL live home detail map (read-only)
on:
  push:
    branches: [ops/runner-connection-check-20261024]
    paths: ['.github/workflows/verify-tefal-live.yml','scripts/ops/verify-tefal-live.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run current branch using real production public job data
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/jobi-tefal-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Real browser proof (current branch + real public DB)
        env:
          BASE_URL: http://127.0.0.1:5173
        run: node scripts/ops/verify-tefal-live.mjs
