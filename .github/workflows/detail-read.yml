name: 상세 화면 읽기 (운영, 읽기 전용)
# Lee 2026-11-06: 등록 후 상세 화면은 작업자가 직접 읽는다(캡처 요청 금지).
# 운영 사이트 상세 화면을 PC·모바일로 열어 화면 글 전체를 로그·Summary에 남기고 화면 사진을 첨부한다. 아무것도 바꾸지 않는다.
# #646 Lee 2026-11-10: 같은 순회에서 화면 대조 검사(제목·회사 줄·Google 버튼·핀·전화·Zalo·아이콘·급여 ↔ 원문·DB).
#   번호를 비우면 공개 공고 전체를 대조만 한다. 결과는 Summary·이슈 #646 댓글·첨부 detail-read/screen-audit.json.
on:
  # 공개 중 공고 정기 화면 대조(#646 후속, Lee 2026-11-10 "물어보지 말고 진행"): 매일 아침 베트남 6시 31분 — 결과가 바뀔 때만 #646에 남김
  schedule:
    - cron: '31 23 * * *'
  workflow_dispatch:
    inputs:
      job_ids:
        description: '공고 번호(여러 개는 띄어쓰기, 예: 5506 5507). 비우면 공개 공고 전체 화면 대조'
        required: false
        default: ''
      base_url:
        description: '사이트 주소'
        required: false
        default: 'https://viecganban.vn'

permissions:
  contents: read
  issues: write

concurrency:
  group: detail-read-${{ github.event.inputs.job_ids || 'all' }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 상세 화면 읽기
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://viecganban.vn' }}
          JOB_IDS: ${{ github.event.inputs.job_ids || '' }}
          ALL_PUBLIC: ${{ (github.event_name == 'schedule' || github.event.inputs.job_ids == '') && '1' || '' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: '646'
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/detail-read.mjs
      - name: 화면 사진·글 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detail-read
          path: detail-read/
          retention-days: 14
