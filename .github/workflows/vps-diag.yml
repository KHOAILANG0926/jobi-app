name: VPS 진단 (읽기 전용)
# Lee 2026-11-07 "최종 확인하고 보고": ① 위치 확인 서버 응답 실패(precheck_unavailable) 원인 ② VPS 저장 공간 세부.
# 아무것도 지우거나 바꾸지 않는다. 키·응답 본문의 비밀값은 출력하지 않는다(응답은 판정·오류 코드만).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vps-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: ① 위치 확인 서버 응답
        run: |
          set +e
          URL="https://www.viecganban.vn/api/location-hook"
          BODY='{"precheck":{"company":"Công ty EAGLEON khu công nghiệp ECO Châu Cầu - Bắc Ninh","location":"Bắc Ninh","addresses":[]}}'
          echo "키 있음: $([ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo yes || echo no)"
          for i in 1 2; do
            curl -sS -m 70 -o /tmp/pc.json -w "HTTP %{http_code} / 걸린 시간 %{time_total}s\n" -X POST "$URL" \
              -H "content-type: application/json" -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --data "$BODY"
            echo "응답: $(python3 -c 'import json;d=json.load(open("/tmp/pc.json"));print({k:d.get(k) for k in ("findable","kind","reason","error")})' 2>/dev/null || head -c 200 /tmp/pc.json)"
          done
          rm -f /tmp/pc.json
          exit 0
      - name: ② 저장 공간 세부
        run: |
          set +e
          echo "== 전체"; df -h /
          echo; echo "== 관리자 권한(sudo) 가능 여부"; sudo -n true 2>/dev/null && echo yes || echo no
          echo; echo "== /var (큰 순)"; du -xh --max-depth=2 /var 2>/dev/null | sort -rh | head -15
          echo; echo "== 시스템 기록(journal)"; journalctl --disk-usage 2>/dev/null || echo "권한 없음"
          echo; echo "== 패키지 캐시(apt)"; du -sh /var/cache/apt 2>/dev/null
          echo; echo "== snap"; du -sh /var/lib/snapd 2>/dev/null; ls /var/lib/snapd/snaps 2>/dev/null
          echo; echo "== 수집용 브라우저 버전별"; du -sh "$HOME/.cache/ms-playwright"/* 2>/dev/null | sort -rh
          echo; echo "== 수집 실행기 버전(현재 사용 중)"; ls -l "$HOME/actions-runner" | grep -E "bin|externals"; cat "$HOME/actions-runner/.runner" 2>/dev/null | grep -i agentName
          echo; echo "== 실행기 도구 캐시"; du -sh "$HOME/actions-runner/_work/_tool"/*/* 2>/dev/null | sort -rh
          exit 0
      - name: ③ 메모리·강제 종료 기록
        # 2026-11-12 한국 조사: 브라우저 화면이 죽고('Target crashed') 2초 뒤 작업 전체가 취소됨 → 메모리 부족·실행기 재시작 여부 확인
        run: |
          set +e
          echo "== 메모리"; free -m; echo "CPU $(nproc)개"
          echo; echo "== 최근 24시간 메모리 부족 강제 종료"; (journalctl -k --since "-24h" 2>/dev/null || dmesg 2>/dev/null) | grep -iE "out of memory|oom-kill|killed process" | tail -20
          echo; echo "== 실행기 서비스 시작·멈춤 기록"; journalctl -u 'actions.runner.*' --since "-24h" 2>/dev/null | grep -iE "start|stop|kill|fail|exit" | tail -20 || echo "권한 없음"
          echo; echo "== 메모리 많이 쓰는 프로그램(이름만)"; ps -eo rss,comm --sort=-rss | head -8 | awk 'NR>1{printf "%d MB %s\n", $1/1024, $2}'
          exit 0
