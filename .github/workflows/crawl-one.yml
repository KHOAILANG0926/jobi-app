name: 공고 1건 수집 (수동, Vieclam24h 새 공고 1건)

# Lee 2026-10-29 "크롤링 한 개 진행하자 … 하나씩만": Vieclam24h에서 아직 DB에 없는 새 공고 1건만 수집해
# 입구(ingest_job)로 저장한다. 정기 실행 없음(수동만). 공개 여부는 DB 규칙(연락처·출처·직업분류 등)이 정한다.
# 키는 GitHub Secrets에만.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '새 공고 1건 수집·저장을 실행합니다'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: crawl-one
  cancel-in-progress: false

jobs:
  one:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 키 확인
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::GitHub Secrets에 SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: |
          python -m pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Vieclam24h 새 공고 1건 수집 → 입구로 저장
        working-directory: crawler
        run: |
          set -o pipefail
          python -u crawl_topcv.py --confirm-full-crawl --site vieclam24h --sample-limit 1 --new-only 2>&1 | tee /tmp/crawl.log || {
            echo "::error title=수집 실패::$(tail -c 1500 /tmp/crawl.log | tr '\n' ' ')"; exit 1; }
          # 결과 요약을 검사 화면에 표시(저장 번호·규칙 거부·건수)
          grep -E '신규:|규칙 거부|정책 수집 제외|파이프라인 실패|저장|inserted|id=' /tmp/crawl.log | tail -20 | while read -r line; do echo "::notice title=수집 결과::$line"; done
