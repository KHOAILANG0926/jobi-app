name: Vercel 배포 (GitHub Actions에서 직접)

# 2026-10-25 Lee 지시: "Vercel 무료 한도가 다해서 GitHub Actions + Vercel API 직접 배포로 변경".
# - 빌드는 GitHub Actions에서 하고(vercel build), Vercel에는 다 만든 결과만 올린다(vercel deploy --prebuilt).
#   → Vercel 쪽 빌드 시간을 쓰지 않는다.
# - master → 운영(Production). demo/** → 미리보기(Preview, 데모 링크용). 일반 PR마다 미리보기를 만들지 않는다
#   (PR 화면 검사는 app-screen-check.yml이 Actions 안에서 따로 한다).
# - 키는 GitHub Secrets의 VERCEL_TOKEN 한 곳에만 둔다. 앱 환경변수(VietMap 등)는 Vercel에 그대로 두고 vercel pull로 받아 빌드에만 쓴다.
# - 배포가 끝나면 GitHub 배포 기록(Production/Preview)을 남긴다 → deploy-verify.yml이 그대로 이 기록을 보고 운영 검사를 한다.
# - 실패하면 빨간색 + 이슈 "운영 배포 실패(Actions)". 운영 주소는 이전 정상 버전 유지.
# - 2026-10-25 실측: Vercel 무료 한도 "하루 배포 100번"에 걸림(api-deployments-free-per-day) → 배포 횟수를 줄인다:
#   앱 화면·서버에 영향 있는 파일이 운영 버전 이후 바뀐 커밋만 배포(검사·문서·자동 작업 파일만 바뀌면 배포 안 함 —
#   이때는 "앱 파일 변경 없음, 운영 그대로" 배포 기록만 남겨 deploy-verify가 지금 운영 화면을 그대로 검사),
#   한도로 실패했으면 2시간마다 "운영이 master보다 뒤처졌는지" 보고 따라잡기 배포(한도가 풀리면 자동 반영).
on:
  push:
    branches: [master, 'demo/**']
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '앱 파일 변경이 없어도 배포(서버 환경변수만 바꿨을 때, 예: GOONG_API_KEY 추가)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  deployments: write
  issues: write
  actions: write

concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/demo/') && 'vercel-deploy-demo-shared' || format('vercel-deploy-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # 비밀값이 아닌 식별번호(Vercel 화면에 그대로 보이는 값). jobi 프로젝트 전용 토큰은 '연결(link)' 단계를 못 하므로 번호로 바로 지정한다.
  VERCEL_ORG_ID: team_48tvt6TTdvSNgfLZLMM3bcRi
  VERCEL_PROJECT_ID: prj_l6tTPI7w8Kfz3cu2DiWzPpgKtGLU

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: VERCEL_TOKEN 확인
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub Secrets에 VERCEL_TOKEN이 없습니다. Vercel 토큰을 VERCEL_TOKEN 이름으로 등록해야 배포됩니다."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 배포가 필요한지 (운영 버전 이후 앱 파일이 바뀌었나)
        id: need
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 수동 강제 배포: Vercel 환경변수만 바뀐 경우(같은 커밋을 새 설정으로 다시 배포).
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.force }}" = true ]; then
            echo "- 수동 강제 배포(환경변수 반영)" >> "$GITHUB_STEP_SUMMARY"; echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          prod_id=""; for d in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=30" --jq '.[].id'); do
            st=$(gh api "repos/${{ github.repository }}/deployments/$d/statuses?per_page=1" --jq '.[0].state // ""'); [ "$st" = success ] && { prod_id=$d; break; }; done
          [ -n "$prod_id" ] || { echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; }
          prod=$(gh api "repos/${{ github.repository }}/deployments/$prod_id" --jq .sha)
          url=$(gh api "repos/${{ github.repository }}/deployments/$prod_id/statuses?per_page=1" --jq '.[0].environment_url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$prod" = "$(git rev-parse HEAD)" ]; then echo "go=0" >> "$GITHUB_OUTPUT"; echo "same=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git cat-file -e "$prod^{commit}" 2>/dev/null || { echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$prod" HEAD -- src api public index.html vite.config.ts vite.api.config.mjs vercel.json 'tsconfig*.json' | wc -l)
          if ! git diff --quiet "$prod" HEAD -- package.json package-lock.json; then
            if node scripts/ci/deployment-package-change.mjs "$prod"; then
              echo "- pg 시험용 개발 의존성만 추가: Vercel 배포 제외" >> "$GITHUB_STEP_SUMMARY"
            else
              changed=$((changed + 1))
            fi
          fi
          echo "- 운영 ${prod:0:7} → master ${GITHUB_SHA:0:7}, 앱 파일 차이 ${changed}개" >> "$GITHUB_STEP_SUMMARY"
          [ "$changed" -gt 0 ] && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"
      - name: 앱 파일 변경 없음 → 배포 생략, 운영 그대로 기록
        if: steps.need.outputs.go == '0' && steps.need.outputs.same != '1' && github.event_name == 'push'
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" -X POST -f ref="${{ github.sha }}" -f environment=Production \
            -F auto_merge=false -f 'required_contexts[]' -f description="앱 파일 변경 없음 — 운영 그대로(배포 생략, 한도 절약)" --jq .id)
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -X POST -f state=success \
            -f environment_url="${{ steps.need.outputs.url }}" -f description="No app changes; production unchanged" >/dev/null
          echo "- 배포 생략(앱 파일 변경 없음). 운영 그대로 기록" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.need.outputs.go == '1'
        with:
          node-version: 22
          cache: npm
      - name: 배포 종류 정하기
        if: steps.need.outputs.go == '1'
        id: kind
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"; echo "prod=--prod" >> "$GITHUB_OUTPUT"; echo "gh_env=Production" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"; echo "prod=" >> "$GITHUB_OUTPUT"; echo "gh_env=Preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Vercel 환경변수 받기
        if: steps.need.outputs.go == '1'
        run: |
          run() { "$@" 2>err.txt || { tail -5 err.txt | sed 's/^/::error::/'; exit 1; }; }
          run npx --yes vercel@latest pull --yes --environment=${{ steps.kind.outputs.env }} --token "$VERCEL_TOKEN"
      - name: 빌드 (Actions에서)
        if: steps.need.outputs.go == '1'
        run: |
          npx --yes vercel@latest build ${{ steps.kind.outputs.prod }} --token "$VERCEL_TOKEN" 2>&1 | tee build.txt; s=${PIPESTATUS[0]}
          [ "$s" = 0 ] || { tail -8 build.txt | sed 's/^/::error::/'; exit 1; }
      - name: Vercel에 올리기
        if: steps.need.outputs.go == '1'
        id: up
        run: |
          npx --yes vercel@latest deploy --prebuilt ${{ steps.kind.outputs.prod }} --token "$VERCEL_TOKEN" >url.txt 2>err.txt || { tail -5 err.txt | sed 's/^/::error::/'; exit 1; }
          url=$(tail -1 url.txt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- 배포 주소: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: 데모 고정 링크 붙이기 (demo/** 만)
        if: steps.need.outputs.go == '1' && startsWith(github.ref, 'refs/heads/demo/')
        run: |
          # 모든 demo/** 브랜치는 하나의 주소를 공유한다. 중복 실행은 concurrency가 순차 처리.
          alias="jobi-demo-mshw1895-6089s-projects.vercel.app"
          host="${{ steps.up.outputs.url }}"
          host="${host#https://}"
          # Vercel CLI alias 명령은 토큰의 user 조회에서 실패하므로 REST API로 직접 처리.
          meta=$(mktemp)
          status=$(curl -sS -o "$meta" -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID")
          if [ "$status" != 200 ]; then echo "Vercel deployment lookup HTTP $status"; cat "$meta"; exit 1; fi
          deployment_id=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).id" "$meta")
          [ -n "$deployment_id" ] && [ "$deployment_id" != undefined ] || { cat "$meta"; exit 1; }
          reply=$(mktemp)
          status=$(curl -sS -o "$reply" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$(node -e 'process.stdout.write(JSON.stringify({alias:process.argv[1]}))' "$alias")" \
            "https://api.vercel.com/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID")
          echo "Vercel alias HTTP $status"
          cat "$reply"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi
          echo "- 데모 고정 링크: https://$alias" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub 배포 기록 남기기 (deploy-verify가 이 기록을 본다)
        if: steps.need.outputs.go == '1'
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" -X POST \
            -f ref="${{ github.sha }}" -f environment="${{ steps.kind.outputs.gh_env }}" \
            -F auto_merge=false -f 'required_contexts[]' -f description="GitHub Actions prebuilt deploy" --jq .id)
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -X POST \
            -f state=success -f environment_url="${{ steps.up.outputs.url }}" -f description="Deployed via GitHub Actions" >/dev/null
          echo "- GitHub 배포 기록: ${{ steps.kind.outputs.gh_env }} #$id" >> "$GITHUB_STEP_SUMMARY"
      - name: 따라잡기 배포 뒤 운영 화면 검사 시작(예약 실행일 때)
        if: steps.need.outputs.go == '1' && github.event_name != 'push' && github.ref == 'refs/heads/master'
        run: gh workflow run deploy-verify.yml --repo "${{ github.repository }}" --ref master
      - name: 위치 못 찾은 공고 다시 찾기 (운영 반영 후 — 고친 위치 코드로)
        if: steps.need.outputs.go == '1' && github.ref == 'refs/heads/master'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # 2026-10-25: 위치 코드를 고쳐도 다음 날 03:00까지 기다리지 않게. 같은 주소 재호출·하루 한도는 DB가 지킨다.
          [ -n "$SUPABASE_DB_URL" ] || { echo "::warning::SUPABASE_DB_URL 없음 — 건너뜀"; exit 0; }
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          n=$(psql "$SUPABASE_DB_URL" -X -At -c "select public.map_r1_retry_unlocated()")
          echo "- 위치 못 찾은 공고 다시 찾기 요청: ${n}건" >> "$GITHUB_STEP_SUMMARY"
      - name: 실패 기록 (이슈)
        if: failure() && github.ref == 'refs/heads/master'
        run: |
          title="운영 배포 실패(Actions)"
          body="커밋 ${{ github.sha }} 운영 배포 실패. 운영 주소는 이전 정상 버전 유지. 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue comment --repo "${{ github.repository }}" "$num" --body "$body"; else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
