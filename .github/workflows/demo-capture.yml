name: 데모 움직임 촬영 (demo 브랜치)
on:
  push:
    branches: ['demo/**']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium && sudo apt-get install -y -qq imagemagick
      - name: 촬영
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/demo/capture-motion.mjs 5157
          montage out/pc-*.png -tile 2x -geometry +4+4 out/pc-sheet.png || true
          montage out/mobile-*.png -tile 4x -geometry +4+4 out/mobile-sheet.png || true
      - name: 저장 (screens 브랜치 demo 칸 — 운영 모바일 캡처 칸은 그대로, Codex #680)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/demo-out
          cp out/*sheet.png /tmp/demo-out/ 2>/dev/null || true
          cp out/pc-00.png out/mobile-00.png out/desc-*.png /tmp/demo-out/ 2>/dev/null || true
          scripts/ops/publish-screens.sh /tmp/demo-out demo "demo capture ${GITHUB_SHA::7}"
