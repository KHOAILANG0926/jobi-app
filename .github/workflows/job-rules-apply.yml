name: 공고 규칙 DB 시험

# 규칙 적용은 migrations-apply.yml만 담당한다. 과거 SQL 재적용으로 새 R3를 되돌리지 않는다.
# 이 워크플로는 기존 규칙 적용 이력을 확인하고 실제 DB 시험을 실행한다.
# 키는 GitHub Secrets에만 있다(PC에 저장 금지). 시험 결과는 job_posting_rules.last_test_*에 기록되고,
# 이어서 STATUS 생성기를 다시 돌려 status 브랜치 STATUS.md에 반영된다.
# 필요한 Secrets: SUPABASE_DB_URL (운영 DB 직접 연결 문자열, 이미 등록됨)
on:
  push:
    branches: [master]
    paths:
      - supabase/migrations/20261013100000_job_posting_rules.sql
      - supabase/tests/job_posting_rules_test.sql
      - scripts/ocr/**
      - .github/workflows/job-rules-apply.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # 끝에서 status-report 워크플로를 실행시키기 위함

concurrency:
  group: job-rules-apply
  cancel-in-progress: false

jobs:
  apply-and-test:
    environment: ops-keys  # S4: 운영 열쇠는 master에서만 받는 환경(브랜치·PR 코드에는 안 줌)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 키 등록 확인
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::GitHub Secrets에 SUPABASE_DB_URL이 없습니다."; exit 1; }

      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OCR 대조 로직 시험 (KDA 급여 310.000đ = 310k 포함)
        run: node --experimental-strip-types scripts/ocr/ocr-compare.test.mjs

      - name: 정상 migration 적용 이력 확인 (과거 SQL 재적용 금지)
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists(select 1 from supabase_migrations.schema_migrations where version='20261013100000') then raise exception 'Baseline rules must be applied through migrations-apply'; end if; end \$\$;"

      # 2026-11-16(#858): 운영 DB에 시험 공고를 넣고 지우던 R1~R7·U2 시험과 그 결과 기록 단계를 뺐다.
      # 10-29 입구 트리거(trg_000_ingest_gateway_only, 직접 insert 거부) 뒤로 시험 insert가 모두 막혀 11-12부터 전 규칙이 '실패'로 보였다(run 43687539636).
      # 같은 시험 SQL은 시험용 DB에서 돈다: supabase/tests/job_posting_rules.pglite.test.mjs(occupation-publication-check.yml).
      - name: STATUS 다시 생성 요청
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run status-report.yml --repo "$GITHUB_REPOSITORY" --ref master || echo "::warning::STATUS 재실행 요청 실패"
