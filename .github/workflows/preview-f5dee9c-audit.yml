name: Preview f5dee9c screen audit
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'audit/preview-f5dee9c-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/ops/preview-f5dee9c-audit.mjs 2>&1 | tee preview-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-f5dee9c-captures
          path: |
            mobile-audit/
            preview-audit.log
          retention-days: 14
