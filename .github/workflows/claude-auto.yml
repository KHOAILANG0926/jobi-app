name: Claude 자동 작업 (지시 실행 + Codex 검사 대응)

# AI 팀(Lee 2026-11-08 "팀을 만들자"): Claude = 개발, GPT Codex = PR 검사관.
# ① 수동 지시(workflow_dispatch): 새 브랜치 + PR. master 직접 push 없음.
# ② (중지 2026-11-09, #582) Codex 지적 자동 대응 잡은 Claude 실행이 2초 만에 실패만 반복해(실제 실행 0회) 뺐다.
#    Codex 지적은 작업 세션(낮 작업·밤 근무)이 직접 고치거나 근거를 답한다(<!-- claude-codex-reply -->).
#    다시 켜려면 git 기록(이 파일 2026-11-08판)의 codex-response 잡을 되살리고 #582 원인부터 고친다.
# 열쇠: 구독 열쇠 CLAUDE_CODE_OAUTH_TOKEN(추가 요금 없음). 없을 때만 ANTHROPIC_API_KEY로 대신한다.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Claude에게 지시할 작업 내용'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-auto-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  claude-task:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Claude Code 실행
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |
            아래 작업을 수행해줘: ${{ inputs.task }}

            시작하기 전에 반드시 저장소 루트의 CLAUDE.md와
            VIECGANBAN_STRUCTURE_BASELINE.md를 먼저 읽고,
            거기 적힌 기존 설계 의도와 작업 규칙을 최우선으로 지켜줘.

            작업 순서:
            1. 요청된 범위 내에서만 코드를 수정한다 (범위 밖 리팩터링 금지).
            2. `npx tsc --noEmit` 과 `npm run build` 를 실행해서 통과하는지 확인한다.
               실패하면 원인을 고치고 다시 통과할 때까지 반복한다. 통과하지 못하면
               커밋하지 말고 무엇이 실패했는지 PR 설명에 남긴다.
            3. 변경 내용을 반영해 CHATGPT_HANDOFF.md를 최신 상태로 갱신한다
               (현재 작업 / 변경 내용 / 테스트 결과 / 발견된 문제 / 다음 결정사항,
               5개 항목, 과거 이력 누적 없이 최신 스냅샷으로 덮어쓴다).
            4. 절대로 API 키, Secret, 토큰 등 민감한 값을 코드나 커밋 메시지,
               PR 설명에 출력하거나 하드코딩하지 않는다.
            5. 작업이 끝나면 새 브랜치를 만들어 커밋하고 PR을 생성한다.
               master에 직접 push하지 않는다. PR 설명은 .github/pull_request_template.md 양식.
