name: STATUS 위조 감시

# 1) status 브랜치에 GitHub 봇이 아닌 계정(사람·AI)이 push하면 실패 → GitHub이 알림 메일을 보낸다.
#    (봇의 push는 GITHUB_TOKEN이라 이 워크플로를 실행시키지 않는다. 즉 여기서 실행되면 곧 사람·AI가 손댄 것이다.)
# 2) PR이 STATUS.md나 scripts/status/를 바꾸면 예외 없이 실패(보고 위조 대상 — Lee 2026-11-20 S1: '검증장치-승인' 라벨 예외 제거).
#    이름 바꾸기·복사로 빼돌린 것도 옛 이름·새 이름 모두 목록에 올려(--no-renames) 막는다.
#    status-*.yml 워크플로(이 파일 포함) 변경의 대표 승인은 여기서 보지 않는다 — 기존 approval-gate 한 곳이 Lee의 최신 커밋 공식 Approve로 판단한다(check-repository-policy는 승인 대기만으로 실패시키지 않음).
on:
  push:
    branches: [status]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: status 브랜치 직접 수정 감지
        if: github.event_name == 'push'
        run: |
          echo "::error::status 브랜치에 '${{ github.actor }}' 계정이 직접 push했습니다. STATUS.md는 봇만 쓸 수 있습니다. 이 기록은 믿지 마세요."
          exit 1

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: PR의 STATUS 직접 수정 감지
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP:-/tmp}/status-guard-changed.z"
          # 목록을 못 만들면 여기서 실패한다(set -e) — 목록 없이 통과하지 않는다.
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$list"
          if grep -zqE '^(STATUS\.md$|scripts/status/)' "$list"; then
            hit=$(grep -zE '^(STATUS\.md$|scripts/status/)' "$list" | tr '\0' '\n')
            echo "::error::PR이 STATUS.md 또는 scripts/status/를 고칩니다(예외 없음, 이름 바꾸기·복사 포함): $hit — STATUS.md는 status 브랜치에서 봇만 씁니다."
            exit 1
          else
            rc=$?
            [ "$rc" = 1 ] || { echo "::error::변경 파일 목록 검사 실패(grep 종료 $rc)"; exit "$rc"; }
          fi
          echo "STATUS 직접 수정 없음"
