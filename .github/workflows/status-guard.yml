name: STATUS 위조 감시

# 1) status 브랜치에 GitHub 봇이 아닌 계정(사람·AI)이 push하면 실패 → GitHub이 알림 메일을 보낸다.
#    (봇의 push는 GITHUB_TOKEN이라 이 워크플로를 실행시키지 않는다. 즉 여기서 실행되면 곧 사람·AI가 손댄 것이다.)
# 2) PR이 검증 장치(스크립트·워크플로)나 STATUS.md를 바꾸면 실패 → Lee가 직접 확인하기 전에는 빨간 표시가 남는다.
on:
  push:
    branches: [status]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # S3-3(#808): Lee 승인 리뷰가 달리거나 취소되면 다시 판정한다.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: status 브랜치 직접 수정 감지
        if: github.event_name == 'push'
        run: |
          echo "::error::status 브랜치에 '${{ github.actor }}' 계정이 직접 push했습니다. STATUS.md는 봇만 쓸 수 있습니다. 이 기록은 믿지 마세요."
          exit 1

      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with:
          fetch-depth: 0

      - name: PR의 검증 장치 변경 감지
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qx 'STATUS.md'; then
            echo "::error::PR이 STATUS.md를 만들거나 고칩니다. STATUS.md는 status 브랜치에서 봇만 씁니다."
            exit 1
          fi
          # 검증 장치가 이미 설치된 뒤의 변경만 막는다(최초 설치 PR은 통과).
          if git cat-file -e "$base:scripts/status/generate-status.mjs" 2>/dev/null; then
            hit=$(echo "$changed" | grep -E '^(scripts/status/|\.github/workflows/status-)' || true)
            if [ -n "$hit" ]; then
              # S3-3(#808, Lee 2026-11-14 결정 6①): 예전 '검증장치-승인' 라벨은 쓰기 권한 계정(AI 포함)이 붙일 수 있어 폐지.
              # 이 커밋(head)에 대한 Lee 계정의 GitHub 승인 리뷰(Approve)만 인정한다. 조회 실패 = 통과 안 함(닫힌 실패).
              # 모든 변경은 기존대로 STATUS.md 8번(검증 장치 변경 이력)에 7일간 경고로 남는다.
              approved=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" --jq ".[] | select(.user.login == \"KHOAILANG0926\" and .state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\") | .id" | head -1) || approved=""
              if [ -n "$approved" ]; then
                echo "검증 장치 변경: $hit — 이 커밋(${HEAD_SHA:0:7})에 Lee 승인 리뷰 있음, 통과(STATUS.md 8번에 기록됨)"
              else
                echo "::error::이 PR은 검증 장치를 바꿉니다: $hit — Lee가 내용을 확인하고 이 커밋(${HEAD_SHA:0:7})에 GitHub 승인(Approve)을 해야 병합할 수 있습니다."
                exit 1
              fi
            fi
          fi
          echo "검증 장치 변경 없음"
