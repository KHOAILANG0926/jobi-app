name: 시험 - 위치 확인 방식 비교 (#560, 수동, 운영 DB 쓰기 없음)

# Lee 2026-11-09 승인: "200건 시험 수집과 기존 방식·새 4단계 방식의 비교 측정 … 기존 운영 공고와 DB는 변경하지 않고 시험 데이터로만".
# 입력 = Facebook 미리 보기(crawl-facebook-one.yml mode=dryrun, 저장 없음) 실행 번호들. 미리 보기 파일은 1일만 보관되므로 그날 돌린다.
# 운영 DB: Google 이번 달 사용 횟수만 읽는다(한도 확인). 쓰기 없음. 공고 저장·핀·캐시 쓰기 없음.
# 키: Google·Goong은 Vercel 환경변수에서 이 실행 안에서만 받아 쓰고(로그 가림), VietMap은 기존 GitHub Secret. 새 비밀값 없음.
# 로그(공개 저장소)에는 건수만. 공고별 결과는 1일 보관 비공개 artifact.
on:
  workflow_dispatch:
    inputs:
      dryrun_run_ids:
        description: 'Facebook 미리 보기 실행 번호(쉼표로 여러 개)'
        required: true
      max_jobs:
        description: '최대 공고 수(Google Pro 호출 상한과 같음)'
        required: false
        default: '200'

permissions:
  contents: read
  actions: read

# 운영 위치 확인과 같은 Google 키 — 같은 시험은 동시에 돌리지 않는다.
concurrency:
  group: location-ladder-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: team_48tvt6TTdvSNgfLZLMM3bcRi
      VERCEL_PROJECT_ID: prj_l6tTPI7w8Kfz3cu2DiWzPpgKtGLU
      IDS: ${{ inputs.dryrun_run_ids }}
      MAX_JOBS: ${{ inputs.max_jobs }}
    steps:
      - name: 입력 확인
        run: |
          echo "$IDS" | grep -Eq '^[0-9]+(,[0-9]+)*$' || { echo "::error::실행 번호 형식 오류(숫자, 쉼표)"; exit 1; }
          echo "$MAX_JOBS" | grep -Eq '^[0-9]{1,3}$' && [ "$MAX_JOBS" -le 300 ] || { echo "::error::max_jobs는 300 이하"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 시험 도구 자체 시험(네트워크 없음)
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/location-ladder-compare.test.mjs
      - name: 미리 보기 결과 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dry"
          for id in ${IDS//,/ }; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n facebook-dryrun -D "$RUNNER_TEMP/dry/$id" || { echo "::error::미리 보기 $id 결과 없음(1일 지나 삭제됐을 수 있음)"; exit 1; }
          done
          ls "$RUNNER_TEMP"/dry/*/facebook_dryrun.json | wc -l | xargs -I{} echo "::notice::미리 보기 파일 {}개"
      - name: Google 이번 달 사용 횟수 확인(읽기만)
        env:
          SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          month=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-01)
          used=$(curl -fsS "$SUPABASE_URL/rest/v1/external_api_calls?api=eq.google_text_search&month=eq.$month&select=calls" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0]?.calls??0))')
          echo "::notice::Google Text Search 이번 달 운영 사용 ${used}회 / 운영 한도 4,500 · 이번 시험 최대 ${MAX_JOBS}회(운영 카운터에는 더하지 않음)"
          [ $((used + MAX_JOBS)) -le 4500 ] || { echo "::error::시험을 더하면 운영 한도 4,500을 넘음 — 시험 중단"; exit 1; }
      - name: 비교 실행
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VIETMAP_SERVICE_KEY: ${{ secrets.VIETMAP_SERVICE_KEY }}
        run: |
          envf="$RUNNER_TEMP/vercel.env"
          npx --yes vercel@latest env pull "$envf" --environment=production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || { echo "::error::Vercel 환경변수 받기 실패"; exit 1; }
          val() { grep -E "^$1=" "$envf" | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          GOOGLE_PLACES_API_KEY=$(val GOOGLE_PLACES_API_KEY); GOONG_API_KEY=$(val GOONG_API_KEY)
          rm -f "$envf"
          [ -n "$GOOGLE_PLACES_API_KEY" ] || { echo "::error::Vercel에서 GOOGLE_PLACES_API_KEY 값을 받지 못함(민감 값 설정이면 받을 수 없음)"; exit 1; }
          echo "::add-mask::$GOOGLE_PLACES_API_KEY"; [ -n "$GOONG_API_KEY" ] && echo "::add-mask::$GOONG_API_KEY"
          export GOOGLE_PLACES_API_KEY GOONG_API_KEY
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/location-ladder-compare.mjs \
            "$RUNNER_TEMP/result.json" "$RUNNER_TEMP"/dry/*/facebook_dryrun.json
      - name: 공고별 결과 보관(1일, 비공개)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-ladder-result
          path: ${{ runner.temp }}/result.json
          retention-days: 1
          if-no-files-found: ignore
