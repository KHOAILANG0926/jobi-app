name: 핵심 규칙 요약 동기화 검사

# Lee 2026-11-02: CLAUDE.md를 고치면 세션 시작 시 자동 표시되는 요약본(.claude/RULES_CORE.md)도 같은 PR에서 고쳐야 한다.
on:
  pull_request:
    paths: ['CLAUDE.md', '.claude/RULES_CORE.md']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CLAUDE.md만 바뀌고 요약본이 그대로면 실패
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qx 'CLAUDE.md' && ! echo "$changed" | grep -qx '.claude/RULES_CORE.md'; then
            echo "::error::CLAUDE.md가 바뀌었는데 .claude/RULES_CORE.md(세션 시작 자동 표시 요약본)가 그대로입니다. 같은 PR에서 요약본도 맞춰 주세요."
            exit 1
          fi
          echo "요약본 동기화 OK"
