name: 조사 - Google 좌표 사용 공고 (읽기 전용)

# Lee 2026-11-10: Google 좌표 대체 전에 기존 공고를 읽기 전용으로 조사 — 독립 검증 좌표 / Google 좌표만 / 대표 좌표 구분.
# 공개 화면과 같은 공개 조회(anon)만 쓴다. DB 쓰기·Google·VietMap 호출 없음, 비밀값 없음.
on:
  pull_request:
    paths:
      - scripts/ops/google-pin-survey.mjs
      - .github/workflows/google-pin-survey.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ops/google-pin-survey.test.mjs
      - name: 조사(읽기 전용)
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/google-pin-survey.mjs | tee "$RUNNER_TEMP/survey.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: google-pin-survey
          path: ${{ runner.temp }}/survey.txt
          retention-days: 7
