name: 검사 통과 PR 봇 병합
# bootstrap은 master 직접 생성. 이후 PR 검증이 완료된 것만 github-actions[bot]으로 병합.
on:
  workflow_run:
    workflows: ['PR 검사 (병합 전 필수)', '실제 화면 검사 (PR, 병합 전 필수)']
    types: [completed]
  push:
    branches: [master]
    paths: ['.github/workflows/bot-pr-automerge.yml']
  workflow_dispatch: {}
  # Codex 검사 대기(12분)·Claude 검토관 대기(20분)가 끝난 PR을 다시 보려고 15분마다 한 번 더 확인한다(Lee 2026-11-08 AI 팀).
  schedule:
    - cron: '*/15 * * * *'
  # GitHub 예약 실행은 자주 빠진다(#574: */15가 1시간 반 동안 0번). 그래서 Codex 리뷰·요약 댓글·Claude 답이
  # 오는 순간에도 다시 보고, 대기 시간은 codex-wait-timer.yml이 끝나는 시각에 다시 부른다. 예약은 예비로 둔다.
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: bot-pr-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review') ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       ((github.event.action == 'created' &&
         github.event.comment.user.login == 'KHOAILANG0926' &&
         (startsWith(github.event.comment.body, 'LEE-APPROVE ') || startsWith(github.event.comment.body, 'LEE-DEMO-APPLY '))) ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        ((github.event.comment.user.login == 'KHOAILANG0926' || github.event.comment.user.login == 'claude[bot]') &&
         contains(github.event.comment.body, '<!-- claude-codex-reply -->')) ||
        (github.event.comment.user.login == 'claude[bot]' &&
         startsWith(github.event.comment.body, '<!-- claude-fallback-review -->'))))
    runs-on: ubuntu-latest
    steps:
      # Never check out the candidate PR: only trusted master supplies executable code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GitHub Actions bot 인증으로 안전 병합
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPROVAL_BODY: ${{ github.event.comment.body }}
          APPROVAL_ISSUE: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          # Lee 승인 댓글로 시작한 실행만 그 PR 하나로 좁힌다. Codex 댓글·Claude 답으로 시작한 실행은 평소처럼 전체를 본다.
          lee_approval=false
          if [ "${{ github.event_name }}" = issue_comment ] && [ "$EVENT_ACTION" = created ] && [[ "$APPROVAL_BODY" == "LEE-APPROVE "* ]]; then lee_approval=true; fi
          # Lee가 채팅에서 데모를 보고 "적용"한 PR(Lee 2026-11-09): Codex 대기만 건너뛴다. 필수 검사·결정 문서 승인·DB 보호는 그대로.
          # LEE-APPROVE와 다른 표시를 쓴다 — LEE-APPROVE는 결정 문서 승인도 겸하므로 작업자가 대신 달면 안 된다.
          demo_apply=false
          if [ "${{ github.event_name }}" = issue_comment ] && [ "$EVENT_ACTION" = created ] && [[ "$APPROVAL_BODY" == "LEE-DEMO-APPLY "* ]]; then lee_approval=true; demo_apply=true; fi
          : > codex-wait.txt
          gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName,headRefOid,baseRefName,isDraft,title --jq '.[] | select(.baseRefName=="master" and (.isDraft|not)) | [.number,.headRefOid,.headRefName] | @tsv' |
          while IFS=$'\t' read -r num sha branch; do
            [ -n "$num" ] || continue
            # Comment-triggered runs must inspect only the PR Lee actually approved.
            if [ "$lee_approval" = true ]; then
              # 첫 줄만 본다 — 작업 세션 댓글 끝에 자동 서명 줄이 붙어 표시가 안 맞던 문제(2026-11-09).
              first_line=$(printf '%s' "$APPROVAL_BODY" | head -n1 | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
              [ "$num" = "$APPROVAL_ISSUE" ] && { [ "$first_line" = "LEE-APPROVE $sha" ] || [ "$first_line" = "LEE-DEMO-APPLY $sha" ]; } || continue
            fi
            # 기존 미완료 PR을 소급 자동병합하지 않음; 새 규정 시행 이후 PR만.
            [ "$num" -ge 251 ] || continue
            echo "검사: PR #$num ($sha)"
            # github-actions[bot]이 임의 외부 fork 소스를 실행하지 않는다: API 데이터만 검사.
            gh api "repos/$REPO/pulls/$num/files?per_page=100" --paginate --slurp | jq 'add' > files.json
            node scripts/approved-migrations.mjs files.json > approved-migrations.json
            if jq --slurpfile approved approved-migrations.json -e '.[] | select((.filename as $path | $approved[0] | index($path) | not) and (.filename|startswith("supabase/migrations/")) and ((.patch // "") | test("(?im)^\\+(?!\\s*--)\\s*.*\\b(drop[[:space:]]+(table|column|schema|policy)|truncate|delete[[:space:]]+from|alter[[:space:]]+table[^;]*drop)\\b")))' files.json >/dev/null; then
              echo "::notice::PR #$num 파괴적인 migration: Lee 결정 필요, 자동병합 금지"; continue
            fi
            # 변경 패치가 잘린 migration도 무조건 자동병합 보류
            if jq -e '.[] | select((.filename|startswith("supabase/migrations/")) and (.patch==null))' files.json >/dev/null; then
              echo "::notice::PR #$num migration patch 없음: 병합 금지"; continue
            fi
            checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs | sort_by(.started_at) | group_by(.name) | map(last) | map({name,conclusion,status})')
            echo "$checks" | jq -c '.'
            # DB 변경 PR은 disposable PostgreSQL 실제 적용 성공 없이는 절대 병합하지 않는다.
            if jq -e '.[] | select(.filename|startswith("supabase/migrations/"))' files.json >/dev/null; then
              if ! echo "$checks" | jq -e 'any(.[]; .name=="migration-postgres" and .status=="completed" and .conclusion=="success")' >/dev/null; then
                echo "::warning::PR #$num migration-postgres 검증 없음/실패: 자동 병합 금지"
                continue
              fi
            fi
            # 이 커밋의 4종 필수 체크 성공, 실패/실행 중인 체크 없어야 함
            if ! echo "$checks" | jq -e '
              (all(.[] | select(.name=="checks" or .name=="app-screen" or .name=="guard" or .name=="publication-gate"); .status=="completed" and .conclusion=="success")) and
              (any(.[]; .name=="checks" and .conclusion=="success")) and
              (any(.[]; .name=="app-screen" and .conclusion=="success")) and
              (any(.[]; .name=="guard" and .conclusion=="success")) and
              (any(.[]; .name=="publication-gate" and .conclusion=="success"))
            ' >/dev/null; then
              echo "PR #$num 검사 대기/실패: 병합 생략"; continue
            fi
            # 결정 문서·CODEOWNERS 변경은 현재 head 커밋에 Lee 승인이 있어야 병합(Lee 2026-10-28, 방법 A).
            # 승인이 없으면 병합하지 않고 PR에 쉬운 말 승인 요청을 한 번 남긴다. 다른 PR은 영향 없음.
            gh api "repos/$REPO/pulls/$num/reviews?per_page=100" --paginate --slurp | jq 'add // []' > reviews.json
            gh api "repos/$REPO/issues/$num/comments?per_page=100" --paginate --slurp | jq 'add // []' > comments.json
            if ! node scripts/decision-approval-gate.mjs files.json reviews.json comments.json "$sha" > approval-request.txt; then
              echo "::notice::PR #$num 결정 문서 변경: Lee 승인 대기 — 병합 안 함"
              if ! jq -e --arg sha "$sha" '.[] | select((.body // "") | contains("<!-- decision-approval-request -->") and contains($sha[0:7]))' comments.json >/dev/null; then
                gh api -X POST "repos/$REPO/issues/$num/comments" -f body="$(cat approval-request.txt)" >/dev/null || echo "::warning::PR #$num 승인 요청 댓글 실패"
              fi
              continue
            fi
            # AI 팀 검사관(Lee 2026-11-08, 11-11): GPT Codex 검사를 기다린다. 한도 초과·12분 무응답이면 Claude 검토관, 그것도 20분 안 오면 예전 규칙, 지적이 있으면 Claude 답이 있어야 진행.
            gh api "repos/$REPO/pulls/$num/comments?per_page=100" --paginate --slurp | jq 'add // []' > review-comments.json
            head_date=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.committer.date')
            # 데모 적용 표시는 댓글로 남아 있으면 이후 실행(검사 끝난 뒤 workflow_run 등)에서도 인정한다(Codex #581 지적).
            pr_demo_apply="$demo_apply"
            if jq -e --arg body "LEE-DEMO-APPLY $sha" '.[] | select(.user.login=="KHOAILANG0926" and ((.body // "") | split("\n")[0] | gsub("^\\s+|\\s+$";"")) == $body)' comments.json >/dev/null; then pr_demo_apply=true; fi
            if [ "$pr_demo_apply" = true ]; then
              echo "Lee 데모 적용(LEE-DEMO-APPLY $sha) — Codex 대기 생략" > gate.txt
            elif node scripts/codex-review-gate.mjs reviews.json review-comments.json comments.json "$sha" "$head_date" files.json > gate.txt; gate_rc=$?; [ "$gate_rc" != 0 ]; then
              cat gate.txt
              # Codex 한도 초과·무응답(종료 코드 3): Claude 검토관을 한 번 부른다(Lee 2026-11-11). 요청 표시 댓글이 시각 기준이다.
              if [ "$gate_rc" = 3 ]; then
                if gh api -X POST "repos/$REPO/issues/$num/comments" -f body="<!-- claude-fallback-request --> $sha
            Codex 검사가 오지 않아(한도 초과 또는 12분 무응답) Claude 검토관이 이 커밋을 대신 검토합니다." >/dev/null; then
                  gh workflow run claude-auto.yml --repo "$REPO" --ref master -f fallback_pr="$num" \
                    && echo "::notice::PR #$num Claude 검토관 요청" || echo "::warning::PR #$num Claude 검토관 실행 실패(20분 뒤 예전 규칙)"
                else echo "::warning::PR #$num 검토관 요청 댓글 실패"; fi
                echo 21 >> codex-wait.txt
              fi
              # Codex 검사 없이 운영·보안·DB 파일이 바뀐 PR(종료 코드 2): needs-lee 표시 + 쉬운 말 한 번만 남기고 멈춘다(Lee 2026-11-09).
              if grep -q 'Lee 확인 필요' gate.txt; then
                gh api -X POST "repos/$REPO/issues/$num/labels" -f 'labels[]=needs-lee' >/dev/null || echo "::warning::PR #$num needs-lee 표시 실패"
                if ! jq -e --arg sha "$sha" '.[] | select((.body // "") | contains("<!-- codex-missing-risky -->") and contains($sha[0:7]))' comments.json >/dev/null; then
                  gh api -X POST "repos/$REPO/issues/$num/comments" -f body="<!-- codex-missing-risky --> ${sha:0:7}: Codex 검사와 Claude 검토관이 모두 오지 않았고 운영·보안·DB 파일이 바뀌어 자동 병합을 멈췄습니다. 작업자가 \`@codex review\`를 다시 요청합니다. Codex가 계속 오지 않으면 Lee가 채팅에서 \"적용\"이라고 한 경우에만 LEE-DEMO-APPLY로 진행합니다." >/dev/null || echo "::warning::PR #$num 안내 댓글 실패"
                fi
              fi
              # 'Codex 검사 대기(x/12분)'·'Claude 검토관 대기(x/20분)'이면 시간이 차는 시각에 다시 보도록 남은 분을 적어 둔다(#574).
              waited=$(sed -n 's/.*대기(\([0-9]*\)\/\([0-9]*\)분).*/\2 \1/p' gate.txt | awk '{print $1-$2+1}')
              [ -n "$waited" ] && echo "$waited" >> codex-wait.txt
              echo "PR #$num Codex 검사 대기: 병합 생략"; continue
            fi
            cat gate.txt
            # PR 준비 표시와 현재 head SHA 최종 재검증
            for try in 1 2 3 4 5; do
              gh api "repos/$REPO/pulls/$num" --jq '[.head.sha,.draft,.mergeable_state] | @tsv' > state.txt
              read -r current draft merge_state < state.txt
              [ "$merge_state" != unknown ] && [ "$merge_state" != UNKNOWN ] && break
              sleep 3
            done
            [ "$current" = "$sha" ] && [ "$draft" = false ] || {
              echo "PR #$num HEAD 변경 또는 Draft: 병합 안 함"; continue;
            }
            # mergeable_state=unknown은 GitHub 비동기 계산일 수 있다. 브랜치 정책의
            # 최종 적용은 gh pr merge가 GitHub 서버에서 집행; 실패 시 병합 금지.
            if gh pr merge "$num" --repo "$REPO" --squash --match-head-commit "$sha"; then
              echo "::notice::PR #$num github-actions[bot] 병합 성공"
              if jq -e '.[] | select(.filename|startswith("supabase/migrations/"))' files.json >/dev/null; then
                # GITHUB_TOKEN 병합으로는 master push 기반 migration 워크플로가 시작되지 않는다.
                # DB 마이그레이션이 성공하기 전에는 새 API/화면을 운영에 배포하지 않는다.
                previous=$(gh run list --repo "$REPO" --workflow migrations-apply.yml --branch master --limit 1 --json databaseId --jq '.[0].databaseId // 0')
                gh workflow run migrations-apply.yml --repo "$REPO" --ref master
                migration_run=""
                for attempt in $(seq 1 90); do
                  current=$(gh run list --repo "$REPO" --workflow migrations-apply.yml --branch master --limit 1 --json databaseId,status,conclusion)
                  rid=$(echo "$current" | jq -r '.[0].databaseId // 0')
                  state=$(echo "$current" | jq -r '.[0].status // ""')
                  outcome=$(echo "$current" | jq -r '.[0].conclusion // ""')
                  if [ "$rid" != "$previous" ] && [ "$rid" != "0" ]; then
                    migration_run="$rid"
                    [ "$state" = completed ] && break
                  fi
                  sleep 6
                done
                if [ -z "$migration_run" ] || [ "$state" != completed ] || [ "$outcome" != success ]; then
                  echo "::error::migration 미완료/실패. 운영 배포 보류: run=$migration_run status=$state conclusion=$outcome"
                  exit 1
                fi
                echo "::notice::DB migration 성공: run=$migration_run"
              fi
              gh workflow run vercel-deploy.yml --repo "$REPO" --ref master
              gh workflow run admin-line-pick-e2e.yml --repo "$REPO" --ref master || echo "::warning::관리자 E2E 워크플로 미등록/권한 확인 필요"
              gh workflow run admin-location-review-e2e.yml --repo "$REPO" --ref master || echo "::warning::위치 확정 E2E 워크플로 미등록/권한 확인 필요"
            else
              echo "::warning::PR #$num 병합 거절(권한/branch protection), 재시도 생략"
            fi
          done
          # Codex를 기다리는 PR이 있으면 가장 먼저 대기가 끝나는 시각에 다시 부른다(예약 실행이 빠져도 멈추지 않게, #574).
          if [ "$lee_approval" != true ] && [ -s codex-wait.txt ]; then
            minutes=$(sort -n codex-wait.txt | head -1)
            gh workflow run codex-wait-timer.yml --repo "$REPO" --ref master -f minutes="$minutes" \
              && echo "::notice::Codex 대기 PR: ${minutes}분 뒤 다시 확인" || echo "::warning::다시 확인 예약 실패(예약 실행으로 대신)"
          fi
