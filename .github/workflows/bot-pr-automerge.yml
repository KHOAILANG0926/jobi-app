name: 검사 통과 PR 봇 병합
# bootstrap은 master 직접 생성. 이후 PR 검증이 완료된 것만 github-actions[bot]으로 병합.
on:
  workflow_run:
    workflows: ['PR 검사 (병합 전 필수)', '실제 화면 검사 (PR, 병합 전 필수)']
    types: [completed]
  push:
    branches: [master]
    paths: ['.github/workflows/bot-pr-automerge.yml']
  workflow_dispatch: {}
  # Codex 검사 대기(12분)·Claude 검토관 대기(20분)가 끝난 PR을 다시 보려고 15분마다 한 번 더 확인한다(Lee 2026-11-08 AI 팀).
  schedule:
    - cron: '*/15 * * * *'
  # GitHub 예약 실행은 자주 빠진다(#574: */15가 1시간 반 동안 0번). 그래서 Codex 리뷰·요약 댓글·Claude 답이
  # 오는 순간에도 다시 보고, 대기 시간은 codex-wait-timer.yml이 끝나는 시각에 다시 부른다. 예약은 예비로 둔다.
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: bot-pr-automerge
  cancel-in-progress: false

jobs:
  merge:
    # S4(Lee 2026-11-15 결정 4): 보호 설정(필수 검사 출처 앱·CODEOWNERS) 검증이 끝나기 전에는 이 워크플로가 켜져 있어도 병합하지 않는다.
    # 저장소 변수 S4_PROTECTION_VERIFIED가 'true'일 때만 돈다 — 값은 대표님이 보호 설정 검증 뒤에만 설정한다(없으면 항상 건너뜀, 닫힌 실패).
    if: >-
      vars.S4_PROTECTION_VERIFIED == 'true' && ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review') ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        (github.event.review.user.login == 'KHOAILANG0926' && github.event.review.state == 'approved'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        ((github.event.comment.user.login == 'viecganban-bot' || github.event.comment.user.login == 'claude[bot]') &&
         contains(github.event.comment.body, '<!-- claude-codex-reply -->')) ||
        (github.event.comment.user.login == 'claude[bot]' &&
         startsWith(github.event.comment.body, '<!-- claude-fallback-review -->')))))
    runs-on: ubuntu-latest
    steps:
      # Never check out the candidate PR: only trusted master supplies executable code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GitHub Actions bot 인증으로 안전 병합
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # S3-2(#808, Lee 2026-11-14 결정 6①·7①): 댓글 승인(LEE-APPROVE·LEE-DEMO-APPLY)과 데모 적용 시 검토 생략을 폐지했다.
          # Lee 승인은 GitHub 승인 리뷰만(decision-approval-gate.mjs). 독립 검토는 병합 조건이 아니다(Lee 2026-11-21, 선택적 수동 검토).
          : > codex-wait.txt
          rm -f lock-cache.json  # S1 B3: 잠금 compare 기억은 이 실행 안에서만
          : > dispatch-fail.txt
          gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName,headRefOid,baseRefName,isDraft,title,author --jq '.[] | select(.baseRefName=="master" and (.isDraft|not)) | [.number,.headRefOid,.headRefName,(.author.login // "")] | @tsv' |
          while IFS=$'\t' read -r num sha branch author; do
            [ -n "$num" ] || continue
            # 기존 미완료 PR을 소급 자동병합하지 않음; 새 규정 시행 이후 PR만.
            [ "$num" -ge 251 ] || continue
            echo "검사: PR #$num ($sha)"
            # github-actions[bot]이 임의 외부 fork 소스를 실행하지 않는다: API 데이터만 검사.
            gh api "repos/$REPO/pulls/$num/files?per_page=100" --paginate --slurp | jq 'add' > files.json
            node scripts/approved-migrations.mjs files.json > approved-migrations.json
            if jq --slurpfile approved approved-migrations.json -e '.[] | select((.filename as $path | $approved[0] | index($path) | not) and (.filename|startswith("supabase/migrations/")) and ((.patch // "") | test("(?im)^\\+(?!\\s*--)\\s*.*\\b(drop[[:space:]]+(table|column|schema|policy)|truncate|delete[[:space:]]+from|alter[[:space:]]+table[^;]*drop)\\b")))' files.json >/dev/null; then
              echo "::notice::PR #$num 파괴적인 migration: Lee 결정 필요, 자동병합 금지"; continue
            fi
            # 변경 패치가 잘린 migration도 무조건 자동병합 보류
            if jq -e '.[] | select((.filename|startswith("supabase/migrations/")) and (.patch==null))' files.json >/dev/null; then
              echo "::notice::PR #$num migration patch 없음: 병합 금지"; continue
            fi
            checks=$(bash scripts/ci/fetch-check-runs.sh "$REPO" "$sha") || { echo "::warning::PR #$num 검사 목록 조회 실패: 병합 안 함"; continue; }
            echo "$checks" | jq -c '.'
            # DB 변경 PR은 disposable PostgreSQL 실제 적용 성공 없이는 절대 병합하지 않는다.
            if jq -e '.[] | select(.filename|startswith("supabase/migrations/"))' files.json >/dev/null; then
              if ! echo "$checks" | jq -e 'any(.[]; .name=="migration-postgres" and .status=="completed" and .conclusion=="success")' >/dev/null; then
                echo "::warning::PR #$num migration-postgres 검증 없음/실패: 자동 병합 금지"
                continue
              fi
            fi
            # 이 커밋의 4종 필수 체크 성공, 실패/실행 중인 체크 없어야 함
            if ! echo "$checks" | jq -e -f scripts/ci/required-checks-pass.jq >/dev/null; then
              echo "PR #$num 검사 대기/실패: 병합 생략"; continue
            fi
            # 결정 문서·CODEOWNERS 변경은 현재 head 커밋에 Lee 승인이 있어야 병합(Lee 2026-10-28, 방법 A).
            # 승인이 없으면 병합하지 않고 PR에 쉬운 말 승인 요청을 한 번 남긴다. 다른 PR은 영향 없음.
            gh api "repos/$REPO/pulls/$num/reviews?per_page=100" --paginate --slurp | jq 'add // []' > reviews.json
            gh api "repos/$REPO/issues/$num/comments?per_page=100" --paginate --slurp | jq 'add // []' > comments.json
            # R2(Lee 2026-11-13 승인): 결정 문서 외에 승인된 화면 틀 파일·needs-lee 라벨도 같은 문턱 — 라벨 조회에 실패하면 병합하지 않는다(닫힌 실패).
            gh api "repos/$REPO/issues/$num" --jq '[.labels[].name]' > labels.json || { echo "::warning::PR #$num 라벨 조회 실패: 병합 안 함"; continue; }
            # S4(Lee 2026-11-15): package.json·lockfile이 바뀐 PR은 기준·head 내용을 넘겨 '위험한 의존성 변경'만 Lee 승인 대상으로 판정.
            #   내용을 못 받으면 빈 값 → 판정기가 '판단 불가'로 승인 대상 처리(닫힌 실패). 일반 버전 업데이트는 승인 없이 진행.
            echo '{}' > deps.json
            if jq -e 'any(.[]; .filename=="package.json" or .filename=="package-lock.json")' files.json >/dev/null; then
              base_sha=$(gh api "repos/$REPO/pulls/$num" --jq .base.sha) || base_sha=""
              raw() { gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$1?ref=$2"; }
              if [ -n "$base_sha" ] && raw package.json "$base_sha" > base-pkg.json && raw package.json "$sha" > head-pkg.json \
                && raw package-lock.json "$base_sha" > base-lock.json && raw package-lock.json "$sha" > head-lock.json; then
                jq -n --slurpfile bp base-pkg.json --slurpfile hp head-pkg.json --slurpfile bl base-lock.json --slurpfile hl head-lock.json \
                  '{basePkg:$bp[0],headPkg:$hp[0],baseLock:$bl[0],headLock:$hl[0]}' > deps.json || echo '{}' > deps.json
              fi
            fi
            # 독립 검토(Codex·Claude 검토관)는 병합 조건이 아니다(Lee 2026-11-21, 11-14 결정 7①·#807 게이트 (3) 변경) — 봇은 검토를 기다리지 않고 검토관도 부르지 않는다.
            # 검토가 필요하면 사람이 claude-auto.yml(fallback_pr)을 수동으로 실행한다. 필수 기계 검사·Lee 공식 Approve·보안 보호는 그대로다.
            # S4(Lee 2026-11-15 ①): Lee 승인 요청은 필수 검사를 통과한 뒤에만 보낸다 — 검증이 덜 된 PR에 승인을 요청하지 않는다.
            # 8번째 = PR 작성자(자기 승인 무효 — Lee 계정이 쓴 PR의 Lee 승인은 인정 안 함, 작성자를 모르면 승인 없음으로 봄, S4-4)
            # 9·10번째 = PR 본문 파일·저장소(판정기 입력 형식 유지 — 고위험 4대 보고 강제는 Lee 2026-11-21 폐지). 본문을 못 읽으면 병합하지 않는다(닫힌 실패).
            gh api "repos/$REPO/pulls/$num" --jq '.body // ""' > pr-body.txt || { echo "::warning::PR #$num 본문 조회 실패: 병합 안 함"; continue; }
            if ! node scripts/decision-approval-gate.mjs files.json reviews.json comments.json "$sha" labels.json deps.json "$author" pr-body.txt "$REPO" > approval-request.txt; then
              echo "::notice::PR #$num Lee 승인 대상(고위험·위험도 판단 불가): 승인 대기 — 병합 안 함"
              # 요청 표시(승인 요청 또는 보고 요청)는 이 봇이 단 것·첫머리 표시·이 커밋 7자리만 인정한다. 출력이 비면(판정기 오류) 댓글 없이 보류만 한다.
              first=$(head -1 approval-request.txt)
              if [ -n "$first" ] && ! jq -e --arg sha "$sha" --arg first "$first" '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith($first)) and ((.body // "") | contains($sha[0:7])))' comments.json >/dev/null; then
                gh api -X POST "repos/$REPO/issues/$num/comments" -f body="$(cat approval-request.txt)" >/dev/null || echo "::warning::PR #$num 승인 요청 댓글 실패"
              fi
              continue
            fi
            # PR 준비 표시와 현재 head SHA 최종 재검증
            for try in 1 2 3 4 5; do
              gh api "repos/$REPO/pulls/$num" --jq '[.head.sha,.draft,.mergeable_state] | @tsv' > state.txt
              read -r current draft merge_state < state.txt
              [ "$merge_state" != unknown ] && [ "$merge_state" != UNKNOWN ] && break
              sleep 3
            done
            [ "$current" = "$sha" ] && [ "$draft" = false ] || {
              echo "PR #$num HEAD 변경 또는 Draft: 병합 안 함"; continue;
            }
            # mergeable_state=unknown은 GitHub 비동기 계산일 수 있다. 브랜치 정책의
            # 최종 적용은 GitHub 서버 병합 API가 집행; 실패 시 병합 금지.
            # gh pr merge는 서버에 묻기 전에 자기가 읽은 mergeStateStatus로 먼저 거절한다("base branch policy prohibits",
            # 검사가 다 끝났는데도 늦게 갱신된 값 — #681·#708, #686). 서버 병합 API를 바로 불러 서버 판단과 실제 거절 이유를 남긴다.
            # sha = --match-head-commit과 같음(그 사이 새 커밋이 오면 서버가 거절). 제목은 예전처럼 "PR 제목 (#번호)".
            title=$(gh api "repos/$REPO/pulls/$num" --jq '.title') || { echo "::warning::PR #$num 제목 조회 실패 — 다음 실행에서 다시 봄"; continue; }
            # S4 병합 직전 실시간 승인 재검증(Lee 최종 합의): 위 판정 뒤 승인이 취소·변경 요청으로 바뀌었을 수 있다 — 병합을 부르기 바로 전에 리뷰·댓글·라벨·본문을 다시 받아
            # 같은 판정기로 한 번 더 본다. 다시 받지 못하거나 판정이 막으면 병합하지 않는다(닫힌 실패). 병합 API의 sha 고정은 새 커밋만 막으므로 이 단계가 승인 취소를 막는다.
            { gh api "repos/$REPO/pulls/$num/reviews?per_page=100" --paginate --slurp | jq 'add // []' > reviews.json               && gh api "repos/$REPO/issues/$num/comments?per_page=100" --paginate --slurp | jq 'add // []' > comments.json               && gh api "repos/$REPO/issues/$num" --jq '[.labels[].name]' > labels.json               && gh api "repos/$REPO/pulls/$num" --jq '.body // ""' > pr-body.txt; } || { echo "::warning::PR #$num 병합 직전 승인 재조회 실패: 병합 안 함"; continue; }
            if ! node scripts/decision-approval-gate.mjs files.json reviews.json comments.json "$sha" labels.json deps.json "$author" pr-body.txt "$REPO" > approval-request.txt; then
              echo "::warning::PR #$num 병합 직전 재확인에서 승인 상태가 바뀜(취소·변경 요청·승인 없음): 병합 중단"; continue
            fi
            # 병합 조건 검사(approval-checks.yml이 검사 전용 앱으로 올리는 approval-gate — ai-review 검사는 11-21 지움)도 저장소 규칙의 필수 검사다(S4).
            # 위 4종만 보고 병합을 시도하면, 검토 답이나 Lee 승인이 판정에 반영되기 직전(수십 초)에 서버가 거절하고 다음 예약(15분, 자주 빠짐)까지 멈췄다
            # (#920 2026-11-18T22:16:56Z·#925 2026-11-18T23:16:01Z, 같은 원인 2번째 — 원칙 8). 병합 직전에 두 판정을 다시 읽어 아직이면 시도하지 않고,
            # 기존 다시 확인 장치(codex-wait.txt → codex-wait-timer)로 6분 뒤 다시 부른다(approval-checks는 5분마다 + 댓글마다 판정).
            gate=$(gh api --paginate --slurp "repos/$REPO/commits/$sha/check-runs?per_page=100" | jq -r -f scripts/ci/merge-gate-ready.jq) || gate=pending
            if [ "$gate" != ok ]; then
              # 진행 중·승인 반영 전 옛 값이면 6분 뒤 다시(곧 바뀜, 판정은 merge-gate-ready.jq). 실패면 다시 부르지 않는다(새 커밋·댓글·예약이 봇을 부른다).
              echo "::notice::PR #$num 병합 조건 검사(approval-gate) $gate — 병합 시도 안 함"
              [ "$gate" = pending ] && echo 6 >> codex-wait.txt
              continue
            fi
            # S1 B3(#808): 병합 직전 운영 배포 잠금 재확인. approval-gate는 approval-checks가 다시 판정할 때만 잠금을 반영해
            # 실패 이슈가 생긴 뒤에도 옛 판정이 남는 공백이 있었다(#943 10:49 → 첫 반영 12:53). 병합 API 바로 앞에서 본다(틈 최소). 같은 activeLocks를 그대로 다시 부르고(새 판정 없음),
            # 잠금이 있으면 이 커밋에 Lee 승인이 없는 PR은 병합하지 않는다. 조회 실패는 2회까지 다시 시도한 뒤 병합 보류(닫힌 실패)·오류 기록.
            # compare 기억(lock-cache.json)은 이 실행 안에서만 함께 쓴다 — 잠금 이슈·deploy-verify 성공 기록은 부를 때마다 새로 읽는다.
            lock_rc=0
            GITHUB_TOKEN="$GH_TOKEN" node scripts/ci/approval-checks.mjs --merge-lock-check --repo "$REPO" --sha "$sha" --author "$author" --reviews reviews.json --cache lock-cache.json > lock.txt || lock_rc=$?
            if [ "$lock_rc" = 3 ]; then
              echo "::notice::PR #$num $(cat lock.txt)"; continue
            elif [ "$lock_rc" != 0 ]; then
              echo "::error::PR #$num 병합 직전 운영 배포 잠금 재확인 실패(코드 $lock_rc): $(cat lock.txt)"
              echo "- PR #$num 운영 배포 잠금 재확인 실패 — 병합 보류: $(cat lock.txt)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if merge_out=$(gh api -X PUT "repos/$REPO/pulls/$num/merge" -f merge_method=squash -f sha="$sha" -f commit_title="$title (#$num)" 2>&1); then
              echo "::notice::PR #$num github-actions[bot] 병합 성공"
              if jq -e '.[] | select(.filename|startswith("supabase/migrations/"))' files.json >/dev/null; then
                # GITHUB_TOKEN 병합으로는 master push 기반 migration 워크플로가 시작되지 않는다 → 여기서 시작만 한다.
                # 'migration 성공 뒤에만 운영 배포'는 vercel-deploy.yml의 S3-5 단계(scripts/ci/wait-migration-before-deploy.sh) 한 곳이 지킨다
                # (실행 기록이 아직 없으면 최대 16분 기다리고, 실패·시간 초과면 배포 보류). 봇 안의 같은 목적 대기 반복문은 지움(S3-5 검토관 지적, 원칙 8).
                gh workflow run migrations-apply.yml --repo "$REPO" --ref master
              fi
              gh workflow run vercel-deploy.yml --repo "$REPO" --ref master
              # GITHUB_TOKEN 병합은 master push 기반 검사 워크플로를 시작하지 않는다 — 각 검사 워크플로 자신의 on.push.paths(master 사본)에 맞을 때만 명시 호출한다(경로 목록을 복사하지 않는다).
              # 대상 5개는 모두 `push: branches: [master] + paths: 블록 목록` 모양이다(ai-reader-calibration·job-ocr-check는 Lee 2026-11-21: PR 단계에도 없고 봇도 안 부르던 push 전용 검사)(pr-checks의 post-merge-chain 시험이 실제 YAML로 그 모양과 이 읽기 결과를 대조한다).
              # paths는 GitHub 방식으로 읽는다(* = 한 칸, ** = 여러 칸). 목록이 없거나 해석할 수 없는 패턴(?·+·[]·\·!)이면 "해당 없음"으로 넘기지 않고 오류로 기록한다.
              # 호출·읽기 실패는 타이머까지 마친 뒤 이 단계를 실패로 끝낸다(침묵 실패 방지).
              jq -r '.[].filename' files.json > changed.txt
              for wf in job-rules-apply occupation-r8-apply jobcard-integrity ai-reader-calibration job-ocr-check; do
                hit=0; bad=""
                pats=$(awk '/^on:/{o=1;next} o&&/^[^ #]/{o=0} o&&/^  push:/{p=1;next} o&&p&&/^  [a-z_]+:/{p=0} p&&/^    paths:/{q=1;next} p&&q&&/^      - /{sub(/^      - /,"");sub(/[ ]+#.*$/,"");gsub(/[\047"]/,"");if($0!="")print;next} p&&/^    [a-z]/{q=0}' ".github/workflows/$wf.yml" 2>/dev/null) || pats=""
                [ -n "$pats" ] || bad="paths 목록 없음·읽기 실패"
                while IFS= read -r pat; do
                  case "$pat" in
                    '!'*|*'?'*|*'+'*|*'['*|*']'*|*'\'*) bad="$pat" ;;
                    *) re=$(printf '%s' "$pat" | sed -e 's/[.^$(){}|]/\\&/g' -e 's#\*\*#\x01#g' -e 's#\*#[^/]*#g' -e 's#\x01#.*#g')
                       if grep -Eq "^$re\$" changed.txt; then hit=1; fi ;;
                  esac
                done <<< "$pats"
                if [ -n "$bad" ]; then echo "::error::PR #$num $wf.yml 의 push 조건을 해석하지 못함($bad) — 호출 여부를 판단할 수 없다"; echo "$wf($bad)" >> dispatch-fail.txt; continue; fi
                if [ "$hit" = 1 ]; then
                  gh workflow run "$wf.yml" --repo "$REPO" --ref master || { echo "::error::PR #$num 병합 뒤 $wf.yml 시작 실패 — 해당 검사가 돌지 않았다"; echo "$wf(호출 실패)" >> dispatch-fail.txt; }
                fi
              done
              # 관리자 E2E 두 개는 vercel-deploy가 migration 성공·운영 배포 뒤에 부른다(예전 봇 대기 반복문 뒤 순서 유지, #812 검토관 지적).
            else
              echo "::warning::PR #$num 병합 거절(서버): $(printf '%s' "$merge_out" | tr '\n' ' ' | cut -c1-300) — 다음 실행에서 다시 봄"
            fi
          done
          # Codex를 기다리는 PR이 있으면 가장 먼저 대기가 끝나는 시각에 다시 부른다(예약 실행이 빠져도 멈추지 않게, #574).
          if [ -s codex-wait.txt ]; then
            minutes=$(sort -n codex-wait.txt | head -1)
            gh workflow run codex-wait-timer.yml --repo "$REPO" --ref master -f minutes="$minutes" \
              && echo "::notice::Codex 대기 PR: ${minutes}분 뒤 다시 확인" || echo "::warning::다시 확인 예약 실패(예약 실행으로 대신)"
          fi
          # 병합 루프는 파이프 오른쪽(하위 셸)이라 실패 기록은 파일로 넘긴다(codex-wait.txt와 같은 방식).
          if [ -s dispatch-fail.txt ]; then echo "::error::병합 뒤 후속 검사 시작 실패: $(sort -u dispatch-fail.txt | tr '\n' ' ')(위 오류 확인)"; exit 1; fi
