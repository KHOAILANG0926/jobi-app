name: Industry photos — fetch candidates

on:
  workflow_dispatch:
  push:
    branches: [media/industry-photos]
    paths: ['scripts/media/fetch_industry_photos.py', '.github/workflows/industry-photos-fetch.yml']

permissions:
  contents: write

concurrency:
  group: industry-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/media/industry-photos'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow==11.0.0
      - name: Download candidates (Wikimedia Commons, CC0·PD·CC BY only)
        timeout-minutes: 25
        continue-on-error: true
        env:
          ROUND: '2'
          ONLY: quan_ly_ban_hang,dich_vu,cskh_kinh_doanh,cntt_ky_thuat,thiet_ke,y_te_dieu_duong,giao_duc_giang_day,khac
        run: python -u scripts/media/fetch_industry_photos.py
      - name: Commit candidates to the same branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/industry-photos/
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          git commit -m 'data: industry photo candidates (Openverse, commercial licenses)'
          git push origin HEAD:refs/heads/media/industry-photos
