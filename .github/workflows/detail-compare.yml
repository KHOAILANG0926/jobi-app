name: 기준 화면 비교 (KDA 틀)

# 운영 상세 화면을 기준 공고(#4824 CTY KDA)와 비교하고, 촬영본을 screens 브랜치에 저장한다(2026-10-18).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '비교할 공고 id(공백 구분)'
        required: true
  pull_request:
    paths:
      - src/**
      - api/**
      - scripts/ops/capture-detail.mjs
      - .github/workflows/detail-compare.yml

permissions:
  contents: write
  deployments: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 비교 대상 주소 (PR이면 그 PR의 Vercel 미리보기, 아니면 운영)
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url=https://www.viecganban.vn
          if [ -n "$SHA" ]; then
            for i in $(seq 1 40); do
              d=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=10" --jq '.[0].id' || true)
              if [ -n "$d" ]; then
                u=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$d/statuses" --jq '[.[]|select(.state=="success")][0].environment_url // empty' || true)
                [ -n "$u" ] && { url=$u; break; }
              fi
              sleep 15
            done
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "비교 주소: $url"
      - name: 촬영·비교
        id: cmp
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          TARGETS: ${{ inputs.targets || '4828' }}
        run: node scripts/ops/capture-detail.mjs 4824 $TARGETS
        continue-on-error: true
      - name: 촬영본 저장 (screens 브랜치)
        if: always()
        run: |
          set -e
          cp -r screens /tmp/screens
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screens-tmp
          git rm -rfq . >/dev/null
          cp -r /tmp/screens/. .
          git add -A && git commit -qm "screens: ${GITHUB_SHA::7} ${{ github.run_id }}"
          git push -f origin HEAD:screens
      - name: 결과
        if: steps.cmp.outcome == 'failure'
        run: exit 1
