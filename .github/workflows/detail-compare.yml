name: 기준 화면 비교 (KDA 틀)

# 운영 상세 화면을 기준 공고(#4824 CTY KDA)와 비교하고, 촬영본을 screens 브랜치에 저장한다(2026-10-18).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '비교할 공고 id(공백 구분)'
        required: true
  pull_request:
    paths:
      - scripts/ops/capture-detail.mjs
      - .github/workflows/detail-compare.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 촬영·비교
        id: cmp
        env:
          BASE_URL: https://www.viecganban.vn
          TARGETS: ${{ inputs.targets || '4828' }}
        run: node scripts/ops/capture-detail.mjs 4824 $TARGETS
        continue-on-error: true
      - name: 촬영본 저장 (screens 브랜치)
        if: always()
        run: |
          set -e
          cp -r screens /tmp/screens
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screens-tmp
          git rm -rfq . >/dev/null
          cp -r /tmp/screens/. .
          git add -A && git commit -qm "screens: ${GITHUB_SHA::7} ${{ github.run_id }}"
          git push -f origin HEAD:screens
      - name: 결과
        if: steps.cmp.outcome == 'failure'
        run: exit 1
