name: 이미지 등록 (사진 묶음 자동 등록)
# Lee 2026-11-27: 사진 묶음(ZIP) 주소만 넣으면 서버(GitHub Actions)에서 기존 등록 스크립트(scripts/images/register-images.mjs)가 돌아
# 이름 해석·webp 최적화(ImageMagick)·중복 검사·번호 부여·목록 등록까지 하고 초안 PR을 만든다. 공고 배정은 기존 30분 파이프라인(assign-image.mjs)이 새 공고에 자동으로 한다.
# 등록 결과는 기존 게시 단계(scripts/ci/claude-publish.mjs pr --images, claude[bot] 앱 토큰 — claude-auto의 task-publish와 같은 방식)가 PR로 올린다.
# GITHUB_TOKEN으로 만든 PR에는 필수 검사가 시작되지 않아서다. 게시 단계는 이미지 목록·이미지 폴더 webp 추가만 받고, PR 본문은 필수 검사 형식으로 자동 작성된다
# → 필수 검사 통과 후 기존 봇 병합(bot-pr-automerge.yml)이 병합한다. 이 워크플로는 PR 토큰을 직접 쓰지 않는다.
# ZIP 안: manifest.csv가 있으면 그 목록대로, 없으면 파일 이름 <직무>_<환경>_<번호>.png 규칙으로 읽는다. 새 서비스·유료 API 없음.
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '사진 묶음 ZIP 주소(https) — zip_path를 쓰면 비워 둔다'
        required: false
      zip_path:
        description: '저장소 안 ZIP 경로(예: data/image-intake/묶음.zip) — 주소 대신'
        required: false
      ai:
        description: 'AI 생성 그림이면 true (파일 이름 방식일 때; manifest.csv 방식은 목록의 ai_generated를 따름)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: image-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.pub.outputs.base }}
      bundle: ${{ steps.pub.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 입력 확인
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          [ -n "$ZIP_PATH" ] && { [[ "$ZIP_PATH" =~ ^[A-Za-z0-9_./-]+\.zip$ && "$ZIP_PATH" != *..* ]] || { echo "::error::zip_path는 저장소 안 .zip 파일"; exit 1; }; exit 0; }
          [[ "$ZIP_URL" =~ ^https://[^[:space:]\"\'\<\>]+$ ]] || { echo "::error::zip_url은 https 주소(또는 zip_path)"; exit 1; }
      - name: 받아서 풀기
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          ZIP_PATH: ${{ inputs.zip_path }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp unzip >/dev/null
          mkdir -p "$RUNNER_TEMP/in"
          if [ -n "$ZIP_PATH" ]; then
            # 저장소 안 ZIP은 실행한 브랜치에서 가져온다(기본 브랜치 코드로 등록하고, ZIP 파일만 그 브랜치 것)
            git fetch -q --depth 1 origin "$REF_NAME" && git show "FETCH_HEAD:$ZIP_PATH" > "$RUNNER_TEMP/in.zip"
          else curl -sSfL -m 300 "$ZIP_URL" -o "$RUNNER_TEMP/in.zip"; fi
          [ "$(stat -c %s "$RUNNER_TEMP/in.zip")" -le 209715200 ] || { echo "::error::ZIP이 200MB 초과"; exit 1; }
          unzip -q -o "$RUNNER_TEMP/in.zip" -d "$RUNNER_TEMP/in"
      - name: 등록하고 게시 묶음 만들기
        id: pub
        env:
          AI: ${{ inputs.ai }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=(); [ "$AI" = "true" ] && ARGS+=(--ai)
          node scripts/images/register-images.mjs "$RUNNER_TEMP/in" "${ARGS[@]}" --publish-out "$RUNNER_TEMP/bundle" | tee "$RUNNER_TEMP/result.txt"
          if [ -f "$RUNNER_TEMP/bundle/patch.diff" ]; then
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; echo "bundle=yes" >> "$GITHUB_OUTPUT"
          else echo "새로 등록할 사진이 없습니다(모두 중복이거나 이름 불명) — PR 안 만듦."; fi
      - uses: actions/upload-artifact@v4
        if: steps.pub.outputs.bundle == 'yes'
        with:
          name: image-register-bundle
          path: ${{ runner.temp }}/bundle
          retention-days: 3

  publish:
    needs: register
    if: needs.register.outputs.bundle == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: image-register-bundle
          path: ${{ runner.temp }}/bundle
      - name: 검증 후 새 브랜치·PR (기존 게시 단계, 이미지 모드)
        env:
          BASE: ${{ needs.register.outputs.base }}
        run: |
          set -euo pipefail
          git fetch -q --depth 50 origin "$BASE" 2>/dev/null || git fetch -q origin
          git worktree add -q --detach pr "$BASE"
          node scripts/ci/claude-publish.mjs pr --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/bundle" \
            --head-sha "$BASE" --head-ref "images/register-$GITHUB_RUN_ID" --workdir pr --images
