# 2026-10-24: install a browser only for the non-root runner and probe one public ad.
name: VPS runner connection check
on:
  push:
    branches: [ops/runner-connection-check-20261024]
    paths: [.github/workflows/vps-runner-connection-check.yml]
permissions: {}
jobs:
  connection-check:
    if: github.event_name == 'push' && github.repository == 'KHOAILANG0926/jobi-app' && github.ref == 'refs/heads/ops/runner-connection-check-20261024'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Install official Playwright and Chromium for runner user
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -m pip install --user --upgrade --index-url https://pypi.org/simple playwright
          python3 -m playwright install chromium
      - name: Check browser executable and sandbox launch
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          printf 'JOBI_RUNNER_CONNECTION_OK\n'
          printf 'runner=%s\n' "$RUNNER_NAME"
          python3 - <<'PYTHON'
          import os, shutil, re
          from importlib.metadata import version
          print("playwright_version=" + version("playwright"))
          from playwright.sync_api import sync_playwright
          print('display_configured=' + str(bool(os.environ.get('DISPLAY'))))
          for name in ('Xvfb', 'Xorg', 'google-chrome', 'chromium', 'x11vnc', 'websockify'):
              print(name + '_in_path=' + str(shutil.which(name) is not None))
          with sync_playwright() as p:
              available = os.path.isfile(p.chromium.executable_path)
              print('runner_chromium_executable_exists=' + str(available))
              if available:
                  try:
                      browser = p.chromium.launch(headless=True, chromium_sandbox=True, timeout=20000)
                      page = browser.new_page()
                      page.set_content('<title>JOBI runtime check</title>')
                      assert page.title() == 'JOBI runtime check'
                      print('sandboxed_browser_launch=PASS')
                      target = 'https://muaban.net/viec-lam/ban-hang-tp-bac-ninh/tefal-tuyen-pg-ban-hang-gia-dung-id71286061'
                      response = page.goto(target, wait_until='domcontentloaded', timeout=45000)
                      print('public_ad_http=' + str(response.status if response else None))
                      text = page.locator('body').inner_text(timeout=15000)
                      print('public_ad_is_tefal=' + str('TEFAL' in text.upper()))
                      reveal = page.get_by_text(re.compile(r'Bấm để hiện số|^Hiện số$', re.I))
                      visible = [reveal.nth(i) for i in range(min(reveal.count(), 10)) if reveal.nth(i).is_visible()]
                      print('visible_phone_reveal_buttons=' + str(len(visible)))
                      if visible:
                          visible[0].click(timeout=10000)
                          # Wait for a visible result; no repeated clicks, credentials or messages.
                          try:
                              page.wait_for_function("() => /Đăng nhập|Nhập số điện thoại|0[0-9]{2}[ .-]?[0-9]{3}[ .-]?[0-9]{4}/i.test(document.body.innerText)", timeout=10000)
                          except Exception:
                              pass
                          text = page.locator('body').inner_text(timeout=15000)
                          print('visible_login_text=' + str(bool(re.search(r'Đăng nhập|Nhập số điện thoại', text, re.I))))
                          phones = set(re.findall(r'(?<![0-9])0[35789][0-9][ .-]?[0-9]{3}[ .-]?[0-9]{4}(?![0-9])', text))
                          print('visible_full_phone_count=' + str(len(phones)))
                      browser.close()
                  except Exception as exc:
                      print('sandboxed_browser_launch=FAIL')
                      print('runtime_error_type=' + type(exc).__name__)
                      print('runtime_error=' + str(exc)[:3000])
                      raise
              else:
                  print('sandboxed_browser_launch=NOT_TESTED_MISSING_EXECUTABLE')
          PYTHON
