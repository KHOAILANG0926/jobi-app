# 2026-10-24: install a browser only for the non-root runner and probe one public ad.
name: VPS runner connection check
on:
  push:
    branches: [ops/runner-connection-check-20261024]
    paths: [.github/workflows/vps-runner-connection-check.yml]
permissions: {}
jobs:
  connection-check:
    if: github.event_name == 'push' && github.repository == 'KHOAILANG0926/jobi-app' && github.ref == 'refs/heads/ops/runner-connection-check-20261024'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Deploy pinned interactive login helper without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, subprocess, sys, urllib.request
          url = 'https://raw.githubusercontent.com/KHOAILANG0926/jobi-app/9bb716778fbfbc8fce6417ecd32d7e3cffa05808/ops/muaban-login.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(100000)
          expected = 'e2c2790092d740a1cf9b22cc579e92a3dcca73b259d0a9e47825cdd652229f47'
          assert hashlib.sha256(data).hexdigest() == expected, 'SOURCE_CHECKSUM_MISMATCH'
          target = pathlib.Path.home() / 'jobi-muaban-login.py'
          assert not target.is_symlink(), 'TARGET_SYMLINK_REFUSED'
          if target.exists():
              assert target.stat().st_uid == os.getuid(), 'TARGET_OWNER_MISMATCH'
              assert hashlib.sha256(target.read_bytes()).hexdigest() == expected, 'UNKNOWN_EXISTING_HELPER'
          else:
              fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o700)
              with os.fdopen(fd, 'wb') as output:
                  output.write(data)
          os.chmod(target, 0o700)
          subprocess.run([sys.executable, str(target), '--check'], check=True)
          print('LOGIN_HELPER_DEPLOYED_AND_CHECKED')
          PYTHON
