name: diag white screen (read-only, temporary)
on:
  pull_request:
    paths: ['.github/workflows/diag-white-screen.yml']
permissions: {contents: read}
jobs:
  look:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - run: npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: |
          cat > a.mjs <<'JS'
          import {chromium} from 'playwright'
          const b=await chromium.launch()
          for (const [name,w] of [['pc',1366],['mobile',390]]) {
            const p=await b.newPage({viewport:{width:w,height:900}})
            const errs=[]
            p.on('pageerror',e=>errs.push('pageerror: '+(e.stack||e.message).slice(0,900)))
            p.on('console',m=>{ if(m.type()==='error') errs.push('console: '+m.text().slice(0,500)) })
            p.on('response',r=>{ if(r.status()>=400) errs.push('http '+r.status()+' '+new URL(r.url()).pathname) })
            await p.goto('https://www.viecganban.vn/',{waitUntil:'networkidle',timeout:60000}).catch(e=>errs.push('goto '+e.message))
            await p.waitForTimeout(5000)
            const len=(await p.evaluate(()=>document.body.innerText.length))
            console.log(`::notice title=${name} body text length::${len}`)
            for (const e of errs.slice(0,8)) console.log(`::error title=${name}::${e.replace(/\n/g,' | ')}`)
          }
          await b.close()
          JS
          node a.mjs
