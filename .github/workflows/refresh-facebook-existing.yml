name: Unified job reprocess queue (ingest and R7)
on:
  push:
    branches: [master]
    paths:
      - crawler/crawl_facebook.py
      - crawler/refresh_facebook_existing.py
      - crawler/reprocess_queue.py
      - src/lib/jobDetailSections.ts
      - src/lib/sourceRecruitmentRoles.ts
      - scripts/ocr/**
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Existing job ID (optional, for explicit replay)'
        required: false
        type: number
permissions:
  contents: read
concurrency:
  group: unified-reprocess
  cancel-in-progress: false
jobs:
  reprocess:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPROCESS_VERSION: ${{ github.sha }}
      REPROCESS_ENQUEUE_ALL: ${{ github.event_name == 'push' && '1' || '0' }}
      REPROCESS_JOB_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crawler dependencies
        run: pip install -r crawler/requirements.txt
      - name: Reprocess pending source-backed jobs through ingest_job
        working-directory: crawler
        run: python reprocess_queue.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R7 comparator
        run: node scripts/ocr/ocr-compare.test.mjs
      - name: Recalculate OCR and publish gate
        run: |
          npm i --no-save pg@8
          node scripts/ocr/ocr-check.mjs
      - name: Final publication verification and queue result
        if: success()
        working-directory: crawler
        run: python finalize_reprocess_queue.py
