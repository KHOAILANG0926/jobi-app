name: PR 검사 (병합 전 필수)

# 모든 PR과 master push에서 타입 검사·테스트·빌드를 돌린다.
# master 보호 설정에서 이 검사(checks)를 필수로 걸어, 실패한 변경은 누구도(GPT·Cursor·Claude 포함) 병합할 수 없다.
# DB·VietMap·Secret을 쓰지 않는다.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 승인된 공고 틀 변경 차단
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags origin "$BASE_SHA"
          else
            BASE_SHA=HEAD
          fi
          trusted=$(mktemp -d)
          if git cat-file -e "$BASE_SHA:scripts/check-approved-layout.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-approved-layout.mjs" > "$trusted/check-approved-layout.mjs"
            git show "$BASE_SHA:scripts/approved-layout-lock.json" > "$trusted/approved-layout-lock.json"
            node "$trusted/check-approved-layout.mjs" "$PWD" "$trusted/approved-layout-lock.json" --trusted
          else
            node scripts/check-approved-layout.mjs
          fi
          node scripts/test-approved-layout-lock.mjs
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: STATUS 생성기 점검 (가짜 응답으로 끝까지 실행)
        run: |
          node scripts/status/status-lib.test.mjs
          node scripts/status/generate-status.smoke.mjs
