name: PR 검사 (병합 전 필수)

# 모든 PR과 master push에서 타입 검사·테스트·빌드를 돌린다.
# master 보호 설정에서 이 검사(checks)를 필수로 걸어, 실패한 변경은 누구도(GPT·Cursor·Claude 포함) 병합할 수 없다.
# DB·VietMap·Secret을 쓰지 않는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 완료 근거 검사 자체 시험
        run: node scripts/check-pr-ready.test.mjs
      - name: PR 완료 근거 검사 (Draft는 제외, 필수 CI는 유지)
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-ready.mjs
      - name: 기존 규정 위반 변경 차단
        if: github.event_name == 'pull_request'
        run: node scripts/check-repository-policy.mjs
      - name: 승인 범위 검사 (결정 0003 — Lee 승인은 결정 문서만)
        run: node scripts/check-approval-scope.mjs
      - name: 시험 의존성 배포 제외 회귀 검사
        run: node --test scripts/ci/deployment-package-change.test.mjs
      - name: 위치 불일치 저녁 보고 회귀 검사
        run: node --test scripts/ci/location-integrity-report.test.mjs
      - name: 운영 위치 시험의 고정 공고 의존 차단
        run: |
          node --test scripts/ci/location-test-policy.test.mjs
          node scripts/ci/location-test-policy.mjs
          node scripts/ops/location-point-oracle.test.mjs
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 테스트
        run: npm test
      - name: 관리자 지도 공유 링크 보안 단위 시험
        run: node --test scripts/ops/admin-location-review.test.mjs
      - name: Vercel Hobby 함수 수 상한 12개 검사
        run: node scripts/ci/check-vercel-functions.mjs
      - name: 관리자 위치 확정 대기 4가지 경우 검사
        run: node --test scripts/ci/admin-location-queue.test.mjs
      - name: 빌드
        run: npm run build
      - name: STATUS 생성기 점검 (가짜 응답으로 끝까지 실행)
        run: |
          node scripts/status/status-lib.test.mjs
          node scripts/status/generate-status.smoke.mjs

  migration-postgres:
    name: migration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/migration_test
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 변경된 migration을 깨끗한 PostgreSQL에 실제 적용
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check-postgres-migrations.sh

  canonical-location-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 격리 화면 시험 빌드 (실제 지도 키·운영 쓰기 없음)
        env:
          VITE_VIETMAP_TILEMAP_KEY: fixture-browser
        run: npm run build
      - name: 원본 0곳·1곳·여러 곳 메인·상세 실제 핀 시험
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/location-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4173 node scripts/ops/location-canonical-browser-fixtures.mjs

  canonical-location-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 운영 구조·권한·이관·실패 원복·동시 실행 시험 (폐기용 PostGIS)
        run: bash supabase/pending/location-single-source-20261026/production/run-local.sh
