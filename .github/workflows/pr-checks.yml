name: PR 검사 (병합 전 필수)

# 모든 PR과 master push에서 타입 검사·테스트·빌드를 돌린다.
# master 보호 설정에서 이 검사(checks)를 필수로 걸어, 실패한 변경은 누구도(GPT·Cursor·Claude 포함) 병합할 수 없다.
# DB·VietMap·Secret을 쓰지 않는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 완료 근거 검사 자체 시험
        run: node scripts/check-pr-ready.test.mjs
      - name: PR 완료 근거 검사 (Draft는 제외, 필수 CI는 유지)
        if: github.event_name == 'pull_request'
        env:
          # #648: 최신 PR 설명·커밋 작성자를 읽는다(읽기만)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-pr-ready.mjs
      - name: 정확한 migration 승인 회귀 검사
        run: node scripts/approved-migrations.test.mjs
      - name: 기존 규정 위반 변경 차단
        if: github.event_name == 'pull_request'
        env:
          # 기대값 변경 근거(#번호)가 실제 이슈·PR인지 읽는다(읽기만)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-repository-policy.mjs
      - name: 서비스 이름 하나(Việc gần Bạn) 검사
        run: node scripts/layout/brand-name-check.mjs
      - name: 결정 문서 Lee 승인 장치 자체 시험
        run: node scripts/decision-approval-gate.test.mjs
      - name: Lee 승인 판정 실제 호출 경로 시험(리뷰 여러 쪽·작성자 인자, S4-4)
        run: node scripts/decision-approval-callpath.test.mjs
      - name: 병합 조건 검사(approval-gate) 판정 시험(S4 8단계)
        run: node scripts/ci/approval-checks.test.mjs
      - name: 병합 조건 검사 재현 시험(같은 SHA PR 오염·수집 실패 시 옛 성공 무효, S4 8단계)
        run: node scripts/ci/approval-checks.main.test.mjs
      - name: AI 팀 Codex 검사 대기 규칙 시험
        run: node scripts/codex-review-gate.test.mjs
      - name: 봇 자동병합 필수 검사 판정 시험 (이름 같은 검사가 빨간 검사를 가리지 않는지, #728 S1)
        run: node scripts/ci/bot-required-checks.test.mjs
      - name: 급여 확정·저장 한 곳 시험 (R2 #753 — 정책·ingest_job 한 입구·직접 UPDATE 금지)
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/salary-fill.test.mjs
          node scripts/ci/salary-single-writer.test.mjs
      - name: 검사기 독립성 정적 시험 (jobInspect는 만드는 쪽 모듈을 import하지 않음, R2 #753)
        run: node scripts/ci/inspector-independence.test.mjs
      - name: 병합 출처 기록 판정 시험 (#687 사례 — 병합 계정·작성자·AI 자기신고를 서로 다른 필드로, R3 #728)
        run: node scripts/ci/merge-provenance.test.mjs
      - name: 필수 검사 이름 충돌 정적 시험 (checks·guard·app-screen·publication-gate가 PR 잡 1개씩인지, #728 S1)
        run: node scripts/ci/required-check-names.test.mjs
      # S4(#808): 열쇠 있는 잡이 PR 코드를 실행하지 않는지(정적) + 악성 PR 흉내 시험(실제 컨테이너 실행). 실패 = 병합 불가.
      - name: 열쇠·PR 코드 분리 검사 (모든 워크플로) + 악성 워크플로 흉내 시험
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash scripts/ci/check-secret-isolation.test.sh
          python3 scripts/ci/check-secret-isolation.py
      # S8 트랙 A(#808): 병합 뒤 후속 검사 연결 — 운영 배포 확인(deploy-verify) 성공 뒤 행정구역 핀 검사가 최신 실행이 success인 같은 커밋에서만 한 번. 실패 = 병합 불가.
      # 위 단계가 PyYAML을 설치하므로 그 뒤에 둔다(이 시험이 실제 워크플로 YAML을 읽는다).
      - name: 병합 뒤 후속 검사 연결 시험 (봇 병합·deploy-verify 성공 뒤 핀 검사 1회, 결함 주입 31개가 잡히는지)
        run: node scripts/ci/post-merge-chain.test.mjs
      - name: artifact 출처 확인 시험 (가짜 실행·브랜치·포크·이력 밖 커밋 거절)
        run: bash scripts/ci/verify-artifact-run.test.sh
      - name: master 직접 push 경보 시험 (병합 직후 PR 연결 지연은 경보 안 함, 진짜 직접 push는 경보)
        run: bash scripts/ci/direct-push-check.test.sh
      - name: PR 쪽 Claude 설정·링크 치우기 시험 (악성 hook·MCP·열쇠 파일 링크)
        run: bash scripts/ci/hold-pr-claude-settings.test.sh
      - name: Claude 입력 고르기 시험 (아무나 단 댓글의 꼬임 공격 문구가 Claude 입력에 안 들어가는지)
        run: bash scripts/ci/claude-inputs.test.sh
      - name: Claude 결과 게시 단계 시험 (꼬임 공격에 넘어간 Claude의 최악 결과물 — 비밀값·@언급·표시 위조·금지 경로·링크·트리 불일치 거절)
        run: node scripts/ci/claude-publish.test.mjs
      - name: PR 코드 상자 악성 PR 시험 (가짜 열쇠를 환경변수·.git·홈에 심고 설치·시험·빌드 단계에서 못 읽고 못 보내는지)
        run: bash scripts/ci/sandbox-run.test.sh
      - name: 승인 범위 검사 (결정 0003 — Lee 승인은 결정 문서만)
        run: node scripts/check-approval-scope.mjs
      - name: 승인 범위 검사 시험 (결정 0003 개정 — 허용 목록·일반 경로 제외)
        run: node scripts/check-approval-scope.test.mjs
      - name: 시험 의존성 배포 제외 회귀 검사
        run: node --test scripts/ci/deployment-package-change.test.mjs
      - name: 운영 배포 전 DB 적용 대기 판정 시험 (S3-5 #808 — DB 변경은 migration 성공 뒤에만 배포)
        run: bash scripts/ci/wait-migration-before-deploy.test.sh
      - name: 수집 실행 실패·신규 0건 경고 시험 (crawl-guard ⑧, Lee 2026-11-17 트랙 B)
        run: bash scripts/ci/crawl-guard-watch.test.sh
      - name: 위치 불일치 저녁 보고 회귀 검사
        run: node --test scripts/ci/location-integrity-report.test.mjs
      - name: 운영 위치 시험의 고정 공고 의존 차단
        run: |
          node --test scripts/ci/location-test-policy.test.mjs
          node scripts/ci/location-test-policy.mjs
          node scripts/ops/location-point-oracle.test.mjs
      - name: 운영 SQL 허용 문장 시험 (Lee 2026-11-09)
        run: node scripts/ops/run-sql-plan.test.mjs
      - name: 공고 등록 전 로고 확인 검사 시험 (Lee 2026-11-03)
        run: node scripts/ops/logo-check.test.mjs
      - name: 사진 처리 완료·미완료 판정 회귀
        run: |
          node scripts/ops/photo-process.test.mjs
          node scripts/ops/photo-process-pr.test.mjs
      - name: 사진 처리 미완료 원본 목록 (등록·공개는 유지)
        run: node scripts/ops/photo-process-audit.mjs photo-process-pending.json
      - name: 사진 처리 미완료 목록 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-process-pending
          path: photo-process-pending.json
          retention-days: 14
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 테스트
        run: npm test
      # S7 G21 통합(#808 S2 설계 5절 24·33·60·58): 경로가 맞을 때만 돌던 필수 아닌 시험 워크플로를 필수 checks로 옮긴다.
      #   crawler-cli-tests(offline-cli)·job-policy-tests·reprocess-queue-ci 그대로. 열쇠·네트워크·DB 없음(표준 라이브러리 Python·순수 JS).
      #   r7-source-aware-unit(ocr-compare.test)은 publication-gate(occupation-publication-check)가 모든 PR에서 이미 돌려 지움.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집기·공고 정책·재처리 대기열 시험 (S7 G21 통합)
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/read-company-ai.test.mjs
          python -I crawler/test_scheduled_cli.py
          python -I crawler/test_ingest_gateway.py
          python -I crawler/test_korea_fb_survey.py
          python -I crawler/test_finalize_reprocess_queue.py
          python -I crawler/test_job_error_isolation.py
          python -I scripts/ops/test_vps_crawl_schedule_diag.py
          python crawler/test_job_posting_policy.py
          python crawler/test_job_quality.py
          python -m py_compile crawler/job_posting_policy.py crawler/job_quality.py crawler/crawl_topcv.py crawler/crawl_facebook.py crawler/reclassify_db.py scripts/research/bn_apply_chotot_rest.py
          python -m py_compile crawler/reprocess_queue.py crawler/finalize_reprocess_queue.py crawler/refresh_facebook_existing.py
          node --check src/lib/jobPostingPolicy.mjs
          node --check register_job.mjs
          node --check crawler/reclassify_node.mjs
          node --check scripts/crawl.mjs
          node --check api/admin.js
          node --check api/_lib/admin-reprocess.js
      - name: 관리자 지도 공유 링크 보안 단위 시험
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs --test scripts/ops/admin-location-review.test.mjs
      - name: Vercel Hobby 함수 수 상한 12개 검사
        run: node scripts/ci/check-vercel-functions.mjs
      - name: 관리자 위치 확정 대기 4가지 경우 검사
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs --test scripts/ci/admin-location-queue.test.mjs
      - name: 빌드
        run: npm run build
      - name: STATUS 생성기 점검 (가짜 응답으로 끝까지 실행)
        run: |
          node scripts/status/status-lib.test.mjs
          node scripts/status/generate-status.smoke.mjs

  migration-postgres:
    name: migration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/migration_test
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 변경된 migration을 깨끗한 PostgreSQL에 실제 적용
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check-postgres-migrations.sh

  # S4(#808) 권한 시험: Claude 잡(codex-response·fallback-review·issue-mention)과 같은 권한 선언으로 실제 GitHub에서
  # 쓰기(댓글·라벨·push)·앱 토큰 발급(id-token)이 모두 막히는지 본다. 하나라도 되면 실패(=구조가 약속과 다름).
  token-drill:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: 읽기 전용 토큰으로 쓰기 시도 → 모두 거절돼야 함
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.head_ref }}
        run: |
          fail=0
          # 권한 때문에 막혔는지(403/404 '쓰기 권한 없음')를 응답 코드로 확인 — 다른 이유(형식 오류 422 등)로 실패한 것을 '막힘'으로 세지 않는다.
          try() { code=$("$@" -i 2>/dev/null | awk 'NR==1{print $2}'); case "$code" in 403|404) echo "거절됨(정상, $code): $*";; *) echo "::error::권한 거절(403/404)이 아님($code): $*"; fail=1;; esac; }
          try gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="S4 drill — 이 댓글이 보이면 권한 시험 실패"
          try gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=needs-lee'
          try gh api -X PATCH "repos/$REPO/pulls/$PR" -f body="x"
          try gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/s4-drill-$GITHUB_RUN_ID" -f sha="${{ github.event.pull_request.head.sha }}"
          try gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "::error::id-token 발급 정보가 있음(앱 토큰을 받을 수 있음)"; fail=1; else echo "id-token 발급 정보 없음(정상)"; fi
          gh api "repos/$REPO/pulls/$PR" --jq .number >/dev/null && echo "읽기는 됨(정상)" || { echo "::error::읽기도 안 됨"; fail=1; }
          exit $fail
