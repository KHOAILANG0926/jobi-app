name: PR 검사 (병합 전 필수)

# 모든 PR과 master push에서 타입 검사·테스트·빌드를 돌린다.
# master 보호 설정에서 이 검사(checks)를 필수로 걸어, 실패한 변경은 누구도(GPT·Cursor·Claude 포함) 병합할 수 없다.
# DB·VietMap·Secret을 쓰지 않는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft, labeled]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 완료 근거 검사 자체 시험
        run: node scripts/check-pr-ready.test.mjs
      - name: PR 완료 근거 검사 (Draft는 제외, 필수 CI는 유지)
        if: github.event_name == 'pull_request'
        env:
          # #648: 최신 PR 설명·커밋 작성자를 읽는다(읽기만)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-pr-ready.mjs
      - name: Lee 승인 검사 (결정 문서·승인 장치·승인된 화면 틀·needs-lee — 봇·수동 병합 공통, R3 #728)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 검사는 PR이 고칠 수 없게 master의 파일로 돌린다(PR이 검사나 잠금 목록을 고쳐 스스로 통과하는 것 방지). 승인을 확인하지 못하면 통과시키지 않는다(보류).
          # 승인 댓글(LEE-APPROVE <head SHA>)이나 승인 리뷰를 단 뒤에는 이 검사(checks)를 다시 실행하면 새 기록을 읽는다.
          mkdir -p "$RUNNER_TEMP/gate"
          git show origin/master:scripts/decision-approval-gate.mjs > "$RUNNER_TEMP/gate/decision-approval-gate.mjs"
          git show origin/master:scripts/test-desktop-baseline.mjs > "$RUNNER_TEMP/gate/test-desktop-baseline.mjs"
          if ! grep -q -- "'--pr'" "$RUNNER_TEMP/gate/decision-approval-gate.mjs"; then
            # 이 단계가 master에 들어오기 전(master의 검사에 --pr이 아직 없을 때)만 건너뛴다. 병합 뒤에는 항상 실행된다.
            echo "::notice::master의 승인 검사에 --pr이 아직 없음(이 단계를 처음 넣는 PR) — 건너뜀"
          else
            node "$RUNNER_TEMP/gate/decision-approval-gate.mjs" --pr "${{ github.event.pull_request.number }}"
          fi
      - name: 정확한 migration 승인 회귀 검사
        run: node scripts/approved-migrations.test.mjs
      - name: 기존 규정 위반 변경 차단
        if: github.event_name == 'pull_request'
        env:
          # 기대값 변경 근거(#번호)가 실제 이슈·PR인지 읽는다(읽기만)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-repository-policy.mjs
      - name: 서비스 이름 하나(Việc gần Bạn) 검사
        run: node scripts/layout/brand-name-check.mjs
      - name: 결정 문서 Lee 승인 장치 자체 시험
        run: node scripts/decision-approval-gate.test.mjs
      - name: AI 팀 Codex 검사 대기 규칙 시험
        run: node scripts/codex-review-gate.test.mjs
      - name: 봇 자동병합 필수 검사 판정 시험 (이름 같은 검사가 빨간 검사를 가리지 않는지, #728 S1)
        run: node scripts/ci/bot-required-checks.test.mjs
      - name: 급여 확정·저장 한 곳 시험 (R2 #753 — 정책·ingest_job 한 입구·직접 UPDATE 금지)
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/salary-fill.test.mjs
          node scripts/ci/salary-single-writer.test.mjs
      - name: 검사기 독립성 정적 시험 (jobInspect는 만드는 쪽 모듈을 import하지 않음, R2 #753)
        run: node scripts/ci/inspector-independence.test.mjs
      - name: 병합 출처 기록 판정 시험 (#687 사례 — 병합 계정·작성자·AI 자기신고를 서로 다른 필드로, R3 #728)
        run: node scripts/ci/merge-provenance.test.mjs
      - name: 필수 검사 이름 충돌 정적 시험 (checks·guard·app-screen·publication-gate가 PR 잡 1개씩인지, #728 S1)
        run: node scripts/ci/required-check-names.test.mjs
      - name: 승인 범위 검사 (결정 0003 — Lee 승인은 결정 문서만)
        run: node scripts/check-approval-scope.mjs
      - name: 시험 의존성 배포 제외 회귀 검사
        run: node --test scripts/ci/deployment-package-change.test.mjs
      - name: 위치 불일치 저녁 보고 회귀 검사
        run: node --test scripts/ci/location-integrity-report.test.mjs
      - name: 운영 위치 시험의 고정 공고 의존 차단
        run: |
          node --test scripts/ci/location-test-policy.test.mjs
          node scripts/ci/location-test-policy.mjs
          node scripts/ops/location-point-oracle.test.mjs
      - name: 운영 SQL 허용 문장 시험 (Lee 2026-11-09)
        run: node scripts/ops/run-sql-plan.test.mjs
      - name: 공고 등록 전 로고 확인 검사 시험 (Lee 2026-11-03)
        run: node scripts/ops/logo-check.test.mjs
      - name: 사진 처리 완료·미완료 판정 회귀
        run: |
          node scripts/ops/photo-process.test.mjs
          node scripts/ops/photo-process-pr.test.mjs
      - name: 사진 처리 미완료 원본 목록 (등록·공개는 유지)
        run: node scripts/ops/photo-process-audit.mjs photo-process-pending.json
      - name: 사진 처리 미완료 목록 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-process-pending
          path: photo-process-pending.json
          retention-days: 14
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 테스트
        run: npm test
      - name: 관리자 지도 공유 링크 보안 단위 시험
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs --test scripts/ops/admin-location-review.test.mjs
      - name: Vercel Hobby 함수 수 상한 12개 검사
        run: node scripts/ci/check-vercel-functions.mjs
      - name: 관리자 위치 확정 대기 4가지 경우 검사
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs --test scripts/ci/admin-location-queue.test.mjs
      - name: 빌드
        run: npm run build
      - name: STATUS 생성기 점검 (가짜 응답으로 끝까지 실행)
        run: |
          node scripts/status/status-lib.test.mjs
          node scripts/status/generate-status.smoke.mjs

  migration-postgres:
    name: migration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/migration_test
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 변경된 migration을 깨끗한 PostgreSQL에 실제 적용
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check-postgres-migrations.sh
