name: 지도 핀 화면 안 표시 회귀
# S7(#808 S2 설계 5절 42): 예전에는 PR(#188 전용 브랜치 2개)·운영 배포 확인 뒤(커밋 메시지에 '(#188)'일 때만)에도 걸려
# 매 배포마다 '건너뜀' 실행만 쌓였다(2026-11-16 확인: workflow_run 실행 5건 모두 skipped). 그 두 계기를 지우고 손으로 돌리는 검사로만 둔다.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Read-only deployment URL (share link for protected preview)'
        required: false
        default: 'https://www.viecganban.vn'
      cleanup:
        description: 'Check cleanup and radius controls'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pin-fit:
    env:
      MAP_CLEANUP_CHECK: ${{ inputs.cleanup && '1' || '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 위치 먼저·핀 나중 실제 화면 검사
        env:
          CHECK_URL: ${{ inputs.base_url || 'https://www.viecganban.vn' }}
        run: BASE_URL="$CHECK_URL" node scripts/ops/map-pin-fit-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-pin-fit-screenshots
          path: /tmp/map-pin-fit
          retention-days: 14
