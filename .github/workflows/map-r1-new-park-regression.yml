name: Map R1 new industrial park regression (no credentials)
on:
  push:
    branches: [ops/runner-connection-check-20261024]
    paths:
      - 'src/lib/autoLocationResolver.ts'
      - 'src/lib/autoLocationResolver.test.ts'
      - 'src/lib/industrialPark.ts'
      - 'src/lib/industrialPark.test.ts'
      - 'src/lib/parkLocate.ts'
      - 'src/lib/parkLocate.test.ts'
      - '.github/workflows/map-r1-new-park-regression.yml'
      - 'src/lib/mapR1.ts'
      - 'src/lib/mapR1.test.ts'
      - 'src/pages/JobDetail.tsx'
      - 'src/components/JobCard.tsx'
      - 'src/components/JobCard.css'
      - 'src/index.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Map R1 automated regression including unknown parks
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/autoLocationResolver.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/industrialPark.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/mapR1.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/parkLocate.test.ts
      - name: Type check
        run: npx tsc --noEmit
