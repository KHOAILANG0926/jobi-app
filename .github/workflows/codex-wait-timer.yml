name: Codex 대기 끝나면 봇 병합 다시 보기
# bot-pr-automerge.yml이 Codex 검사를 기다리는 PR을 찾으면 남은 분을 넘겨 이 작업을 부른다.
# 그 시간만큼 기다렸다가 봇 병합을 다시 부른다(GitHub 예약 실행이 자주 빠져 30분 대기가 끝나도 병합이 멈추던 문제, #574).
# 코드를 받지 않고 기다렸다가 부르기만 한다. 새 타이머가 오면 예전 타이머는 취소(가장 최근 계산이 모든 대기 PR 기준).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '기다릴 분(1~35)'
        required: true
        default: '31'

permissions:
  actions: write

concurrency:
  group: codex-wait-timer
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 기다렸다가 봇 병합 부르기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          m="$MINUTES"
          [[ "$m" =~ ^[0-9]+$ ]] || m=31
          [ "$m" -lt 1 ] && m=1
          [ "$m" -gt 35 ] && m=35
          echo "${m}분 기다림"
          sleep "$((m * 60))"
          # 깨우기 호출이 API 한도(403 rate limit)·서버 일시 오류로 실패하면 이 타이머가 유일한 재확인이라 그대로 끝나면 봇이 멈춘다(2026-11-26 #1092: 05:37 403 → 20분 넘게 병합 정지).
          # 일시 오류(한도·429·5xx·네트워크)만 정해진 횟수(6회, ${RETRY_WAIT:-240}초 간격 ≈ 20분)까지 다시 부른다. 권한·없는 워크플로 같은 영구 오류는 바로 실패 — 재시도로 풀리지 않는다.
          for attempt in 1 2 3 4 5 6; do
            if out=$(gh workflow run bot-pr-automerge.yml --repo "$REPO" --ref master 2>&1); then echo "봇 병합 호출 성공(${attempt}회째)"; exit 0; fi
            echo "::warning::봇 병합 호출 실패(${attempt}/6): $out"
            echo "$out" | grep -qiE 'rate limit|HTTP (429|5[0-9][0-9])|timed out|timeout|connection|EOF' || { echo "::error::일시 오류가 아니라 재시도하지 않음"; exit 1; }
            [ "$attempt" -lt 6 ] && sleep "${RETRY_WAIT:-240}"
          done
          echo "::error::봇 병합 호출을 6회 안에 못 함(약 20분) — 다음 이벤트·예약 실행이 봇을 부름"; exit 1
