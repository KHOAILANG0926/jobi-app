name: 시험 - location-hook 응답 확인 (병합 금지)
on:
  push:
    branches: ['probe/location-hook']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://jobi-pdi75el3d-mshw1895-6089s-projects.vercel.app https://jobi-6gzi84c7x-mshw1895-6089s-projects.vercel.app; do
            a=$(curl -s -o /tmp/a -w '%{http_code}' "$u/api/location-hook"); echo "::notice::$u GET $a $(head -c 120 /tmp/a | tr '\n' ' ')"
          done
