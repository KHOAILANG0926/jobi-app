name: Facebook 공고 1건 수집 (수동, 미리 보기 → 1건 저장)

# Lee 2026-10-29 "크롤링 한 개 진행하자": Facebook 그룹 1개만, 먼저 저장 없이 미리 보기(dryrun),
# 그다음 미리 본 글 중 1건만 입구(ingest_job)로 저장(save). 정기 실행 없음(수동만).
# 키(쿠키·서버 키)는 GitHub Secrets에만. 미리 보기 결과 파일은 1일 보관 후 삭제되는 비공개 artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dryrun = 저장 없이 미리 보기 / save = 미리 본 글 1건 저장'
        type: choice
        options: [dryrun, save]
        default: dryrun
      group:
        description: '그룹 1개(주소 일부), 예: timvieclamthembacninh'
        required: true
        default: timvieclamthembacninh
      reset_account_lock:
        description: 'Facebook 로그인·쿠키 갱신 확인 후 이번 dryrun의 계정 잠금 파일만 해제'
        type: boolean
        required: false
        default: false
      post_key:
        description: 'save일 때만: 미리 보기에서 고른 게시물 키(예: id:123)'
        required: false
        default: ''
      dryrun_run_id:
        description: 'save일 때만: 미리 보기 실행 번호(run id)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  issues: write  # 서버 공간 1GB 미만 알림(#636)

concurrency:
  # 미리 보기는 한국 Facebook 조사(korea-fb-*)와 같은 계정·컴퓨터라 같은 줄, 저장은 Facebook에 안 붙어 따로 줄(Codex #690)
  group: ${{ inputs.mode == 'save' && 'facebook-save' || 'crawl-facebook-one' }}
  cancel-in-progress: false

jobs:
  one:
    environment: ops-keys  # S4: 운영 열쇠는 master에서만 받는 환경(브랜치·PR 코드에는 안 줌)
    # S4(#822): Facebook 쿠키·서비스 키를 쓰므로 master 코드로만 돈다(다른 브랜치에서 수동 실행하면 그 브랜치 코드가 열쇠를 가짐 — 최종 독립 검토)
    if: github.ref == 'refs/heads/master'
    # 2026-11-06 Lee: Facebook은 로그인한 곳과 같은 IP(AZDIGI VPS 103.221.223.71)에서만 접속한다.
    # GitHub 서버(미국, 매번 다른 IP)에서 돌리자 session_expired(run 42152363009). VPS에 이미 연결된 실행기(crawler)에서 실행.
    # 2026-11-11: Facebook에 접속하는 건 미리 보기(dryrun)뿐 — 저장(save)은 미리 본 결과만 등록 입구로 보내므로 GitHub 서버에서 돈다
    # (수집용 컴퓨터를 다른 조사가 몇 시간 쓰는 동안 저장이 묶이던 것, Lee "다른 데서 쓰고 있으면 넌 못하는 거야?").
    runs-on: ${{ inputs.mode == 'save' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    # 열쇠는 잡 전체가 아니라 쓰는 단계에만 준다(Lee 2026-11-17 #881, S4 열쇠 분리):
    #   미리 보기 = Facebook 쿠키만(DB 열쇠 없음 → DB 중복 세기·회사 이름 읽기 생략, 저장 불가) / 저장 = DB·판독 열쇠만(Facebook 접속 없음).
    env:
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      MODE: ${{ inputs.mode }}
      GROUP: ${{ inputs.group }}
      POST_KEY: ${{ inputs.post_key }}
      DRYRUN_RUN_ID: ${{ inputs.dryrun_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 입력·키 확인
        run: |
          echo "$GROUP" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "::error::group 형식 오류(그룹 1개만)"; exit 1; }
          if [ "$MODE" = save ]; then
            echo "$POST_KEY" | grep -Eq '^[a-z]+:[A-Za-z0-9_-]+$' || { echo "::error::post_key 형식 오류(예: id:123)"; exit 1; }
            echo "$DRYRUN_RUN_ID" | grep -Eq '^[0-9]+$' || { echo "::error::dryrun_run_id 필요"; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # vietnam-provinces(crawler/requirements.txt 판)은 Python 3.12 이상
      - name: 의존성 설치
        run: |
          set -o pipefail
          { python -m pip install -r crawler/requirements.txt && { [ "$MODE" = save ] || python -m playwright install chromium; }; } 2>&1 | tee /tmp/deps.log || {
            echo "::error title=의존성 설치 실패::$(tail -c 1500 /tmp/deps.log | tr '\n' ' ')"; exit 1; }
      # #872 사전점검: checkout이 git에 없는 파일(crawler/state/)을 매번 지워 계정 잠금·본 글 기록이 사라졌다 →
      # VPS 작업 폴더 밖 고정 폴더를 수집 상태 폴더로 쓴다(crawl_facebook.py CRAWLER_STATE_DIR). 값은 출력하지 않고 있음/없음·개수만.
      - name: 수집 상태 폴더(실행 사이 유지)
        if: inputs.mode != 'save'
        run: |
          d="$HOME/jobi-crawler-state/facebook"; mkdir -p "$d"; echo "CRAWLER_STATE_DIR=$d" >> "$GITHUB_ENV"
          echo "계정 잠금 파일: $([ -f "$d/FACEBOOK_ACCOUNT_LOCK" ] && echo 있음 || echo 없음)"
          echo "본 글 기록: $(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(sum(len(v.get("keys",[])) for v in d.values()),"건")' "$d/facebook_seen.json" 2>/dev/null || echo 없음)"
      # #872: Facebook 로그인·쿠키 갱신 후, 대표가 수동으로 선택한 dryrun 한 번만 잠금을 해제한다.
      # 기본값 false; save에서는 절대 삭제하지 않으며, 크롤러의 재잠금 기능은 그대로 둔다.
      - name: 계정 잠금 수동 해제 (위치·링크 검증)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.mode == 'dryrun' && inputs.reset_account_lock == true
        shell: bash
        run: |
          set -euo pipefail
          expected_home="/home/crawler-runner"
          expected_workspace="$expected_home/actions-runner/_work/jobi-app/jobi-app"
          expected_state="$expected_home/jobi-crawler-state/facebook"
          expected_legacy="$expected_workspace/crawler/state"

          [ "$HOME" = "$expected_home" ] || { echo "::error::HOME 경로 불일치"; exit 1; }
          [ "$GITHUB_WORKSPACE" = "$expected_workspace" ] || { echo "::error::작업 폴더 경로 불일치"; exit 1; }

          # 디렉터리 체인의 심볼릭 링크를 전부 거부한다. legacy 폴더는 없어도 정상이다.
          for d in "$expected_home" \
                   "$expected_home/jobi-crawler-state" "$expected_state" \
                   "$expected_home/actions-runner" "$expected_home/actions-runner/_work" \
                   "$expected_home/actions-runner/_work/jobi-app" "$expected_workspace" \
                   "$expected_workspace/crawler" "$expected_legacy"; do
            [ ! -L "$d" ] || { echo "::error::심볼릭 링크 디렉터리 차단"; exit 1; }
          done

          [ -d "$expected_state" ] || { echo "::error::상태 디렉터리 없음"; exit 1; }
          [ -d "$expected_workspace/crawler" ] || { echo "::error::크롤러 디렉터리 없음"; exit 1; }
          [ "$(cd "$expected_home" && pwd -P)" = "$expected_home" ] || exit 1
          [ "$(cd "$expected_state" && pwd -P)" = "$expected_state" ] || exit 1
          [ "$(cd "$expected_workspace" && pwd -P)" = "$expected_workspace" ] || exit 1
          [ "$(cd "$expected_workspace/crawler" && pwd -P)" = "$expected_workspace/crawler" ] || exit 1
          if [ -e "$expected_legacy" ]; then
            [ -d "$expected_legacy" ] || exit 1
            [ "$(cd "$expected_legacy" && pwd -P)" = "$expected_legacy" ] || exit 1
          fi

          lock1="$HOME/jobi-crawler-state/facebook/FACEBOOK_ACCOUNT_LOCK"
          lock2="$GITHUB_WORKSPACE/crawler/state/FACEBOOK_ACCOUNT_LOCK"
          [ "$lock1" = "$expected_state/FACEBOOK_ACCOUNT_LOCK" ] || exit 1
          [ "$lock2" = "$expected_legacy/FACEBOOK_ACCOUNT_LOCK" ] || exit 1

          for file in "$lock1" "$lock2"; do
            [ ! -L "$file" ] || { echo "::error::잠금 파일 심볼릭 링크 차단"; exit 1; }
            if [ -e "$file" ]; then
              [ -f "$file" ] || { echo "::error::잠금 대상이 일반 파일이 아님"; exit 1; }
            fi
          done
          rm -f -- "$lock1" "$lock2"
          [ ! -e "$lock1" ] && [ ! -L "$lock1" ] || exit 1
          [ ! -e "$lock2" ] && [ ! -L "$lock2" ] || exit 1
          echo "잠금 해제 완료 (허용된 파일 2개만 검사)"

      - name: 미리 보기(저장 없음) — 그룹 1개
        if: inputs.mode == 'dryrun'
        working-directory: crawler
        env:
          FB_C_USER: ${{ secrets.FB_C_USER }}
          FB_XS: ${{ secrets.FB_XS }}
          FB_DATR: ${{ secrets.FB_DATR }}
          FB_FR: ${{ secrets.FB_FR }}
        run: |
          { [ -n "$FB_C_USER" ] && [ -n "$FB_XS" ]; } || { echo "::error title=Facebook 쿠키 없음::GitHub Secrets에 FB_C_USER·FB_XS가 없습니다. Lee가 Facebook 로그인 쿠키를 Secrets에 등록해야 수집할 수 있습니다."; exit 1; }
          set -o pipefail
          python -u crawl_facebook.py --dry-run --group "$GROUP" 2>&1 | tee /tmp/fb.log || {
            echo "::error title=Facebook 미리 보기 실패::$(tail -c 1500 /tmp/fb.log | tr '\n' ' ')"; exit 1; }
          out=$(ls -t "$CRAWLER_STATE_DIR"/facebook_dryrun_*.json | head -1)
          cp "$out" /tmp/facebook_dryrun.json
          python - <<'PY'
          import json, os
          d = json.load(open('/tmp/facebook_dryrun.json', encoding='utf-8'))
          jobs = d.get('jobs') or []
          lines = [f"## Facebook 미리 보기: 후보 {len(jobs)}건 (DB 중복 {d.get('db_duplicates')}) · 중단 {d.get('stop_state') or '없음'}", "",
                   "| 게시물 키 | 제목 | 회사 | 위치 | 연락처 |", "|---|---|---|---|---|"]
          for j in jobs[:20]:
              contact = '있음' if (j.get('employer_phone') or j.get('contact_zalo')) else '없음'
              cell = lambda v: str(v or '').replace('|', '/').replace('\n', ' ')[:60]
              lines.append(f"| {j.get('fb_post_key')} | {cell(j.get('title'))} | {cell(j.get('company'))} | {cell(j.get('location'))} | {contact} |")
              print(f"::notice title=후보 {j.get('fb_post_key')}::{cell(j.get('title'))} / {cell(j.get('company'))} / 연락처 {contact}")
          # 원문 읽기(작업자가 회사 이름·주소 읽기 오류를 로그로 바로 고치게, #633) — 전화번호는 끝 3자리만, 로그에만(요약·DB 아님)
          import re
          mask = lambda t: re.sub(r'(?<![\d.])(?:\+?84|0)[\d .\-]{5,}(\d{3})', lambda m: '***' + m.group(1), t)
          for j in jobs[:20]:
              text = str(j.get('source_text') or j.get('description') or '')[:1500]
              print(f"::group::원문 {j.get('fb_post_key')}")
              print(mask(text))
              print("::endgroup::")
          if not jobs:
              print(f"::warning title=후보 0건::{json.dumps([g.get('stop_reason') for g in d.get('groups', [])], ensure_ascii=False)}")
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: 미리 보기 결과 보관(1일, 비공개)
        if: inputs.mode == 'dryrun'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-dryrun
          path: /tmp/facebook_dryrun.json
          retention-days: 1
      # S4(#808): 받기 전에 그 실행의 출처 확인(같은 작업 파일·master·성공). 브랜치가 만든 가짜 결과 차단.
      - name: 결과 실행 출처 확인
        if: inputs.mode == 'save'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-artifact-run.sh "$DRYRUN_RUN_ID" .github/workflows/crawl-facebook-one.yml workflow_dispatch
      - name: 미리 보기 결과 가져오기
        if: inputs.mode == 'save'
        uses: actions/download-artifact@v4
        with:
          name: facebook-dryrun
          path: /tmp/fbdry
          run-id: ${{ inputs.dryrun_run_id }}
          github-token: ${{ github.token }}
      # 회사 이름 AI 확인(scripts/ocr/read-company-ai.mjs, #872 R)은 Node 22 형식 지우기 실행이 필요하다(설치 패키지 없음).
      - uses: actions/setup-node@v4
        if: inputs.mode == 'save'
        with:
          node-version: '22'
      - name: 고른 1건만 입구(ingest_job)로 저장
        if: inputs.mode == 'save'
        working-directory: crawler
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 등록 입구 포스터 글자 읽기(회사 이름이 글에 없을 때만, Lee 2026-11-07) + 원문 회사 이름 AI 3회 확인(#872 R)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::GitHub Secrets에 SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; }
          set -o pipefail
          python -u crawl_facebook.py --save-from /tmp/fbdry/facebook_dryrun.json --post-keys "$POST_KEY" --max-save 1 2>&1 | tee /tmp/fb.log || {
            echo "::error title=저장 실패::$(tail -c 1500 /tmp/fb.log | tr '\n' ' ')"; exit 1; }
          grep -E '저장 ID|결과:|⛔|🚧|저장 전 점검' /tmp/fb.log | while read -r line; do echo "::notice title=저장 결과::$line"; done
      - name: 서버 정리(실행마다) — VPS 디스크가 차지 않게
        # 저장(save)은 GitHub 서버에서 돌아 VPS 정리가 필요 없다(2026-11-11)
        if: always() && inputs.mode != 'save'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 2026-11-06: VPS(11GB)가 실행 찌꺼기로 100% 참. 다시 받을 수 있는 캐시·임시 파일·하루 지난 실행기 기록만 지운다.
          python -m pip cache purge >/dev/null 2>&1 || true
          rm -rf /tmp/deps.log /tmp/fb.log /tmp/facebook_dryrun.json /tmp/fbdry
          ls -t "$CRAWLER_STATE_DIR"/facebook_dryrun_*.json 2>/dev/null | tail -n +6 | xargs -r rm -f  # 미리 보기 결과는 최근 5개만
          find "$HOME/actions-runner/_diag" -name '*.log' -mtime +1 -delete 2>/dev/null || true
          # 2026-11-10 Lee(11-07 "바로 지울 수 있는 공간 정리" 마무리): 수집기 playwright(requirements 고정 버전)가 쓰는 브라우저만 남기고
          # 다른 chromium 버전 폴더는 지운다(다시 받을 수 있음). 쓰는 버전을 못 읽으면 아무것도 지우지 않는다.
          keep=$(python -m playwright install --dry-run chromium 2>/dev/null | awk '/Install location:/{print $3; exit}')
          if [ -n "$keep" ] && [ -d "$keep" ]; then
            for d in "$(dirname "$keep")"/chromium*; do
              [ -d "$d" ] || continue
              case "$(basename "$d")" in "$(basename "$keep")") ;; *) echo "안 쓰는 브라우저 지움: $(basename "$d") ($(du -sh "$d" | cut -f1))"; rm -rf "$d";; esac
            done
          fi
          df -h / | tail -1 | awk '{print "::notice title=서버 남은 공간::"$4" ("$5" 사용)"}'
          # 2026-11-10 Lee "반영": 남은 공간이 1GB 아래로 내려가면 그때 시스템 파일 정리(관리자 권한, #636) — 할 일에 자동으로 알린다.
          avail_kb=$(df -k / | tail -1 | awk '{print $4}')
          if [ "${avail_kb:-0}" -lt 1048576 ]; then
            left=$(df -h / | tail -1 | awk '{print $4}')
            echo "::warning title=서버 공간 부족::남은 공간 $left — 시스템 파일 정리 필요(#636)"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/636/comments" \
              -d "{\"body\":\"수집 서버 남은 공간 $left(1GB 미만) — 실행 $GITHUB_RUN_ID. 시스템 파일 정리 필요(관리자 권한).\"}" >/dev/null || true
          fi
