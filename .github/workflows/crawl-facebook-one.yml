name: Facebook 공고 1건 수집 (수동, 미리 보기 → 1건 저장)

# Lee 2026-10-29 "크롤링 한 개 진행하자": Facebook 그룹 1개만, 먼저 저장 없이 미리 보기(dryrun),
# 그다음 미리 본 글 중 1건만 입구(ingest_job)로 저장(save). 정기 실행 없음(수동만).
# 키(쿠키·서버 키)는 GitHub Secrets에만. 미리 보기 결과 파일은 1일 보관 후 삭제되는 비공개 artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dryrun = 저장 없이 미리 보기 / save = 미리 본 글 1건 저장 / inspect = 미리 본 글 1건의 원문·추출 칸과 공개 지도 핀 확인(쓰기 없음)'
        type: choice
        options: [dryrun, save, inspect]
        default: dryrun
      group:
        description: '그룹 1개(주소 일부), 예: timvieclamthembacninh'
        required: true
        default: timvieclamthembacninh
      post_key:
        description: 'save일 때만: 미리 보기에서 고른 게시물 키(예: id:123)'
        required: false
        default: ''
      dryrun_run_id:
        description: 'save일 때만: 미리 보기 실행 번호(run id)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: crawl-facebook-one
  cancel-in-progress: false

jobs:
  one:
    # Playwright 1.44(crawler/requirements.txt)가 브라우저 의존성을 설치할 수 있는 Ubuntu로 고정(ubuntu-latest는 Ubuntu 26으로 이전 중).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FB_C_USER: ${{ secrets.FB_C_USER }}
      FB_XS: ${{ secrets.FB_XS }}
      FB_DATR: ${{ secrets.FB_DATR }}
      FB_FR: ${{ secrets.FB_FR }}
      MODE: ${{ inputs.mode }}
      GROUP: ${{ inputs.group }}
      POST_KEY: ${{ inputs.post_key }}
      DRYRUN_RUN_ID: ${{ inputs.dryrun_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 입력·키 확인
        run: |
          echo "$GROUP" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "::error::group 형식 오류(그룹 1개만)"; exit 1; }
          if [ "$MODE" = save ] || [ "$MODE" = inspect ]; then
            echo "$POST_KEY" | grep -Eq '^[a-z]+:[A-Za-z0-9_-]+$' || { echo "::error::post_key 형식 오류(예: id:123)"; exit 1; }
            echo "$DRYRUN_RUN_ID" | grep -Eq '^[0-9]+$' || { echo "::error::dryrun_run_id 필요"; exit 1; }
          fi
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::GitHub Secrets에 SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; }
          if [ "$MODE" = dryrun ] && { [ -z "$FB_C_USER" ] || [ -z "$FB_XS" ]; }; then
            echo "::error title=Facebook 쿠키 없음::GitHub Secrets에 FB_C_USER·FB_XS가 없습니다. Lee가 Facebook 로그인 쿠키를 Secrets에 등록해야 수집할 수 있습니다."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # vietnam-provinces 2026.3.0은 Python 3.12 이상
      - name: 의존성 설치
        run: |
          set -o pipefail
          { python -m pip install -r crawler/requirements.txt && { [ "$MODE" != dryrun ] || python -m playwright install --with-deps chromium; }; } 2>&1 | tee /tmp/deps.log || {
            echo "::error title=의존성 설치 실패::$(tail -c 1500 /tmp/deps.log | tr '\n' ' ')"; exit 1; }
      - name: 미리 보기(저장 없음) — 그룹 1개
        if: inputs.mode == 'dryrun'
        working-directory: crawler
        run: |
          set -o pipefail
          python -u crawl_facebook.py --dry-run --group "$GROUP" 2>&1 | tee /tmp/fb.log || {
            echo "::error title=Facebook 미리 보기 실패::$(tail -c 1500 /tmp/fb.log | tr '\n' ' ')"; exit 1; }
          out=$(ls -t state/facebook_dryrun_*.json | head -1)
          cp "$out" /tmp/facebook_dryrun.json
          python - <<'PY'
          import json, os
          d = json.load(open('/tmp/facebook_dryrun.json', encoding='utf-8'))
          jobs = d.get('jobs') or []
          lines = [f"## Facebook 미리 보기: 후보 {len(jobs)}건 (DB 중복 {d.get('db_duplicates')}) · 중단 {d.get('stop_state') or '없음'}", "",
                   "| 게시물 키 | 제목 | 회사 | 위치 | 연락처 |", "|---|---|---|---|---|"]
          for j in jobs[:20]:
              contact = '있음' if (j.get('employer_phone') or j.get('contact_zalo')) else '없음'
              cell = lambda v: str(v or '').replace('|', '/').replace('\n', ' ')[:60]
              lines.append(f"| {j.get('fb_post_key')} | {cell(j.get('title'))} | {cell(j.get('company'))} | {cell(j.get('location'))} | {contact} |")
              print(f"::notice title=후보 {j.get('fb_post_key')}::{cell(j.get('title'))} / {cell(j.get('company'))} / 연락처 {contact}")
          if not jobs:
              print(f"::warning title=후보 0건::{json.dumps([g.get('stop_reason') for g in d.get('groups', [])], ensure_ascii=False)}")
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: 미리 보기 결과 보관(1일, 비공개)
        if: inputs.mode == 'dryrun'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-dryrun
          path: /tmp/facebook_dryrun.json
          retention-days: 1
      - name: 미리 보기 결과 가져오기
        if: inputs.mode == 'save' || inputs.mode == 'inspect'
        uses: actions/download-artifact@v4
        with:
          name: facebook-dryrun
          path: /tmp/fbdry
          run-id: ${{ inputs.dryrun_run_id }}
          github-token: ${{ github.token }}
      - name: 고른 1건만 입구(ingest_job)로 저장
        if: inputs.mode == 'save'
        working-directory: crawler
        run: |
          set -o pipefail
          python -u crawl_facebook.py --save-from /tmp/fbdry/facebook_dryrun.json --post-keys "$POST_KEY" --max-save 1 2>&1 | tee /tmp/fb.log || {
            echo "::error title=저장 실패::$(tail -c 1500 /tmp/fb.log | tr '\n' ' ')"; exit 1; }
          grep -E '저장 ID|결과:|⛔|🚧|저장 전 점검' /tmp/fb.log | while read -r line; do echo "::notice title=저장 결과::$line"; done
      - name: 확인(쓰기 없음) — 원문·추출 칸·공개 지도 핀
        if: inputs.mode == 'inspect'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          d = json.load(open('/tmp/fbdry/facebook_dryrun.json', encoding='utf-8'))
          key = os.environ['POST_KEY']
          j = next((x for x in d.get('jobs', []) if x.get('fb_post_key') == key), None)
          if not j: print(f"::error::{key} 없음"); raise SystemExit(1)
          text = (j.get('description') or '').replace('[source:facebook]', '', 1).strip()
          show = {k: j.get(k) for k in ('title','company','location','salary','hours','category','occupation_code','num_hires','work_period','images')}
          print('::notice title=추출 칸::' + json.dumps(show, ensure_ascii=False)[:1800])
          print(f"::notice title=원문 길이::{len(text)}자")
          for i in range(0, min(len(text), 3600), 1200):
              print(f"::notice title=원문 {i//1200+1}::" + text[i:i+1200].replace('\n', ' / '))
          PY
          curl -sS "https://www.viecganban.vn/api/map-locations?ids=5063" | head -c 1500 | sed 's/^/::notice title=공개 지도 핀(5063)::/'
