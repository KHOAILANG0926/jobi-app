name: 공고 이미지 OCR 대조 (R7)

# 이미지가 저장된 공고를 독립 AI 판독자(결정 0004)로 따로 읽어 ocr_text에 저장하고, DB 값(전화번호·급여·이름·회사·연령)과 대조한다.
# 어긋난 공고는 그 항목만 기록하고 비공개 보류(active=false). 저장 거부는 하지 않는다(OCR도 틀릴 수 있음).
# 필요한 Secrets(모두 이미 등록됨): SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      all_jobs:
        description: '기준 시각 이전 공고도 상세 채우기·AI 판정·업종을 한 번 다시 (Lee 2026-11-08·11-12, KDA 제외, 검사표는 읽기 전용)'
        type: boolean
        default: false
  # 2026-11-01 Lee "공고 하나를 빨리": 공고를 저장하는 작업이 끝나면 30분을 기다리지 않고 바로 처리한다.
  # (30분 예약 실행은 놓친 공고를 위한 예비로 남긴다.)
  workflow_run:
    workflows:
      - 'Facebook 공고 1건 수집 (수동, 미리 보기 → 1건 저장)'
      - '채용공고 자동 크롤링'
      - '운영 - 포스터 공고 등록 (수동 실행)'
      - 'Unified job reprocess queue (ingest and R7)'
    types: [completed]
  push:
    branches: [master]
    paths:
      - scripts/ocr/**
      - src/lib/jobDetailFill.ts
      - src/lib/jobDetailSections.ts
      - src/lib/jobDescriptionBuild.ts
      - src/lib/jobInspect.ts
      - src/lib/aiClassifyGuard.ts
      - src/lib/sourceSalary.ts
      - src/lib/salaryReader.ts
      - src/lib/businessType.ts
      - src/lib/logoLookup.ts
      - src/lib/companyPlaceSearch.ts
      - config/auto-processing-cutoff.json
      - scripts/ops/job-inspect.mjs
      - scripts/ops/detail-read.mjs
      - scripts/ops/screen-collect.mjs
      - src/lib/screenAudit.ts
      - .github/workflows/job-ocr-check.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: job-ocr-check
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTO_ALL_JOBS: ${{ inputs.all_jobs && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 준비(DB 도구 한 번만 설치)
        run: npm i --no-save pg@8
      - name: 대조 로직 자체 시험
        run: |
          node --experimental-strip-types scripts/ocr/ocr-compare.test.mjs
          node --experimental-strip-types src/lib/salaryReader.test.ts
      - name: 빠진 줄 보충 로직 자체 시험 (실패하면 보충하지 않음)
        run: node --experimental-strip-types src/lib/jobDetailFill.test.ts
      - name: 규칙 R7 준비 확인 (마이그레이션 적용 전이면 조용히 종료)
        id: ready
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          n=$(psql "$SUPABASE_DB_URL" -X -At -c "select count(*) from information_schema.columns where table_name='local_jobs' and column_name='ocr_check'")
          echo "ready=$n" >> "$GITHUB_OUTPUT"
      - name: 판독자 교정 시험 (실패하면 판정하지 않음, 결정 0004)
        if: steps.ready.outputs.ready == '1'
        run: node --experimental-strip-types scripts/ocr/ai-reader.test.mjs
      - name: OCR 대조 실행
        if: steps.ready.outputs.ready == '1'
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/ocr-check.mjs
      - name: 상세요강 빠진 줄 자동 보충 (2026-10-20 Lee 결정 — 막지 않고 원문 글자 그대로 채움)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/detail-fill.mjs
      - name: AI 칸·복리후생 판정 (2026-10-25 Lee — 단어 규칙이 못 정한 줄·복리후생을 뜻으로, 정해진 번호표 중에서만)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/aiClassifyGuard.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/ai-classify.mjs
      - name: 업종으로 큰 분류 정하기 (2026-11-01 Lee — 업무가 원문에 없으면 업체 이름·매장 검색으로 서비스업 분류)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        run: |
          node --experimental-strip-types src/lib/businessType.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/business-type.mjs
      - name: 로고 찾기 한도 초과 공고 다시 시도 (Lee 2026-11-09 — 한도 초과는 영구 실패가 아님, 6시간 지난 것만 최대 10건, 같은 월 한도)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        continue-on-error: true
        run: |
          # 결과는 건수만(공고 내용·키 출력 없음). 서버가 안 되면 다음 실행에 다시.
          curl -fsS -m 60 -X POST https://www.viecganban.vn/api/location-hook -H 'content-type: application/json' \
            -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -d '{"logo_retry":{"limit":10}}' || echo "::warning::로고 다시 시도 서버 응답 없음(다음 실행에 다시)"
      - name: 상세요강 다시 채우기 (2026-11-01 — AI가 방금 정한 칸을 같은 실행에서 반영, 다음 실행까지 기다리지 않음)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/detail-fill.mjs
      - name: 공고 검사표 (2026-10-25 Lee 결정 — 올린 공고마다 문제를 찾아 알림, 연속 10개 통과가 크롤링 시작 조건)
        id: inspect
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs src/lib/jobInspect.test.ts
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/job-inspect.mjs
      # 화면 대조(#646, Lee 2026-11-10 sb-5876): 검사표에서 '화면 대조'만 남은 비공개 공고를 관리자 비공개 상세(PC·모바일)로 열어
      # 원문·DB와 대조하고 기록 → 검사표를 한 번 더 돌려 확정 오류가 없으면 같은 실행에서 공개. 대상이 없으면 브라우저를 설치하지 않는다.
      - name: 화면 대조 브라우저 설치
        if: ${{ !cancelled() && steps.inspect.outputs.screen_wait != '' && steps.inspect.outputs.screen_wait != '0' }}
        run: npx playwright install --with-deps chromium
      - name: 화면 대조 (공개 후보, 관리자 비공개 상세)
        if: ${{ !cancelled() && steps.inspect.outputs.screen_wait != '' && steps.inspect.outputs.screen_wait != '0' }}
        env:
          SCREEN_CANDIDATES: '1'
          BASE_URL: https://viecganban.vn
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/detail-read.mjs
      - name: 공고 검사표 다시 (화면 대조 결과 반영)
        if: ${{ !cancelled() && steps.inspect.outputs.screen_wait != '' && steps.inspect.outputs.screen_wait != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/job-inspect.mjs
      - name: 멈춤 알림 (2026-11-01 Lee — 처리 단계가 멈추면 바로 알림)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='공고 처리 멈춤'
          body="새 공고 처리(사진 글자·급여·상세 채우기·검사) 중 한 단계가 실패했습니다. 이미 공개된 공고는 그대로입니다. 실행 기록: $RUN_URL"
          num=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$REPO" --body "$body"; else gh issue create --repo "$REPO" --title "$title" --body "$body"; fi
