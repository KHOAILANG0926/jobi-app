name: 공고 이미지 OCR 대조 (R7)

# 이미지가 저장된 공고를 독립 AI 판독자(결정 0004)로 따로 읽어 ocr_text에 저장하고, DB 값(전화번호·급여·이름·회사·연령)과 대조한다.
# 어긋난 공고는 그 항목만 기록하고 비공개 보류(active=false). 저장 거부는 하지 않는다(OCR도 틀릴 수 있음).
# 필요한 Secrets(모두 이미 등록됨): SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - scripts/ocr/**
      - src/lib/jobDetailFill.ts
      - src/lib/jobDetailSections.ts
      - .github/workflows/job-ocr-check.yml

permissions:
  contents: read

concurrency:
  group: job-ocr-check
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 대조 로직 자체 시험
        run: node scripts/ocr/ocr-compare.test.mjs
      - name: 빠진 줄 보충 로직 자체 시험 (실패하면 보충하지 않음)
        run: node --experimental-strip-types src/lib/jobDetailFill.test.ts
      - name: 규칙 R7 준비 확인 (마이그레이션 적용 전이면 조용히 종료)
        id: ready
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          n=$(psql "$SUPABASE_DB_URL" -X -At -c "select count(*) from information_schema.columns where table_name='local_jobs' and column_name='ocr_check'")
          echo "ready=$n" >> "$GITHUB_OUTPUT"
      - name: 판독자 교정 시험 (실패하면 판정하지 않음, 결정 0004)
        if: steps.ready.outputs.ready == '1'
        run: node scripts/ocr/ai-reader.test.mjs
      - name: OCR 대조 실행
        if: steps.ready.outputs.ready == '1'
        run: |
          npm i --no-save pg@8
          node scripts/ocr/ocr-check.mjs
      - name: 상세요강 빠진 줄 자동 보충 (2026-10-20 Lee 결정 — 막지 않고 원문 글자 그대로 채움)
        if: ${{ !cancelled() && steps.ready.outputs.ready == '1' }}
        run: |
          npm i --no-save pg@8
          node --experimental-strip-types scripts/ocr/detail-fill.mjs
