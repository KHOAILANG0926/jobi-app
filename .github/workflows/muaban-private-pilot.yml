name: Muaban private two-job pilot
on:
  push:
    branches: [ops/runner-connection-check-20261024]
    paths:
      - ops/muaban-private-pilot.py
      - .github/workflows/muaban-private-pilot.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: muaban-private-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'KHOAILANG0926/jobi-app' && github.ref == 'refs/heads/ops/runner-connection-check-20261024' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract two private records using existing server login
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 ops/muaban-private-pilot.py
