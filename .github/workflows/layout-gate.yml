name: 공고 도면 게이트 (공개 공고 전체)

# 결정 0005: 공개된 모든 공고를 운영 화면에서 도면(숫자)으로 잰다. 틀이 어긋난 공고는 자동 비공개 + 이슈 기록.
# 기준 공고(#4824)까지 어긋나면 화면 코드·운영 문제이므로 공고는 숨기지 않고 경고 이슈만 남긴다.
# 실행 시점: 공고 등록·OCR 공개 직후(workflow_run), 30분마다, 수동.
# 이 파일·측정기를 바꾸는 PR에서는 "예행연습": 공고 1건에 고장(회사명 줄 제거)을 주입해 실제로 잡히고
# 실제 DB 트리거로 비공개 전환되는지 확인한 뒤 되돌린다(ROLLBACK, 운영 데이터 변화 없음).
on:
  pull_request:
    paths:
      - .github/workflows/layout-gate.yml
      - docs/decisions/drawings/**
  schedule:
    - cron: '15,45 * * * *'
  workflow_run:
    workflows: ['공고 이미지 OCR 대조 (R7)', '운영 - 포스터 공고 등록 (수동 실행)']
    types: [completed]
  workflow_dispatch:
    inputs:
      fault:
        description: '시험 전용 고장 주입 "공고id:CSS" (입력하면 실제 비공개 전환 없이 되돌림 시험만)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: layout-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: https://www.viecganban.vn
      FAULT_INPUT: ${{ inputs.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq
      - name: 측정기 자가시험
        run: node docs/decisions/drawings/measure.mjs selftest
      - name: 공개 공고 목록 (운영 DB)
        id: ids
        run: |
          ids=$(psql "$SUPABASE_DB_URL" -X -At -c "select string_agg(id::text, ' ' order by id) from public.local_jobs where active")
          echo "공개 공고: $ids"; echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            fid=$(echo "$ids" | tr ' ' '\n' | grep -vx 4824 | head -1)
            [ -n "$fid" ] || { echo "::error::예행연습할 공개 공고(기준 외)가 없음"; exit 1; }
            echo "LAYOUT_FAULT=$fid:.jd2-header__company,.jc__company,.discovery-job__company{display:none !important}" >> "$GITHUB_ENV"
            echo "REHEARSAL_ID=$fid" >> "$GITHUB_ENV"
            echo "예행연습: #$fid 에 회사명 줄 제거 고장 주입"
          elif [ -n "$FAULT_INPUT" ]; then
            echo "LAYOUT_FAULT=$FAULT_INPUT" >> "$GITHUB_ENV"
            echo "REHEARSAL_ID=${FAULT_INPUT%%:*}" >> "$GITHUB_ENV"
          fi
      - name: 도면 측정
        env:
          LAYOUT_IDS: ${{ steps.ids.outputs.ids }}
        run: node docs/decisions/drawings/measure.mjs gate all
      - name: 판정·비공개 전환
        run: |
          set -euo pipefail
          base=$(jq -r .baseOk layout-out/gate.json)
          n=$(jq '.failing | length' layout-out/gate.json)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "기준 공고 일치: $base / 어긋난 공고: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$base" != "true" ]; then
            printf '기준 공고(#4824)가 도면과 다릅니다 → 화면 코드·운영 문제. 공고는 숨기지 않았습니다.\n%s\n' "$run_url" > body.md
            jq -r '.failing[] | "- #\(.id): \(.problems[0])"' layout-out/gate.json >> body.md || true
            gh issue create --title "도면 게이트: 기준 공고 불일치" --body-file body.md || true
            exit 1
          fi
          if [ -n "${REHEARSAL_ID:-}" ]; then
            jq -e --argjson id "$REHEARSAL_ID" '[.failing[].id] | index($id) != null' layout-out/gate.json >/dev/null \
              || { echo "::error::예행연습 실패: 고장 주입한 #$REHEARSAL_ID 를 못 잡음"; exit 1; }
            echo "예행연습: #$REHEARSAL_ID 고장을 잡음" | tee -a "$GITHUB_STEP_SUMMARY"
            others=$(jq --argjson id "$REHEARSAL_ID" '[.failing[] | select(.id != $id)] | length' layout-out/gate.json)
            [ "$others" = "0" ] || { echo "::error::고장 주입 안 한 공고도 불일치 $others 건"; jq . layout-out/gate.json; exit 1; }
          fi
          [ "$n" = "0" ] && { echo "모든 공개 공고 도면 일치"; exit 0; }
          for id in $(jq -r '.failing[].id' layout-out/gate.json); do
            reason=$(jq -r --argjson id "$id" '.failing[] | select(.id==$id) | .problems[0]' layout-out/gate.json | cut -c1-300)
            if [ -n "${LAYOUT_FAULT:-}" ]; then
              echo "시험 모드: #$id 비공개 전환을 실제 트리거로 실행 후 되돌림(ROLLBACK)"
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At > psql.out 2>&1 <<SQL || { sed 's/^/::error::DB: /' psql.out; exit 1; }
          begin;
          update public.local_jobs set active = false, publish_gate_reason = 'layout_mismatch' where id = $id;
          select 'rollback-test #' || id || ' active=' || active || ' reason=' || coalesce(publish_gate_reason,'') from public.local_jobs where id = $id;
          rollback;
          select 'after-rollback #' || id || ' active=' || active from public.local_jobs where id = $id;
          SQL
              cat psql.out | tee -a "$GITHUB_STEP_SUMMARY"
              grep -q "rollback-test #$id active=false reason=layout_mismatch" "$GITHUB_STEP_SUMMARY" || { echo "::error::예행연습: 비공개 전환이 DB에서 적용되지 않음"; exit 1; }
              grep -q "after-rollback #$id active=true" "$GITHUB_STEP_SUMMARY" || { echo "::error::예행연습: 되돌림 후 공개 상태가 아님"; exit 1; }
              echo "예행연습: 실제 DB 트리거로 비공개 전환 확인 후 되돌림 완료" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -c "update public.local_jobs set active = false, publish_gate_reason = 'layout_mismatch' where id = $id returning id, active" > psql.out 2>&1 || { sed 's/^/::error::DB: /' psql.out; exit 1; }
              printf '공고 #%s 가 도면(결정 0005)과 달라 자동 비공개했습니다.\n이유: %s\n%s\n' "$id" "$reason" "$run_url" > body.md
              gh issue create --title "도면 불일치로 비공개: #$id" --body-file body.md || true
            fi
          done
