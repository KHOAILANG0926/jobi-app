name: 채용공고 자동 크롤링

# vieclam24h 신규 수집(크롤러 crawler/crawl_topcv.py). Facebook 신규 수집은 VPS 경로(crawler/run_daily.sh)로 따로다.
# Lee 2026-11-17 트랙 B: 크롤링 조기 재개 — 순서 = 소량 실제 수집(수동, 표본 최대 10) → 자동 예약 실행 → 48시간 운영 검증.
# 이 단계(1단계)는 수동 소량 수집만 연다. 예약(schedule) 실행은 소량 수집 결과 확인 뒤 별도 PR에서 연다(#872).
# 위치 확인·비공개 보류·공개 기준은 등록 입구(ingest_job)가 그대로 적용한다 — 이 파일은 실행 여부만 정한다.
on:
  schedule:
    - cron: '0 15 * * *'  # 매일 저녁 10시 (UTC+7 → 15:00 UTC) — 2단계 PR 전에는 아래 if가 막는다
  workflow_dispatch:
    inputs:
      confirm_full_crawl:
        description: '수집·DB 저장을 실행합니다. 명시적으로 확인한 경우만 선택하세요.'
        type: boolean
        required: true
        default: false
      sample_limit:
        description: '이번 실행에서 처리할 공고 수(1~10, 크롤러가 10 넘으면 거부)'
        type: string
        required: true
        default: '3'

permissions:
  contents: read

concurrency:
  group: crawl-vieclam24h
  cancel-in-progress: false

jobs:
  crawl:
    environment: ops-keys  # S4: 운영 열쇠는 master에서만 받는 환경(브랜치·PR 코드에는 안 줌)
    # 1단계: master에서 확인 체크한 수동 실행만. 예약 실행은 아직 안 돈다(2단계 PR에서 조건을 바꾼다).
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_full_crawl && github.ref == 'refs/heads/master'
    # 마지막 실제 실행 5건(2026-08-24~28)이 모두 의존성 설치에서 실패 —
    # ubuntu-latest(24.04)에는 libasound2가 없는데 playwright 1.44 설치 목록에 24.04 항목이 없어 옛 이름을 설치함.
    # 같은 crawler/requirements.txt를 쓰는 refresh-facebook-existing.yml과 같은 ubuntu-22.04·Python 3.12로 맞춘다.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # vietnam-provinces==2026.9.0은 Python 3.12 이상(3.11이면 설치 실패)

      - name: 의존성 설치
        run: |
          python -m pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 크롤링 실행
        env:
          SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
        run: |
          echo "$SAMPLE_LIMIT" | grep -Eq '^([1-9]|10)$' || { echo "::error::sample_limit는 1~10"; exit 1; }
          # --new-only: 이미 DB에 있는 공고는 건너뛰고 신규만 N건(기존 공고를 건드리지 않음, 검토관 지적 #877)
          python crawler/crawl_topcv.py --confirm-full-crawl --sample-limit "$SAMPLE_LIMIT" --new-only
