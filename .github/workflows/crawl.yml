name: 채용공고 자동 크롤링
# 대상 = vieclam24h.vn — crawler/crawl_topcv.py는 이름과 달리 vieclam24h 수집기다(파일 첫 줄 설명, --site 기본값 vieclam24h).

# 제목에 목록 위치·건수를 남긴다 — 정기·보충 실행의 '오늘 자리' 판정(scripts/ci/crawl-slot.sh)이 이 제목을 읽는다(#1071).
# 검증 저장 실행(verify_save_run_id)은 수집이 아니므로 다른 제목을 쓴다 — 11-26 검증 저장을 10건 입력으로 불러 '목록 위치 0 · 10건' 제목이 붙어 자리를 채운 것으로 보일 뻔함.
run-name: ${{ inputs.verify_save_run_id && format('채용공고 자동 크롤링 · 검증 저장(수집 실행 {0})', inputs.verify_save_run_id) || format('채용공고 자동 크롤링 · 목록 위치 {0} · {1}건', inputs.sample_offset || (github.event.schedule == '23 8 * * *' && '10' || '0'), inputs.sample_limit || '10') }}

on:
  # Lee 2026-11-25: vieclam24h 정기 수집 재개 — 하루 20건(아침 목록 앞 10건 + 오후 그다음 10건).
  # 수집은 VPS(DB 열쇠 없음), 저장은 GitHub 서버(ops-keys, 사이트 접속 없음) — #884 B안 그대로.
  schedule:
    - cron: '23 2 * * *'   # 09:23(베트남) — 목록 앞 10건
    - cron: '23 8 * * *'   # 15:23(베트남) — 목록 그다음 10건
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시험 수집(#872): 실제 사이트에서 수집·파싱만, DB 열쇠 없이 실행(저장 없음)'
        type: boolean
        required: true
        default: true
      sample_limit:
        description: '이번 실행에서 처리할 공고 수(1~10)'
        type: string
        required: true
        default: '3'
      sample_offset:
        description: '목록 시작 위치(0=앞 10건, 10=그다음 10건) — 비우면 0. 정기 수집 보충(#1071)이 번갈아 넘긴다'
        type: string
        required: false
        default: ''
      keep_for_save:
        description: '검증 저장용(#884 B안): 시험 수집한 상세 결과를 30일 비공개 보관(DB 열쇠 없음, 저장 안 함)'
        type: boolean
        required: false
        default: false
      publish_one:
        description: '공고 1건 공개 등록(Lee 2026-11-18 #872, Lee 승인 필요): 위 보관 결과(1건)를 숨김 없이 등록 입구로 — 공개 여부는 DB 공개 판정이 정함'
        type: boolean
        required: false
        default: false
      verify_save_run_id:
        description: '검증 저장(#884 B안, Lee 승인 필요): 위 보관을 만든 실행 번호. 넣으면 GitHub 서버가 사이트 접속 없이 숨김 저장만 한다'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read  # 검증 저장: 보관 결과를 만든 실행 확인·받기(verify-artifact-run.sh)

concurrency:
  group: crawl-vieclam24h
  cancel-in-progress: false

jobs:
  slot:
    # 오늘 이 목록 위치(자리)를 다른 실행이 이미 수집했거나 수집 중이면 이 실행은 건너뛴다(정기 예약과 보충 호출이 겹쳐도 하루 20건 상한, #1071).
    # 판정은 scripts/ci/crawl-slot.sh 한 곳(보충 호출도 같은 것). 조회 실패는 건너뜀(닫힌 방향 — 상한 확인 불가면 수집 안 함, 빠진 자리는 보충이 채움). 10건이 아닌 시험 실행은 판정하지 않는다.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.dry_run && inputs.verify_save_run_id == '')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CRAWL_SLOT_ME: ${{ github.run_id }}
          OFFSET: ${{ inputs.sample_offset || (github.event.schedule == '23 8 * * *' && '10' || '0') }}
          LIMIT: ${{ inputs.sample_limit || '10' }}
        run: bash scripts/ci/crawl-slot.sh gate "$OFFSET" "$LIMIT" >> "$GITHUB_OUTPUT"

  crawl:
    needs: slot
    # 열쇠를 쓰지 않으므로 운영 열쇠 환경(ops-keys)도 쓰지 않는다
    # Lee 2026-11-17 #872에서 예약을 없앴고, Lee 2026-11-25 지시로 정기 수집을 다시 켠다(예약 2번 × 10건, 이 잡은 수집만).
    # 이 잡은 DB 열쇠 없이 실제 사이트 수집·파싱만(저장 없음, 1~10건). 저장은 아래 save(정기)·verify-save(수동) 잡이 GitHub 서버에서.
    if: needs.slot.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.dry_run && inputs.verify_save_run_id == ''))
    # Lee 2026-11-17 #872 승인: GitHub 서버(미국)에서는 vieclam24h 목록 24쪽 모두 403 Forbidden(run 44031120005, 데이터센터 주소 차단) →
    # 기존 베트남 VPS 실행기(Facebook 미리 보기와 같은 실행기, 새 서버 없음)에서 소량 시험만 한다.
    # Facebook과 분리: 받는 폴더는 작업 폴더 안 vieclam24h-run/(Facebook은 작업 폴더 맨 위), 임시 파일은 그 안에만(/tmp 안 씀),
    # Facebook 상태 폴더(~/jobi-crawler-state/facebook)는 읽기만 해서 실행 전후 같음을 기록한다. 실행기 1대라 두 작업이 동시에 돌지 않는다.
    # 설치는 Facebook 미리 보기와 같은 명령(실행기 계정에 관리자 권한 없음 → --with-deps 없이). 설치 가능 여부는 crawler-cli-tests.yml crawl-install이 ubuntu-22.04에서 확인.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vieclam24h-run
    env:
      # 실행기에 남은 값이 있어도 DB 열쇠가 들어가지 않게 비운다(저장 불가)
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          path: vieclam24h-run
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # vietnam-provinces==2026.9.0은 Python 3.12 이상(3.11이면 설치 실패)

      - name: Facebook 상태 폴더(실행 전, 읽기만)
        run: |
          d="$HOME/jobi-crawler-state/facebook"
          { [ -d "$d" ] && find "$d" -maxdepth 1 -type f -printf '%f %s %T@\n' | sort; } > fb-state-before.txt || true
          echo "파일 $(wc -l < fb-state-before.txt)개"

      - name: 의존성 설치
        run: |
          python -m pip install -r crawler/requirements.txt
          python -m playwright install chromium

      - name: 표본 수 확인
        env:
          SAMPLE_LIMIT: ${{ inputs.sample_limit || '10' }}
        run: echo "$SAMPLE_LIMIT" | grep -Eq '^([1-9]|10)$' || { echo "::error::sample_limit는 1~10"; exit 1; }

      - name: 수집(저장 없음 — DB 열쇠를 주지 않음)
        if: github.event_name == 'schedule' || inputs.dry_run
        env:
          SAMPLE_LIMIT: ${{ inputs.sample_limit || '10' }}
          SAMPLE_OFFSET: ${{ inputs.sample_offset || (github.event.schedule == '23 8 * * *' && '10' || '0') }}
        # 상세 결과(details.json)는 이 수집이 받은 것을 그대로 남긴다(2026-11-26 #701·#1071) — 예전에는 다음 단계가 같은 공고를
        # 사이트에 다시 접속해 받았고, 11-26 실행 45811184938에서 그 두 번째 접속이 출력 없이 58분 멈춰 잡 한도로 취소됐다.
        run: python crawler/crawl_topcv.py --confirm-full-crawl --sample-limit "$SAMPLE_LIMIT" --sample-offset "$SAMPLE_OFFSET" --save-details-to details.json

      - name: 상세 결과 보관(30일, 비공개)
        if: github.event_name == 'schedule' || (inputs.dry_run && inputs.keep_for_save)
        uses: actions/upload-artifact@v4
        with:
          name: vieclam24h-details
          path: vieclam24h-run/details.json
          # 정기 DB 저장을 멈춘 동안(아래 save) 수집 원문을 보존 — 비공개 보관, 다시 저장할 때 --save-details로 같은 파일을 쓴다.
          retention-days: 30

      - name: 수집 결과(제목·회사·지역·급여·전화 유무만 — 번호는 출력 안 함)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'crawler')
          from job_criteria import has_enough_contact  # DB 공개 게이트·검증 저장과 같은 8자리 기준 한 곳
          f = 'jobs_output_vieclam24h.json'
          if not os.path.exists(f):
              print('결과 파일 없음'); raise SystemExit(0)
          for j in json.load(open(f, encoding='utf-8')):
              # 2026-11-27: 예전 '공개 판정 True (ok)'는 크롤러 쪽 '지원 경로 있음' 판정이라 전화 없는 글에도 True로 찍혀 공개로 읽혔다.
              # 연락처(전화·Zalo 8자리 이상)는 따로 보이고, 실제 공개는 DB 연락처 게이트가 정한다(연락처 없으면 비공개).
              contact = has_enough_contact(j.get('employer_phone'), j.get('contact_zalo'))
              print(f"- {j.get('title')} | 회사 {j.get('company') or '없음'} | 지역 {j.get('location') or '없음'} | "
                    f"급여 {j.get('salary') or '없음'} | 연락처(전화·Zalo 8자리 이상) {'있음' if contact else '없음 → DB 공개 게이트가 비공개로 막음'} | "
                    f"크롤러 지원경로 판정 {j.get('active')} ({j.get('publish_gate_reason') or '-'}, 공개 여부 아님)")
          PY

      - name: Facebook 상태 폴더(실행 후, 전과 비교)
        if: always()
        run: |
          d="$HOME/jobi-crawler-state/facebook"
          { [ -d "$d" ] && find "$d" -maxdepth 1 -type f -printf '%f %s %T@\n' | sort; } > fb-state-after.txt || true
          if cmp -s fb-state-before.txt fb-state-after.txt; then echo "Facebook 상태 폴더 변화 없음"; else echo "::error::Facebook 상태 폴더가 바뀜"; diff fb-state-before.txt fb-state-after.txt | cut -d' ' -f1-2; exit 1; fi

  save:
    # Lee 2026-11-25 정기 수집 저장: 같은 실행의 VPS 상세 결과만 받아(사이트 접속 없음) 정기 저장 경로(save_to_supabase)로 —
    # 신규는 등록 입구(ingest_job: 위치 확인·회사 이름·직업분류·중복 판정), 기존 공고는 다시 수집 갱신, 공개는 DB 공개 판정.
    # 운영 DB 열쇠는 ops-keys 환경(master만)에서 이 단계에만 — VPS로 가지 않는다.
    needs: crawl
    # 재개 준비본(Draft — Lee가 웹 정상화 종료를 결정한 뒤에만 Ready·Approve). 아래는 중단 당시 기록(Lee 2026-11-26 「웹 정상화 종료 전 신규 공개 금지 … 안전한 기존 저장 경로가 없다면 정기 DB 저장만 일시 중단」):
    #   이 저장은 새 공고를 일반 입구로 넣어 DB 공개 판정이 통과시키면 바로 공개될 수 있다. 수집과 원문 보관(위 crawl 잡, 30일)은 그대로.
    #   다시 켤 때는 아래 줄의 `false &&`만 지운다(Lee 승인).
    if: github.event_name == 'schedule'
    environment: ops-keys
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치(브라우저 없음 — 사이트에 접속하지 않는다)
        run: python -m pip install -r crawler/requirements.txt
      - name: 같은 실행의 상세 결과 가져오기
        uses: actions/download-artifact@v4
        with:
          name: vieclam24h-details
          path: /tmp/v24
      - name: 저장(정기 수집 경로 — 공개는 DB 공개 판정)
        env:
          SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::GitHub Secrets에 SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; }
          python crawler/crawl_topcv.py --save-details /tmp/v24/details.json --confirm-write

  verify-save:
    # Lee 2026-11-17 #884 B안: VPS는 수집만(위 crawl, DB 열쇠 없음), 검증·저장은 GitHub 서버(사이트 접속 없음).
    # 운영 DB 열쇠는 ops-keys 환경(master만, S4 R8)에서 저장 단계에만 준다 — VPS로 가지 않는다.
    # 저장은 --verify-write: 새 공고만, 비공개·숨김 강제, 연락처 있는 공고는 저장 안 함(숨김 실패에도 DB 공개 차단 규칙이 막게), 1~10건.
    # publish_one(Lee 2026-11-18 #872, 승인 필요): 같은 보관 결과 1건만 숨김 없이 등록 입구로 — 새 공고만, 공개는 DB 공개 판정이 정함.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.verify_save_run_id != ''
    environment: ops-keys
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUN_ID: ${{ inputs.verify_save_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치(브라우저 없음 — 사이트에 접속하지 않는다)
        run: python -m pip install -r crawler/requirements.txt
      - name: 보관 결과 출처 확인(master·같은 파일·성공 실행만)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-artifact-run.sh "$RUN_ID" .github/workflows/crawl.yml workflow_dispatch
      - name: 보관 결과 가져오기
        uses: actions/download-artifact@v4
        with:
          name: vieclam24h-details
          path: /tmp/v24
          run-id: ${{ inputs.verify_save_run_id }}
          github-token: ${{ github.token }}
      - name: 검증 저장(숨김·비공개, 새 공고만) — publish_one이면 1건 일반 등록(입구·DB 공개 판정 그대로)
        env:
          SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_ONE: ${{ inputs.publish_one }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::GitHub Secrets에 SUPABASE_SERVICE_ROLE_KEY 없음"; exit 1; }
          if [ "$PUBLISH_ONE" = "true" ]; then
            python crawler/crawl_topcv.py --publish-one --confirm-write --verify-write-details /tmp/v24/details.json
          else
            python crawler/crawl_topcv.py --verify-write --confirm-write --verify-write-details /tmp/v24/details.json
          fi
