name: 채용공고 자동 크롤링

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 저녁 10시 (UTC+7 → 15:00 UTC)
  workflow_dispatch:
    inputs:
      confirm_full_crawl:
        description: '전체 수집·DB 저장을 실행합니다. 명시적으로 확인한 경우만 선택하세요.'
        type: boolean
        required: true
        default: false

jobs:
  crawl:
    # 사용자 지시: 필터 검증·별도 재개 승인 전에는 예약/수동 모두 실행 금지.
    # 인자는 정합화하되 실제 수집 재개는 별도 승인 PR에서 결정한다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 크롤링 실행
        env:
          SUPABASE_URL: https://edhuesdnuxlbcfephutq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/crawl_topcv.py --confirm-full-crawl
