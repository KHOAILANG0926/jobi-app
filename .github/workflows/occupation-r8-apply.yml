name: R8 직업군 규칙 적용·기존 공고 분류·점검

# PR 병합(master) 시 규칙 R8(local_jobs 직업코드 칸 2개 + 트리거)을 운영 DB에 적용하고,
# 미분류 공고에 자동 분류기(crawler/occupation_classifier.py) 결과를 채운 뒤 점검한다.
# 공개 상태(active·admin_hidden)는 바꾸지 않는다(전후 비교로 확인). 키는 GitHub Secrets에만: SUPABASE_DB_URL
on:
  push:
    branches: [master]
    paths:
      - supabase/tests/local_jobs_occupation_r8_check.sql
      - crawler/occupation_classifier.py
      - scripts/occupations/backfill_occupations.py
      - scripts/occupations/backfill_occupations_test.py
      - config/auto-processing-cutoff.json
      - .github/workflows/occupation-r8-apply.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: occupation-r8-apply
  cancel-in-progress: false

jobs:
  apply-backfill-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: 키 등록 확인
        run: test -n "$SUPABASE_DB_URL" || { echo "::error::GitHub Secrets에 SUPABASE_DB_URL이 없습니다."; exit 1; }
      - name: PostgreSQL 클라이언트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 선행 확인 (occupation_master)
        run: |
          n=$(psql "$SUPABASE_DB_URL" -X -At -c "select count(*) from public.occupation_master")
          test "$n" = "1505" || { echo "::error::occupation_master가 1505건이 아닙니다($n)."; exit 1; }
      - name: 공개 상태 기록 (전)
        run: psql "$SUPABASE_DB_URL" -X -At -c "select coalesce(md5(string_agg(id||':'||coalesce(active::text,'')||':'||admin_hidden::text, ',' order by id)),'') from public.local_jobs" > before.txt
      # 2026-11-03: 옛 migration(20261015120000)을 다시 실행하던 "R8 적용"·"이력 기록" 단계를 없앴다.
      # 그 단계가 10-18 규칙(1~5단계 허용)을 옛 정의(4·5단계만)로 덮어썼다(11-02 #5247 실패). DB 규칙은 migrations-apply만 적용한다.
      - name: R8 현재 규칙 확인 (읽기 전용)
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/r8_any_level_restore_production_check.sql
      - name: 보충 보호 기준 시험 (기존 공고 보호, Lee 2026-11-01)
        run: python3 -I scripts/occupations/backfill_occupations_test.py
      - name: 미분류 공고 자동 분류 (기준 시각 이후 공고만)
        run: |
          psql "$SUPABASE_DB_URL" -X -At -c "select coalesce(json_agg(json_build_object('id', id, 'title', title, 'source_text', source_text, 'created_at', created_at)), '[]') from public.local_jobs where occupation_code is null" > rows.json
          python3 -I scripts/occupations/backfill_occupations.py < rows.json > backfill.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f backfill.sql
      - name: 공개 상태 비교 (후)
        run: |
          psql "$SUPABASE_DB_URL" -X -At -c "select coalesce(md5(string_agg(id||':'||coalesce(active::text,'')||':'||admin_hidden::text, ',' order by id)),'') from public.local_jobs" > after.txt
          cmp before.txt after.txt || { echo "::error::공개 상태가 바뀌었습니다."; exit 1; }
      - name: 점검
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/local_jobs_occupation_r8_check.sql
