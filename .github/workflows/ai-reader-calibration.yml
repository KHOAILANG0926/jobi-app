name: AI reader calibration (trusted code only)
# 실제 AI 판독 교정 시험(결정 0004): 정답을 아는 실제 포스터로 판독자 자체를 검증한다. ANTHROPIC_API_KEY가 필요하다.
# 보안: pull_request(_target) 트리거를 두지 않는다 — PR이 바꾼 코드·스크립트·의존성에는 키를 주지 않는다.
#   - push(master): 병합된(검토·승인된) 코드를 검증
#   - schedule: 모델·API 변화로 판독이 달라졌는지 정기 확인
#   - workflow_dispatch: 판독 입력(scripts/ocr/ai-reader*.mjs, ocr-compare.mjs, test-fixtures/ocr)이 바뀐 PR은 사람이 코드를 확인한 뒤 같은 저장소 브랜치에서 이 워크플로를 실행한다.
#     PR 검사(publication-gate)의 scripts/ci/ai-reader-guard.mjs가 그 head 커밋의 workflow_dispatch 성공 실행을 확인한다.
# 이 워크플로는 의존성을 설치하지 않는다(ai-reader.test.mjs는 Node 기본 모듈과 저장소 파일만 쓴다).
on:
  push:
    branches: [master]
    paths:
      - scripts/ocr/ai-reader.mjs
      - scripts/ocr/ai-reader.test.mjs
      - scripts/ocr/ocr-compare.mjs
      - test-fixtures/ocr/**
      - .github/workflows/ai-reader-calibration.yml
  schedule:
    - cron: '23 18 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read  # (평가 브랜치 전용, 병합 안 함) Facebook 미리 보기 실행 로그 원문 읽기
concurrency:
  group: ai-reader-calibration-${{ github.sha }}
  cancel-in-progress: false
jobs:
  ai-reader-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independent AI reader calibration (real posters #4824, #4828)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --experimental-strip-types scripts/ocr/ai-reader.test.mjs
      # 평가 브랜치 전용(#884·#887, 병합 안 함): 회사 이름 AI 읽기 평가 1차(v1)·2차(v2) 지시문 비교.
      # 묶음: 정답 사례 + facebook(1차 평가 20건, run 44026994453) + holdout(평가·규칙 수정에 안 쓴 다른 날 실제 글, run 43949553916·43144064264). DB 접근 없음.
      - name: 회사 이름 AI 읽기 평가(평가만, 운영 반영 없음)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in 44026994453 43949553916 43144064264; do
            jid=$(gh api repos/${{ github.repository }}/actions/runs/$r/jobs --jq '.jobs[0].id')
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$jid/logs" -o /tmp/fb_$r.log
          done
          python3 -I - <<'PY'
          import re, json
          def posts(f):
              out, cur = [], None
              for l in open(f, encoding='utf-8').read().splitlines():
                  t = l[29:] if re.match(r'^\d{4}-\d\d-\d\dT', l) else l
                  if t.startswith('##[group]원문'): cur = {'key': t.split()[-1], 'text': []}; continue
                  if t.startswith('##[endgroup]') and cur: out.append({'key': cur['key'], 'text': '\n'.join(cur['text'])}); cur = None; continue
                  if cur is not None: cur['text'].append(t)
              return out
          main = posts('/tmp/fb_44026994453.log')
          keys, hold = {p['key'] for p in main}, {}
          for r in ('43949553916', '43144064264'):
              for p in posts(f'/tmp/fb_{r}.log'):
                  if p['key'] not in keys: hold.setdefault(p['key'], p)
          json.dump(main, open('/tmp/fbposts.json', 'w'), ensure_ascii=False)
          json.dump(list(hold.values()), open('/tmp/holdout.json', 'w'), ensure_ascii=False)
          print(len(main), len(hold), '건')
          PY
          node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ocr/company-ai-eval.mjs facebook=/tmp/fbposts.json holdout=/tmp/holdout.json
