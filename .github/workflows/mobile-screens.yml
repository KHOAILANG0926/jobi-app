name: 모바일 화면 캡처 (운영, 작업자 확인용)
# Lee 2026-11-11: 작업 세션이 모바일 화면을 직접 볼 수 없어 Lee가 캡처를 보내야 하던 문제 → GitHub에서 핸드폰 크기로 찍어
# 'screens' 브랜치(그림 전용) mobile 칸에 올린다(데모 촬영은 demo 칸, 게시는 scripts/ops/publish-screens.sh 한 곳). 작업자는 git fetch origin screens로 받아 본다.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '찍을 사이트(비우면 운영 https://viecganban.vn). 참고 사이트·데모 주소도 됨'
        required: false
        type: string
      slot:
        description: 'screens 브랜치 칸 이름(비우면 mobile). 예: albamon, demo-mobile'
        required: false
        type: string
      pages:
        description: '찍을 화면 JSON [["이름","/주소"],…] (비우면 우리 기본 화면)'
        required: false
        type: string
      build_ref:
        description: '이 브랜치 코드를 이 실행 안에서 빌드해 찍음(데모는 Vercel 로그인이 막아서). 예: fix/mobile-detail-overflow'
        required: false
        type: string
      detail_link:
        description: '첫 화면에서 찾아 같이 찍을 링크 모양(정규식). 예: /jobs/detail/\d+'
        required: false
        type: string
  workflow_run:
    workflows: ['운영 배포 확인·실제 화면 검사']
    types: [completed]

permissions:
  contents: write

# 칸(slot)마다 따로, 앞 촬영을 지우지 않고 차례로(2026-11-11: 알바몬 촬영이 운영 배포 뒤 자동 촬영에 취소됨)
concurrency:
  group: mobile-screens-${{ inputs.slot || 'mobile' }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 데모 주소는 Vercel 로그인이 막아 찍을 수 없다(2026-11-11 확인) → 브랜치 코드를 여기서 빌드해 띄운다(app-screen-check와 같은 방식).
      # 촬영·게시 스크립트는 위에서 받은 master 것을 그대로 쓴다(브랜치 코드는 build 폴더에서만).
      - name: 브랜치 빌드·띄우기 (build_ref가 있을 때만)
        if: inputs.build_ref
        env:
          REF: ${{ inputs.build_ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "브랜치 이름 형식 아님"; exit 1; }
          git fetch -q --depth 1 origin "refs/heads/$REF:refs/remotes/origin/build-ref"
          git worktree add -q "${{ runner.temp }}/build" origin/build-ref
          cd "${{ runner.temp }}/build" && npm ci && npm run build
          (npx vite preview --port 4173 --strictPort > "${{ runner.temp }}/preview.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          cat "${{ runner.temp }}/preview.log"; exit 1
      - name: 핸드폰 크기 캡처 (아이폰 390·갤럭시 360)
        env:
          BASE_URL: ${{ inputs.build_ref && 'http://localhost:4173' || inputs.base_url || 'https://viecganban.vn' }}
          PAGES: ${{ inputs.pages }}
          LOCALE: ${{ contains(inputs.base_url, 'albamon') && 'ko-KR' || 'vi-VN' }}
          DETAIL_LINK: ${{ inputs.detail_link }}
          OUT: ${{ runner.temp }}/screens
        run: node scripts/ops/mobile-screens.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: screens 브랜치 mobile 칸에 올리기 (데모 촬영 칸은 그대로, Codex #680)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT: ${{ inputs.slot || 'mobile' }}
        run: |
          [[ "$SLOT" =~ ^[a-z0-9-]+$ ]] || { echo "칸 이름은 영문 소문자·숫자·- 만"; exit 1; }
          scripts/ops/publish-screens.sh "${{ runner.temp }}/screens" "$SLOT" "모바일 화면 캡처($SLOT) ${GITHUB_SHA::7}"
