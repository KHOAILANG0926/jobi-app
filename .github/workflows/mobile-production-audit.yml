name: Production mobile audit
on:
  pull_request:
    branches: [master]
    paths:
      - scripts/ops/mobile-production-audit.mjs
      - .github/workflows/mobile-production-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'audit/mobile-production-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect production without application changes
        run: |
          set -o pipefail
          node scripts/ops/mobile-production-audit.mjs 2>&1 | tee mobile-audit-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-mobile-audit
          path: |
            mobile-audit/
            mobile-audit-run.log
          retention-days: 14
          if-no-files-found: error
