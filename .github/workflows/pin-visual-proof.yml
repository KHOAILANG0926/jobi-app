name: 운영 지도 증거 재촬영
on:
  push:
    branches: ['audit/pin-visual-proof-20261021']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ops/pin-visual-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-pin-visual-proof
          path: out
      - name: 원본 캡처 서버 보존
        if: always()
        run: |
          cp -r out /tmp/pin-proof-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pin-proof-output
          git rm -rfq .
          git clean -fdxq
          cp /tmp/pin-proof-out/* .
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A
          git commit -m "production pin screenshots"
          git push origin HEAD:screens-pin-proof-20261021
