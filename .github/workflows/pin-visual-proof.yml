name: 운영 지도 캡처 표시 준비
on:
  push:
    branches: ['audit/pin-visual-proof-20261021']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screens-pin-proof-20261021
      - name: 원본 PNG를 표시용 텍스트로 변환
        run: |
          mkdir -p /tmp/pin-proof-base64
          for f in *.png; do base64 -w0 "$f" > "/tmp/pin-proof-base64/$f.b64.txt"; done
          cp result.json /tmp/pin-proof-base64/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pin-proof-encoded
          git rm -rfq .
          cp /tmp/pin-proof-base64/* .
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A
          git commit -m "unaltered screenshot bytes for visual inspection"
          git push origin HEAD:screens-pin-proof-encoded-20261021
