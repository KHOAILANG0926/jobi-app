name: Business search comparison (VietMap vs Goong, manual, read-only)
# Lee 2026-10-28 (C): compare business-name search providers on public announcements.
# Read-only: anonymous public reads + provider lookups. No DB writes, no pins, no deployment.
# Provider keys stay in Vercel (admin read API); GitHub holds only the existing E2E admin login. Reference point is a run input, never stored.
on:
  workflow_dispatch:
    inputs:
      ref_company: {description: 'Reference company (exact name)', required: false, default: ''}
      ref_lat: {description: 'Reference latitude (reference only, not stored)', required: false, default: ''}
      ref_lng: {description: 'Reference longitude (reference only, not stored)', required: false, default: ''}
      extra_company: {description: 'Extra case company (if not public)', required: false, default: ''}
      extra_address: {description: 'Extra case original address', required: false, default: ''}
      confirm_compare: {description: '확인할 공고 없이 기준 공고 전체 비교(Google 여러 번 호출) — Lee 확인 후에만 true', type: boolean, required: false, default: false}
permissions:
  contents: read
# Lee 2026-11-06: Google 키는 운영(크롤러 위치 확인)과 같은 한도를 쓴다 — 같은 검색은 동시에 돌리지 않는다(앞 실행이 끝날 때까지 대기).
concurrency:
  group: business-search-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 많이 묻는 비교는 Lee 확인 후에만
        env:
          EXTRA_COMPANY: ${{ inputs.extra_company }}
          EXTRA_ADDRESS: ${{ inputs.extra_address }}
          CONFIRM: ${{ inputs.confirm_compare }}
        run: |
          if { [ -z "$EXTRA_COMPANY" ] || [ -z "$EXTRA_ADDRESS" ]; } && [ "$CONFIRM" != true ]; then
            echo "::error title=비교 검색 차단::확인할 공고(extra_company·extra_address)를 넣으면 그 1건만 묻습니다. 기준 공고 전체 비교는 Google을 여러 번 불러 운영 한도를 쓰므로 Lee 확인 후 confirm_compare=true로만 실행합니다."
            exit 1
          fi
      - name: Compare providers
        env:
          ADMIN_E2E_EMAIL: ${{ secrets.ADMIN_E2E_EMAIL }}
          ADMIN_E2E_PASSWORD: ${{ secrets.ADMIN_E2E_PASSWORD }}
          REF_COMPANY: ${{ inputs.ref_company }}
          REF_LAT: ${{ inputs.ref_lat }}
          REF_LNG: ${{ inputs.ref_lng }}
          EXTRA_COMPANY: ${{ inputs.extra_company }}
          EXTRA_ADDRESS: ${{ inputs.extra_address }}
        run: node --experimental-strip-types --import ./scripts/ts-extensionless-register.mjs scripts/ops/business-search-compare.mjs
